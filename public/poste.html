/**
 * Graduation des heures de l'agenda (Jour et Semaine) selon le « Pas des créneaux » réglé dans Rendez-vous > Paramètres
 * (5, 10, 15, 30 min...). Un trait à chaque pas (si la place le permet), l'heure écrite à chaque heure pleine, et les
 * minutes (09:05, 09:10...) dès que le zoom laisse assez de place.
 */
function pdTimeScale(R0, R1, PX) {
  var step = rdvSlotStepMin > 0 ? rdvSlotStepMin : 15;
  // Intervalles « ronds » (5, 10, 15, 30, 60 min…) multiples du pas, assez espacés pour rester lisibles.
  var nice = [step].concat([10, 15, 30, 60].filter(function (x) { return x > step && x % step === 0; })).concat(step < 60 ? [] : [step]);
  var pick = function (minPx) { for (var i = 0; i < nice.length; i++) if (nice[i] * PX >= minPx) return nice[i]; return 60; };
  var lineEvery = pick(6), labelEvery = pick(20);
  var lines = '', hours = '';
  for (var m = R0; m <= R1; m += step) {
    var y = Math.round((m - R0) * PX), full = !(m % 60), off = m - R0;
    if (full || !(off % lineEvery)) lines += '<div class="pd-line' + (full ? '' : (m % 30 ? ' step' : ' half')) + '" style="top:' + y + 'px"></div>';
    if (full) hours += '<div class="pd-hour" style="top:' + y + 'px">' + pdHM(m) + '</div>';
    else if (labelEvery < 60 && !(off % labelEvery) && (60 - m % 60) * PX >= 14) hours += '<div class="pd-hour minor" style="top:' + y + 'px">' + pdHM(m) + '</div>';
  }
  return { lines: lines, hours: hours, step: step };
}

/** Recherche dans les RDV chargés (mois affiché + les 2 suivants) : nom, email ou téléphone. */
function pdRunSearch(keepClosed) {
  var q = normText(pdQuery.trim()), qDigits = pdQuery.replace(/\D/g, '');
  var dateStr = ymd(calAnchor);
  // Période affichée : le jour, la semaine ou le mois (pour « Ce jour / Cette semaine / Ce mois »).
  var pFrom = dateStr, pTo = dateStr, pLabel = 'Ce jour';
  if (calViewMode === 'week') { pFrom = ymd(startOfWeek(calAnchor)); pTo = ymd(addDays(startOfWeek(calAnchor), 6)); pLabel = 'Cette semaine'; }
  else if (calViewMode === 'month') { pFrom = ymd(new Date(calAnchor.getFullYear(), calAnchor.getMonth(), 1)); pTo = ymd(new Date(calAnchor.getFullYear(), calAnchor.getMonth() + 1, 0)); pLabel = 'Ce mois'; }
  document.querySelectorAll('#cal-day-view [data-q], #cal-days [data-q]').forEach(function (el) {
    var hit = q && ((el.getAttribute('data-q') || '').indexOf(q) > -1 || (qDigits.length >= 3 && (el.getAttribute('data-q') || '').indexOf(qDigits) > -1));
    el.classList.toggle('pd-hit', !!hit);
    el.classList.toggle('pd-dim', !!q && !hit);
  });
  var box = document.getElementById('pd-results');
  if (!box) return;
  if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
  if (!pdExtraLoaded) {
    pdExtraLoaded = true;
    var base = new Date(calAnchor.getFullYear(), calAnchor.getMonth(), 1);
    var keys = [1, 2].map(function (n) { return monthKey(new Date(base.getFullYear(), base.getMonth() + n, 1)); }).filter(function (k) { return !calMonthCache[k]; });
    Promise.all(keys.map(function (k) {
      return barberApi('/api/appointments?month=' + k + '&all=1&caisse_view=1').then(function (r) { calMonthCache[k] = r.items; }).catch(function () {});
    })).then(function () { if (pdQuery.trim()) pdRunSearch(true); });
  }
  if (keepClosed && box.style.display === 'none' && document.activeElement && document.activeElement.id !== 'pd-search') return;
  var seen = {}, found = [];
  Object.keys(calMonthCache).forEach(function (k) {
    (calMonthCache[k] || []).forEach(function (a) {
      if (seen[a.id] || a.status === 'cancelled') return;
      var hay = normText([a.client_name, a.email].join(' '));
      var ok = hay.indexOf(q) > -1 || (qDigits.length >= 3 && String(a.phone || '').replace(/\D/g, '').indexOf(qDigits) > -1);
      if (ok) { seen[a.id] = true; found.push(a); }

  });

  var inP = function (a) { var x = a.scheduled_at.slice(0, 10); return x >= pFrom && x <= pTo; };
  var sameDay = found.filter(inP).sort(function (x, y) { return x.scheduled_at < y.scheduled_at ? -1 : 1; });
  var others = found.filter(function (a) { return !inP(a); });
  var upcoming = others.filter(function (a) { return a.scheduled_at.slice(0, 10) >= today; }).sort(function (x, y) { return x.scheduled_at < y.scheduled_at ? -1 : 1; });
  var older = others.filter(function (a) { return a.scheduled_at.slice(0, 10) < today; }).sort(function (x, y) { return x.scheduled_at > y.scheduled_at ? -1 : 1; });
  var row = function (a, goLabel) {
    var d = a.scheduled_at.slice(0, 10);
    var dayTxt = d === dateStr && calViewMode === 'day' ? '' : new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'long' }) + ' · ';
    return '<button type="button" class="pd-res" onclick="pdGoTo(\'' + a.id + '\')">' +

/* ---------- Planning du jour (timeline par coiffeur), repris de la caisse ---------- */
var timelineZoom = 1;
var rdvSlotStepMin = 15;
var TIMELINE_LABEL_PX = 44;
var timelineMinZoom = 0.6;
var timelineEffectiveZoom = null;
var salonScheduleByWeekday = null;
var agendaNowLineTimer = null;

// Une frise LARGE (pas fin) depasse l'ecran : au lieu de l'ouvrir sur le matin, on la centre sur le trait
// "maintenant" quand on regarde AUJOURD'HUI. Se declenche des qu'une frise apparait dans la page, quel que
// soit l'endroit qui l'affiche (aucun appel a ajouter nulle part).
(function installTimelineAutoScroll() {
  function scrollToNow(sc) {
    var now = sc.querySelector('.timeline-now-line');
    // Un debordement de quelques pixels (le dernier libelle) ne justifie pas de decaler la frise (cela
    // cacherait la colonne de gauche) : on ne centre que si elle est VRAIMENT plus large que l'ecran.
    if (!now || sc.scrollWidth - sc.clientWidth < 80) return;
    sc.scrollLeft = Math.max(0, now.offsetLeft - sc.clientWidth / 2);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        if (n.classList.contains('timeline-scroll')) scrollToNow(n);
        else if (n.querySelectorAll) n.querySelectorAll('.timeline-scroll').forEach(scrollToNow);
      });
    });
  }).observe(document.body || document.documentElement, { childList: true, subtree: true });
})();

function loadRdvSlotStep() {
  var headers = SALON_SLUG ? { 'X-Salon-Slug': SALON_SLUG } : {};
  return fetch('/api/settings/public', { headers: headers })

    .then(function (d) { rdvSlotStepMin = Number(d.rdv_slot_step_min) || 15; })
    .catch(function () {});
}

function timeStrToMinutes(t) { var hm = t.slice(0, 5).split(':'); return Number(hm[0]) * 60 + Number(hm[1]); }

function loadSalonScheduleForTimeline() {
  if (salonScheduleByWeekday) return Promise.resolve(salonScheduleByWeekday);
  return barberApi('/api/salon-calendar/schedule').then(function (r) {
    salonScheduleByWeekday = {};
    (r.schedules || []).forEach(function (x) {
      if (!x.active) return;
      salonScheduleByWeekday[x.weekday] = { startMin: timeStrToMinutes(x.start_time), endMin: timeStrToMinutes(x.end_time) };
    });
    return salonScheduleByWeekday;
  }).catch(function () { salonScheduleByWeekday = {}; return salonScheduleByWeekday; });
}

/** Coiffeurs affichés : tous ceux qui prennent des RDV (moi en premier), plus ceux qui ont un RDV ce jour-là. */
function posteTimelineBarbers(appts) {
  var list = (barbers || []).filter(function (b) { return b.accepts_appointments || (me && b.id === me.id); });
  appts.forEach(function (a) {
    if (a.barber_id && !list.some(function (b) { return b.id === a.barber_id; })) {
      list.push({ id: a.barber_id, name: a.barber_name || 'Coiffeur', accepts_appointments: 0 });
    }
  });
  if (me && !list.some(function (b) { return b.id === me.id; })) list.push({ id: me.id, name: me.name, accepts_appointments: 1 });
  return list.sort(function (x, y) {
    if (me && x.id === me.id) return -1;
    if (me && y.id === me.id) return 1;
    return String(x.name).localeCompare(String(y.name));
  });
}

function renderAgendaTimeline(dateStr) {
  // Salon fermé ce jour : pas de planning, le message rouge (posteAddBtnHtml) suffit.
  if (rdvIsSalonClosed(dateStr)) return '';
  var d = new Date(dateStr + 'T00:00:00');
  var appts = apptsForRange(d, d);
  appts.forEach(function (a) { calApptById[a.id] = a; });
  var rowsBarbers = posteTimelineBarbers(appts);

  var items = appts.map(function (a) {
    var hm = a.scheduled_at.slice(11, 16).split(':');
    return { id: a.id, barberId: a.barber_id, clientName: a.client_name, serviceName: a.service_name,
      startMin: Number(hm[0]) * 60 + Number(hm[1]), durMin: Math.max(a.duration_min || 30, 15), timeLabel: a.scheduled_at.slice(11, 16) };
  });

  // Plage horaire = heures d'ouverture du salon ce jour-là, élargie seulement si un RDV en dépasse.
  var weekday = d.getDay();
  var salonDay = salonScheduleByWeekday && salonScheduleByWeekday[weekday];
  var starts = items.map(function (it) { return it.startMin; }), ends = items.map(function (it) { return it.startMin + it.durMin; });
  var baseStart = salonDay ? salonDay.startMin : (starts.length ? Math.floor(Math.min.apply(null, starts) / 60) * 60 : 9 * 60);
  var baseEnd = salonDay ? salonDay.endMin : (ends.length ? Math.ceil(Math.max.apply(null, ends) / 60) * 60 : 19 * 60);
  var rangeStart = Math.floor(Math.min.apply(null, [baseStart].concat(starts)) / 60) * 60;
  var rangeEnd = Math.ceil(Math.max.apply(null, [baseEnd].concat(ends)) / 60) * 60;
  if (rangeEnd - rangeStart < 4 * 60) rangeEnd = rangeStart + 4 * 60;
  var hourCount = (rangeEnd - rangeStart) / 60;

  var stepMin = rdvSlotStepMin > 0 ? rdvSlotStepMin : 15;
  var hoursHtml = '';
  for (var t = rangeStart; t <= rangeEnd; t += stepMin) {
    var tFrac = (t - rangeStart) / (rangeEnd - rangeStart);
    hoursHtml += '<span data-m="' + t + '"' + (t % 60 === 0 ? ' class="h"' : '') + ' style="left: calc(22px + (100% - 22px) * ' + tFrac + ')">' +
      String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0') + '</span>';
  }

  var rowsHtml = rowsBarbers.map(function (b) {
    var color = barberColor(b.id);
    var blocksHtml = items.filter(function (it) { return it.barberId === b.id; }).map(function (it) {
      var leftPct = ((it.startMin - rangeStart) / (rangeEnd - rangeStart)) * 100;
      var widthPct = (it.durMin / (rangeEnd - rangeStart)) * 100;
      return '<div class="timeline-block" style="left:' + leftPct + '%;width:' + widthPct + '%;background:' + color + '" ' +
        'title="' + esc(it.timeLabel + ' — ' + it.clientName + ' — ' + (it.serviceName || '') + ' — ' + b.name) + '" ' +
        'onclick="event.stopPropagation();openPosteClientDrawer(\'' + it.id + '\')">' +
        '<span class="tb-time">' + esc(it.timeLabel) + '</span><span class="tb-name">' + esc(it.clientName) + '</span></div>';
    }).join('');
    var rowB = (barbers || []).find(function (x) { return x.id === b.id; });
    var walkDay = isWalkinOn(rowB, dateStr);
    var offWhy = rowB && !walkDay ? barberOffReason(rowB, dateStr) : '';
    var trackClick = (rdvIsSalonClosed(dateStr) || isPastDay(dateStr)) ? ''
      : offWhy ? ' onclick="toast(\'' + esc(String(b.name).replace(/'/g, '')) + ' ' + esc(offWhy).replace(/'/g, '') + ' : pas de rendez-vous possible.\', true)"'
      : walkDay ? ' onclick="toast(\'' + esc(String(b.name).replace(/'/g, '')) + ' est en « sans RDV » ce jour-là : pas de rendez-vous\', true)"'
      : b.accepts_appointments || (me && b.id === me.id)
      ? ' onclick="openPosteAddAppointment(\'' + dateStr + '\',\'' + b.id + '\')" title="Ajouter un RDV pour ' + esc(b.name) + '"'
      : ' onclick="toast(\'' + esc(String(b.name).replace(/'/g, '')) + ' ne prend pas de RDV en ligne\', true)"';
    return '<div class="timeline-row">' +
      '<div class="timeline-row-label" title="' + esc(b.name) + '"><span class="dot" style="background:' + color + '"></span></div>' +
      '<div class="timeline-row-track"' + trackClick + '>' + blocksHtml + '</div>' +
      '</div>';
  }).join('');

  var nowLineHtml = '';
  var nowStr = nowSalonDatetimeString();
  if (dateStr === nowStr.slice(0, 10)) {
    var nowMin = Number(nowStr.slice(11, 13)) * 60 + Number(nowStr.slice(14, 16));
    if (nowMin >= rangeStart && nowMin <= rangeEnd) {
      nowLineHtml = '<div class="timeline-now-line" title="Maintenant — ' + nowStr.slice(11, 16) + '" ' +
        'style="left: calc(22px + (100% - 22px) * ' + ((nowMin - rangeStart) / (rangeEnd - rangeStart)) + ')"></div>';
    }
  }
  var stepPct = (stepMin / (rangeEnd - rangeStart)) * 100, hourPct = (60 / (rangeEnd - rangeStart)) * 100;
  var minuteGridHtml = '<div class="timeline-minute-grid" style="background-size:' + stepPct + '% 100%, ' + hourPct + '% 100%"></div>';

  var labelsPerHour = 60 / stepMin;
  var fitPerHour = Math.max(90, labelsPerHour * TIMELINE_LABEL_PX);
  var minZoom = Math.max(0.6, (labelsPerHour * TIMELINE_LABEL_PX) / fitPerHour);
  var effZoom = Math.max(0, timelineZoom);
  var compact = effZoom < minZoom;
  timelineMinZoom = 0; timelineEffectiveZoom = effZoom;
  var innerWidth = Math.round(hourCount * fitPerHour * effZoom);
  if (compact) {
    var shown = document.querySelector('.timeline-scroll');
    var avail = (shown && shown.clientWidth) || 900;
    var readable = Math.round(hourCount * fitPerHour * minZoom);
    innerWidth = readable <= avail ? 0 : Math.round(avail + (readable - avail) * (effZoom / minZoom));
  }
  var zoomCtrl = timelineZoomCtrlHtml(effZoom);   // curseur de zoom (app.js)
  return zoomCtrl + '<div class="timeline-scroll"><div class="timeline-inner' + (compact ? ' compact' : '') + (effZoom === 0 ? ' fit' : '') + '" ' +
    'data-date="' + dateStr + '" data-range-start="' + rangeStart + '" data-range-end="' + rangeEnd + '" ' +
    'data-hours="' + hourCount + '" data-fit="' + fitPerHour + '" data-minzoom="' + minZoom + '" data-step="' + stepMin + '" style="min-width:' + innerWidth + 'px">' +
    '<div class="timeline-hours">' + hoursHtml + '</div>' + minuteGridHtml + rowsHtml + nowLineHtml +
    '</div></div>';
}

/** Déplace juste la ligne « maintenant », sans reconstruire le reste. */
function updateAgendaNowLines() {

  document.querySelectorAll('.timeline-inner[data-range-start]').forEach(function (inner) {
    var rs = Number(inner.dataset.rangeStart), re = Number(inner.dataset.rangeEnd);

    if (!line) { line = document.createElement('div'); line.className = 'timeline-now-line'; inner.appendChild(line); }

      // Fin du parcours (Enregistrer) ou debut d'un RDV a plusieurs (le client d'abord, pour ses proches).
      var group = mode === 'group';
      overlay.querySelectorAll('.pa-final-only').forEach(function (el) { el.style.display = group ? 'none' : ''; });
      overlay.querySelector('#pa-error').style.display = 'none';
      overlay.querySelector('#pa-step-client .sgb-who-choice').style.display = group ? '' : 'none';
      setTimeout(function () { var n = overlay.querySelector('#pa-name'); if (n) n.focus(); }, 60);
      if (group) return;
      var s = svcOffer.find(function (x) { return x.id === state.serviceId; });
      var exN = extOffer.filter(function (x) { return state.extraIds.indexOf(String(x.id)) !== -1; }).map(function (x) { return x.name; });
      overlay.querySelector('#pa-contact-summary').textContent = when + ' à ' + state.time + ' — ' + (s ? s.name : svcLabel('', exN));
    }
  };

  window.paStartSolo = function () { paGoStep('service'); };

  // Prestations, supplements et produits : memes cartes de vitrine que la reservation en ligne (code partage dans app.js).
  function paListCfg(kind) {
    return {
      kind: kind, gridId: 'pa-' + kind + '-grid', searchId: 'pa-' + kind + '-search', qId: 'pa-' + kind + '-q', emptyId: 'pa-' + kind + '-empty', summaryId: 'pa-' + kind + '-summary',
      items: kind === 'extras' ? extOffer : products.filter(function (p) { return p.online_bookable !== 0; }),   // « caisse seulement » : pas proposé dans un RDV
      chosen: kind === 'extras' ? state.extraIds : state.productIds,
      onclick: kind === 'extras' ? 'paToggleExtra(this)' : 'paToggleProduct(this)'
    };
  }
  vitrineRender({ kind: 'services', gridId: 'pa-service-grid', items: svcOffer, chosen: [], onclick: 'paSelectService(this)' });
  // « Seulement un supplement » : premiere carte (s'il y a des supplements chez ce coiffeur).
  if (extOffer.length) overlay.querySelector('#pa-service-grid').insertAdjacentHTML('afterbegin', extrasOnlyCardHtml(false, 'paSelectService(this)'));
  vitrineRender(paListCfg('extras'));
  vitrineRender(paListCfg('products'));
  window.paFilter = function (kind) { vitrineFilter(paListCfg(kind)); };

  window.paSelectService = function (el) {
    state.serviceId = el.dataset.id;
    vitrineSelectOne(el);
    overlay.querySelector('#pa-extras-title').textContent = state.serviceId === EXTRAS_ONLY ? 'Quel supplément ? (au moins un)' : 'Suppléments (optionnels)';
    paGoStep('extras');
  };
  // « Seulement un supplement » : au moins un supplement avant la suite.
  window.paExtrasNext = function () {
    if (state.serviceId === EXTRAS_ONLY && !state.extraIds.length) { toast('Choisissez au moins un supplément', true); return; }
    paGoStep('datetime');
  };

  window.paToggleExtra = function (el) {
    var id = el.dataset.id;
    var i = state.extraIds.indexOf(id);
    if (i === -1) state.extraIds.push(id); else state.extraIds.splice(i, 1);
    vitrineToggle(el);
    vitrineSummary(paListCfg('extras'));
  };

  // Un seul exemplaire par produit depuis ce parcours (comme sur rdv.html) - le coiffeur ajuste la quantite
  // lui-meme a la caisse si besoin de plus.
  window.paToggleProduct = function (el) {
    var id = el.dataset.id;
    var i = state.productIds.indexOf(id);
    if (i === -1) state.productIds.push(id); else state.productIds.splice(i, 1);
    vitrineToggle(el);
    vitrineSummary(paListCfg('products'));
  };

    var slotsByHalf = { morning: [], afternoon: [] };
  var currentHalf = 'afternoon';

  function paRenderHalf() {
    var slotsEl = overlay.querySelector('#pa-slots');
    var list = slotsByHalf[currentHalf];
    slotsEl.innerHTML = list.length
      ? list.map(function (s) {
          return '<button class="aa-slot" data-time="' + s.time + '" onclick="paSelectSlot(this)">' + s.time + '</button>';
        }).join('')
      : '<span class="hint" style="margin:0">Aucun créneau ' + (currentHalf === 'morning' ? 'le matin' : "l'après-midi") + '</span>';
  }

  window.paShowHalf = function (half) {
    currentHalf = half;
    overlay.querySelector('#pa-half-morning').classList.toggle('sel', half === 'morning');
    overlay.querySelector('#pa-half-afternoon').classList.toggle('sel', half === 'afternoon');
    paRenderHalf();
  };

  // Coiffeurs au-dessus des creneaux (meme regle partout) : tous ceux qui font la prestation choisie, meme absents ce
  // jour-la (estompes, « indisponible ») ; on change de coiffeur sans refaire la prise de RDV.
  function paEligibleBarbers() {
    return (barbers || []).filter(function (b) {
      return b.accepts_appointments && b.active !== 0 && hasBookableSchedule(b) && barberDoesChoice(b, state.serviceId, state.extraIds, services, extras, EXTRAS_ONLY);
    });
  }
  function paRenderDtBarbers() {
    overlay.querySelector('#pa-dt-barbers').innerHTML = barberChipsHtml({ list: paEligibleBarbers(), all: (barbers || []), selected: targetId, dateStr: dateStr, onPick: 'paPickDtBarber', any: false });
  }
  window.paPickDtBarber = function (id) {
    if (String(targetId) === String(id)) return;
    targetId = id;
    target = (barbers || []).find(function (b) { return String(b.id) === String(id); }) || null;
    svcOffer = barberItems(target, 'services', services);
    extOffer = barberItems(target, 'extras', extras);
    state.time = null;
    forOther = !!(me && targetId !== me.id);
    var tb = overlay.querySelector('#pa-title-barber'); if (tb) tb.textContent = target ? target.name + ' — ' : '';
    paLoadSlots();
  };

  function paLoadSlots() {
    var slotsEl = overlay.querySelector('#pa-slots');
    var toggleEl = overlay.querySelector('#pa-half-toggle');
    toggleEl.style.display = 'none';
    paRenderDtBarbers();
    if (target && barberOffOn(target, dateStr)) { slotsEl.innerHTML = barberOffSlotsHtml(target, dateStr, false); return; }
    slotsEl.innerHTML = '<span class="hint" style="margin:0">Chargement…</span>';
    barberApi('/api/appointments/availability?date=' + dateStr + '&service_id=' + state.serviceId + '&barber_id=' + targetId + '&extras=' + state.extraIds.join(','), { actingAs: targetId })
      .then(function (r) {
        if (!r.slots.length) { slotsEl.innerHTML = '<span class="hint" style="margin:0">Aucun créneau disponible ce jour-là</span>'; return; }

        slotsByHalf.morning = r.slots.filter(function (s) { return s.time < '12:00'; });
        slotsByHalf.afternoon = r.slots.filter(function (s) { return s.time >= '12:00'; });

        if (!slotsByHalf.morning.length) {
          toggleEl.style.display = 'none';
          currentHalf = 'afternoon';
          paRenderHalf();
        } else {
          toggleEl.style.display = 'flex';
          paShowHalf('morning');
        }
      })
      .catch(function (e) { slotsEl.innerHTML = ''; toast(e.message, true); });
  }

  window.paSelectSlot = function (el) {
    state.time = el.dataset.time;
    overlay.querySelectorAll('#pa-slots .aa-slot').forEach(function (c) { c.classList.remove('sel'); });
    el.classList.add('sel');
    paGoStep('products');
  };

  overlay.querySelector('#pa-close-x').onclick = function () { _closeModal(overlay); };
  overlay.querySelector('#pa-cancel-btn').onclick = function () { _closeModal(overlay); };

  overlay.querySelector('#pa-save-btn').onclick = function () {
    var errEl = overlay.querySelector('#pa-error');
    var name = overlay.querySelector('#pa-name').value.trim();
    if (!name) { StaffGroupBooking.readClient(overlay, 'pa'); return; }

    barberApi('/api/appointments/admin-create', {
      method: 'POST',
      actingAs: targetId,   // RDV au nom du coiffeur choisi (moi ou un collègue)
      body: {
        barber_id: targetId,
        client_name: name,
        email: overlay.querySelector('#pa-email').value.trim(),
        phone: overlay.querySelector('#pa-phone').value.trim(),
        service_id: state.serviceId, extras: state.extraIds,
        products: state.productIds.map(function (id) { return { id: id, quantity: 1 }; }),
        date: dateStr, time: state.time,
        base_url: window.location.origin + '/rdv.html'
      }
    }).then(function () {
      _closeModal(overlay);
      toast(forOther && target ? 'RDV ajouté pour ' + target.name : 'RDV ajouté');
      Object.keys(calMonthCache).forEach(function (k) { delete calMonthCache[k]; });
      loadAgendaPeriod();
    }).catch(function (e) { errEl.textContent = e.message; errEl.style.display = 'block'; });
  };
  paGoStep('service');   // 1re etape : la prestation
}

/** Clic sur un RDV de la frise de l'Agenda : tiroir à droite, comme dans la caisse. */
function openPosteClientDrawer(id) {
  var a = calApptById[id];
  if (!a) return;
  openApptDrawer(a);
}

/* ---------- Tiroir client d'un RDV (comme dans le dashboard) ----------
   Repris de la caisse. S'ouvre à droite au clic sur un RDV de la frise de l'Agenda :
   le coiffeur peut y modifier les coordonnées, déplacer le RDV, l'annuler et écrire une note interne. */
var adAppt = null;      // le RDV affiché (forme /api/appointments)
var adQueueId = null;   // ligne de file liée (RDV du jour déjà promu) - nécessaire pour modifier les coordonnées / la note

function adIsUpcoming(a) {
  return a.status !== 'cancelled' && a.source !== 'walkin' && a.display_status !== 'completed' && a.display_status !== 'no_show' &&
    String(a.scheduled_at) > nowSalonDatetimeString();
}

function adWhenLabel(a) {
  var d = new Date(String(a.scheduled_at).replace(' ', 'T')).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' });
  return d.charAt(0).toUpperCase() + d.slice(1) + ' à ' + String(a.scheduled_at).slice(11, 16);
}

function adRenderInfo() {
  var a = adAppt;
  document.getElementById('ad-name').textContent = a.client_name;
  document.getElementById('ad-badge').innerHTML = apptBadgeHtml(a);
  document.getElementById('ad-info').innerHTML = apptInfoRowsHtml(a);   // memes lignes partout (app.js)
}


var AD_STATUS_LABEL = { waiting: 'En attente', in_progress: 'En cours', done: 'Terminé', cancelled: 'Absent / annulé' };
var AD_STATUS_COLOR = { waiting: 'var(--grey)', in_progress: 'var(--blue)', done: 'var(--green)', cancelled: 'var(--red)' };

function adRenderMarketing(r) {
  var parts = [];
  if (r.loyalty && r.loyalty.activated) {
    parts.push('<div class="detail-row"><span class="detail-label">⭐ Fidélité</span><span class="detail-value">' +
      r.loyalty.points + ' point' + (r.loyalty.points > 1 ? 's' : '') + '</span></div>' + loyaltyTiersHtml(r.loyalty));
  } else {
    parts.push('<div class="hint" style="margin:0 0 4px">Carte de fidélité non activée</div>');
  }
  (r.gifts || []).forEach(function (g) {
    var itemsList = (g.items || []).map(function (it) { return it.quantity + ' × ' + it.item_name; }).join(', ');
    parts.push('<div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:2px">' +
      '<span class="detail-label" style="color:' + (g.used_at ? 'var(--grey)' : 'var(--green)') + '">' + (g.used_at ? '🎁 Cadeau utilisé' : '🎁 Cadeau disponible') + ' (' + eur(g.amount_cents) + ')</span>' +
      '<span class="detail-value" style="font-weight:400">' + esc(itemsList) + '</span></div>');
  });
  document.getElementById('ad-marketing-content').innerHTML = parts.join('');
  document.getElementById('ad-marketing-section').style.display = 'block';
}

/** Les deux paliers (prestation / produit) : disponible, ou combien de points il manque. */
function loyaltyTiersHtml(l) {
  var t = l.thresholds, rw = l.rewards || {};
  if (!t) return '';
  var row = function (label, ok, need) {
    return '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value" style="color:' + (ok ? 'var(--green)' : 'var(--grey)') + '">' +
      (ok ? 'Remise disponible' : (need - l.points) + ' point' + (need - l.points > 1 ? 's' : '') + ' avant la remise (' + need + ')') + '</span></div>';
  };
  return row('Remise prestation', rw.service, t.service) + row('Remise produit', rw.product, t.product);
}

function adSourceIcon(v) {
  var walkin = v.source === 'walkin';
  return '<span title="' + (walkin ? 'Sans RDV (passage au salon)' : 'RDV en ligne') + '" style="display:inline-flex;vertical-align:middle;color:var(--blue);margin-right:4px">' + (walkin ? '🚶' : '📅') + '</span>';
}

function adRenderVisits(items) {
  document.getElementById('ad-visit-count').textContent = items.length + (items.length > 1 ? ' passages au total' : ' passage au total');
  document.getElementById('ad-visits').innerHTML = items.length === 0
    ? '<div class="empty">Aucun passage enregistré</div>'
    : items.slice(0, 4).map(function (v) {
        var when = new Date(v.checkin_at).toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        var mins = (v.start_at && v.end_at) ? Math.round((new Date(v.end_at) - new Date(v.start_at)) / 60000) : 0;
        return '<div class="ad-visit-row"><div class="ad-visit-date">' + adSourceIcon(v) + when + '</div>' +
          '<div class="ad-visit-meta">' + esc(v.service_name || 'Prestation') +
          (v.total_price_cents ? ' · ' + eur(v.total_price_cents) : '') +
          ' · <span style="color:' + (AD_STATUS_COLOR[v.status] || 'var(--grey)') + '">' + esc(AD_STATUS_LABEL[v.status] || v.status) + '</span>' +
          (mins > 0 ? ' · ' + formatMinutes(mins) : '') + '</div></div>';
      }).join('');
}

/** Charge fidélité/cadeaux + historique des passages du client du tiroir (comme dans le dashboard). */
function adLoadDetails(a, queueId) {
  var token = a.id;
  document.getElementById('ad-marketing-section').style.display = 'none';
  document.getElementById('ad-visit-count').textContent = '';
  document.getElementById('ad-visits').innerHTML = '<div class="hint" style="margin:0">Chargement…</div>';
  var qs = 'email=' + encodeURIComponent(a.email || '') + '&phone=' + encodeURIComponent(a.phone || '') + '&name=' + encodeURIComponent(a.client_name || '');
  barberApi('/api/owner/client-marketing?' + qs).then(function (r) {
    if (adAppt && adAppt.id === token) adRenderMarketing(r);
  }).catch(function () {});
  var url = queueId ? '/api/queue/' + queueId + '/client-history' : '/api/queue/client-history-by-contact?' + qs;
  barberApi(url).then(function (r) {
    if (adAppt && adAppt.id === token) adRenderVisits(r.items || []);
  }).catch(function (e) {
    document.getElementById('ad-visits').innerHTML = '<div class="empty">Historique indisponible</div>';
  });
}

function openApptDrawer(a) {
  adAppt = a;
  adQueueId = a.promoted_queue_id || null;
  document.getElementById('ad-edit-section').style.display = 'none';
  document.getElementById('ad-info').style.display = 'block';
  // Le crayon n'existe que pour un RDV déjà dans la file (jour J) : avant, il n'y a pas encore de fiche à modifier.
  document.getElementById('ad-edit-btn').style.display = (adQueueId && a.status !== 'cancelled') ? 'flex' : 'none';
  document.getElementById('ad-actions').style.display = adIsUpcoming(a) ? 'flex' : 'none';
  adRenderInfo();
  var noteBox = document.getElementById('ad-note-box');
  if (adQueueId) {
    noteBox.innerHTML =
      '<textarea id="ad-note" rows="3" placeholder="Ex: préfère dégradé américain, allergie...">' + esc(a.note || '') + '</textarea>' +
      '<button class="btn btn-soft" style="margin-top:8px" onclick="adSaveNote()">Enregistrer la note</button>';
  } else {
    noteBox.innerHTML = '<p class="hint" style="margin:0">Pas encore modifiable — ce RDV entrera dans la file le jour même.</p>';
  }
  adLoadDetails(a, adQueueId);
  document.getElementById('appt-drawer-backdrop').classList.add('on');
  _lockBodyScroll();
}

function closeApptDrawer() {
  var backdrop = document.getElementById('appt-drawer-backdrop');
  var wasOpen = backdrop.classList.contains('on');
  backdrop.classList.remove('on');
  if (wasOpen) _unlockBodyScroll();
  adAppt = null; adQueueId = null;
}

/** Rafraîchit l'agenda et la file après une modification. */
function adRefreshViews() {
  Object.keys(calMonthCache).forEach(function (k) { delete calMonthCache[k]; });
  if (calBooted) loadAgendaPeriod();
  refresh();
}

function adToggleEdit() {
  var editing = document.getElementById('ad-edit-section').style.display !== 'none';
  document.getElementById('ad-edit-section').style.display = editing ? 'none' : 'block';
  document.getElementById('ad-info').style.display = editing ? 'block' : 'none';
  if (!editing && adAppt) {
    document.getElementById('ad-edit-name').value = adAppt.client_name || '';
    document.getElementById('ad-edit-email').value = adAppt.email || '';
    document.getElementById('ad-edit-phone').value = adAppt.phone || '';
  }
}

function adSaveInfo() {
  if (!adAppt || !adQueueId) return;
  var name = document.getElementById('ad-edit-name').value.trim();
  if (!name) { toast('Le nom est requis', true); return; }
  var email = document.getElementById('ad-edit-email').value.trim();
  var phone = document.getElementById('ad-edit-phone').value.trim();
  barberApi('/api/queue/' + adQueueId, { method: 'PUT', body: { client_name: name, email: email, phone: phone }, actingAs: adAppt.barber_id || undefined })
    .then(function () {
      adAppt.client_name = name; adAppt.email = email; adAppt.phone = phone;
      adRenderInfo(); adToggleEdit();
      toast('Client mis à jour');
      adRefreshViews();
    })
    .catch(function (e) { toast(e.message, true); });
}

function adSaveNote() {
  if (!adAppt || !adQueueId) return;
  var note = document.getElementById('ad-note').value;
  barberApi('/api/queue/' + adQueueId + '/note', { method: 'PUT', body: { note: note }, actingAs: adAppt.barber_id || undefined })
    .then(function () { adAppt.note = note; toast('Note enregistrée'); })
    .catch(function (e) { toast(e.message, true); });
}

function adCancel() {
  var a = adAppt;
  if (!a) return;
  // Double confirmation pour une action irréversible et visible du client (email d'annulation envoyé) : une première
  // confirmation simple, puis une seconde où il faut taper "ANNULER" en toutes lettres - protège d'un clic accidentel sur un écran partagé.
  showConfirm('Annuler le RDV de ' + a.client_name + ' (' + adWhenLabel(a) + ') ?', { title: 'Annuler ce RDV', danger: true, confirmLabel: 'Continuer' })
    .then(function (ok) {
      if (!ok) return;
      return showPrompt('Tape ANNULER pour confirmer définitivement.', { title: 'Confirmation finale', requireExact: 'ANNULER', danger: true, confirmLabel: 'Annuler le RDV' });
    })
    .then(function (confirmed) {
      if (!confirmed) return;
      return barberApi('/api/appointments/' + a.id + '/admin-cancel', { method: 'POST', body: {}, actingAs: a.barber_id || undefined })
        .then(function () {
          closeApptDrawer();
          toast('RDV annulé');
          adRefreshViews();
        });
    })
    .catch(function (e) { if (e) toast(e.message, true); });
}

/**
 * Déplace le RDV vers un autre créneau (autre jour, autre heure, éventuellement un autre coiffeur) - prestation et suppléments
 * inchangés. Le client reçoit un email avec le nouvel horaire. Même parcours que dans le dashboard.
 */
function adReschedule() {
  var a = adAppt;
  if (!a || !adIsUpcoming(a)) return;
  var currentDate = String(a.scheduled_at).slice(0, 10);
  var rdvBarbers = (barbers || []).filter(function (b) {
    // Tous les coiffeurs qui prennent des RDV, meme absents ce jour-la (marques « indisponible » selon la date choisie).
    return b.id === a.barber_id || Boolean(b.accepts_appointments && b.active !== 0 && hasBookableSchedule(b));
  });

  var overlay = _buildModal(
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">' +
    '<div class="modal-title" style="margin-bottom:0">Déplacer le RDV de ' + esc(a.client_name) + '</div>' +
    '<button id="rs-close-x" style="background:var(--fill);border:none;width:30px;height:30px;border-radius:50%;color:var(--grey);font-size:14px;cursor:pointer;flex-shrink:0;margin-left:10px">✕</button>' +
    '</div>' +
    '<div class="fld" style="margin-bottom:10px"><label>Coiffeur</label><select class="modal-input" id="rs-barber">' +
      rdvBarbers.map(function (b) { return '<option value="' + b.id + '"' + (b.id === a.barber_id ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="fld" style="margin-bottom:10px"><label>Nouvelle date</label><input class="modal-input" type="date" id="rs-date" value="' + currentDate + '"></div>' +
    '<div class="aa-step-title">Créneau</div>' +
    '<div id="rs-half-toggle" class="half-toggle" style="display:none;margin-bottom:8px">' +
      '<button id="rs-half-morning" onclick="adRsShowHalf(\'morning\')">Matin</button>' +
      '<button id="rs-half-afternoon" onclick="adRsShowHalf(\'afternoon\')">Après-midi</button>' +
    '</div>' +
    '<div class="aa-slots" id="rs-slots"><span class="hint" style="margin:0">Chargement…</span></div>' +
    '<div class="modal-error" id="rs-error" style="display:none"></div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-soft" id="rs-cancel-btn">Annuler</button>' +
    '<button class="btn btn-primary" id="rs-save-btn" disabled>Enregistrer</button>' +
    '</div>'
  );

  var selectedTime = null;
  var byHalf = { morning: [], afternoon: [] };
  var curHalf = 'afternoon';

  function renderHalf() {
    var list = byHalf[curHalf];
    overlay.querySelector('#rs-slots').innerHTML = list.length
      ? list.map(function (s) { return '<button class="aa-slot" data-time="' + s.time + '" onclick="adRsSelectSlot(this)">' + s.time + '</button>'; }).join('')
      : '<span class="hint" style="margin:0">Aucun créneau ' + (curHalf === 'morning' ? 'le matin' : "l'après-midi") + '</span>';
  }
  window.adRsShowHalf = function (half) {
    curHalf = half;
    overlay.querySelector('#rs-half-morning').classList.toggle('sel', half === 'morning');
    overlay.querySelector('#rs-half-afternoon').classList.toggle('sel', half === 'afternoon');
    renderHalf();
  };
  window.adRsSelectSlot = function (el) {
    selectedTime = el.dataset.time;
    overlay.querySelectorAll('#rs-slots .aa-slot').forEach(function (c) { c.classList.remove('sel'); });
    el.classList.add('sel');
    overlay.querySelector('#rs-save-btn').disabled = false;
  };

  function loadSlots() {
    var slotsEl = overlay.querySelector('#rs-slots'), toggleEl = overlay.querySelector('#rs-half-toggle');
    var barberId = overlay.querySelector('#rs-barber').value, date = overlay.querySelector('#rs-date').value;
    selectedTime = null;
    overlay.querySelector('#rs-save-btn').disabled = true;
    toggleEl.style.display = 'none';
    if (!barberId || !date) return;
    // Coiffeur absent ce jour-la (conge, jour « sans RDV », non travaille) : toujours dans la liste, marque
    // « indisponible » ; le choisir l'indique a la place des creneaux.
    overlay.querySelectorAll('#rs-barber option').forEach(function (o) {
      var ob = (barbers || []).find(function (x) { return String(x.id) === String(o.value); });
      if (ob) o.textContent = ob.name + (barberOffOn(ob, date) ? ' — indisponible ce jour-là' : '');
    });
    var offB = (barbers || []).find(function (x) { return String(x.id) === String(barberId); });
    if (offB && barberOffOn(offB, date)) { slotsEl.innerHTML = barberOffSlotsHtml(offB, date, true); return; }
    slotsEl.innerHTML = '<span class="hint" style="margin:0">Chargement…</span>';
    barberApi('/api/appointments/availability?date=' + date + '&service_id=' + a.service_id + '&barber_id=' + barberId + '&exclude_appointment_id=' + a.id, { actingAs: barberId })
      .then(function (r) {
        if (!r.slots.length) { slotsEl.innerHTML = '<span class="hint" style="margin:0">Aucun créneau disponible ce jour-là</span>'; return; }
        byHalf.morning = r.slots.filter(function (s) { return s.time < '12:00'; });
        byHalf.afternoon = r.slots.filter(function (s) { return s.time >= '12:00'; });
        if (!byHalf.morning.length) { toggleEl.style.display = 'none'; curHalf = 'afternoon'; renderHalf(); }
        else { toggleEl.style.display = 'flex'; adRsShowHalf('morning'); }
      })
      .catch(function (e) { slotsEl.innerHTML = ''; toast(e.message, true); });
  }

  // Autre coiffeur choisi : la date va a SON premier jour disponible (a partir d'aujourd'hui), puis ses creneaux.
  overlay.querySelector('#rs-barber').onchange = function () {
    var nb = (barbers || []).find(function (x) { return String(x.id) === String(overlay.querySelector('#rs-barber').value); });
    var first = nb && firstBookableDayFor(nb, salonToday(), typeof rdvIsSalonClosed === 'function' ? rdvIsSalonClosed : null);
    if (first) overlay.querySelector('#rs-date').value = first;
    loadSlots();
  };
  overlay.querySelector('#rs-date').onchange = loadSlots;
  loadSlots();
  overlay.querySelector('#rs-close-x').onclick = function () { _closeModal(overlay); };
  overlay.querySelector('#rs-cancel-btn').onclick = function () { _closeModal(overlay); };
  overlay.querySelector('#rs-save-btn').onclick = function () {
    var errEl = overlay.querySelector('#rs-error');
    if (!selectedTime) return;
    barberApi('/api/appointments/' + a.id + '/reschedule', {
      method: 'PUT',
      actingAs: a.barber_id || undefined,
      body: {
        date: overlay.querySelector('#rs-date').value,
        time: selectedTime,
        barber_id: overlay.querySelector('#rs-barber').value,
        base_url: window.location.origin + '/rdv.html'
      }
    }).then(function () {
      _closeModal(overlay);
      closeApptDrawer();
      toast('Rendez-vous déplacé');
      adRefreshViews();
    }).catch(function (e) { errEl.textContent = e.message; errEl.style.display = 'block'; });
  };
}
</script>
</body>
</html>
