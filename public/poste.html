<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<script>
  // Anti-flash de theme : applique le mode sombre AVANT le premier
  // affichage si necessaire (au lieu d'attendre le chargement d'app.js,
  // ce qui provoquait un flash visible du mode clair a chaque
  // rafraichissement pour les utilisateurs en mode sombre). Doit rester
  // synchrone et place avant toute feuille de style.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mon poste</title>
<script>
  (function () {
    try {
      var saved = JSON.parse(sessionStorage.getItem('poste-session') || 'null');
      if (saved && saved.id && saved.pin) document.documentElement.classList.add('auth-checking');
    } catch (e) {}
  })();
</script>
<script>
  // Adresse SANS ?salon=... : on masque la page le temps de savoir si la plateforme heberge plusieurs salons
  // (voir requireSalonInUrl dans app.js) - pour ne jamais montrer, meme une fraction de seconde, un ecran sans salon.
  try { if (!new URLSearchParams(window.location.search).get('salon')) { document.documentElement.classList.add('no-slug'); var st = document.createElement('style'); st.textContent = 'html.no-slug body > *:not(#no-salon) { visibility: hidden !important; }'; document.head.appendChild(st); } } catch (e) {}
</script>
<style>
  html.auth-checking #login-screen { display: none; }

  /* Agenda : même planning du jour (timeline par coiffeur) que le tableau de bord et la caisse. */
  /* --- Planning du jour (timeline), utilisée dans l'Agenda --- */
  .timeline-scroll { overflow-x: auto; width: 100%; max-width: 100%; }
  .timeline-inner { position: relative; }
  .timeline-hours { position: relative; height: 18px; margin-bottom: 6px; }
  .timeline-hours span { position: absolute; top: 0; font-size: 12px; color: var(--grey); white-space: nowrap; transform: translateX(-1px); }
  .timeline-hours span.h { color: var(--ink); font-weight: 600; }
  /* Dezoome sous la largeur lisible (jusqu'a 0 % = journee entiere a l'ecran) : seules les heures pleines restent. */
  .timeline-inner.compact .timeline-hours span:not(.h) { display: none; }
  .timeline-inner.compact .timeline-hours span.h { font-size: 11px; }
  /* Vue resserree (jusqu'a 0 %) : l'heure reste affichee au-dessus du nom, exactement comme a 100 %. */
  .timeline-inner.compact .timeline-block { padding: 2px 6px; }
  .timeline-inner.compact .timeline-hours span.h:last-child { transform: translateX(-100%); }
  /* Les traits de chaque pas (5 min...) deviennent trop serres : on ne garde que les traits des heures. */
  .timeline-inner.compact .timeline-minute-grid { background-image: linear-gradient(to right, transparent 1px, transparent 1px), linear-gradient(to right, rgba(128,128,128,.38) 1px, transparent 1px); }
  .timeline-zoom-ctrl button:disabled { opacity: .35; cursor: default; }
  .timeline-row { display: flex; align-items: center; min-height: 54px; border-top: 1px solid var(--sep); }
  .timeline-row:first-child { border-top: none; }
  .timeline-row-label { width: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding-right: 0; }
  .timeline-row-label .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .timeline-row-track { position: relative; flex: 1; height: 40px; }
  .timeline-block {
    position: absolute; top: 3px; bottom: 3px; border-radius: 8px; padding: 2px 8px;
    font-size: 12.5px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; line-height: 1.15;
  }
  /* Heure du rendez-vous, au-dessus du nom du client. */
  .timeline-block .tb-time { font-size: 10.5px; font-weight: 700; opacity: .92; letter-spacing: .2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .timeline-block .tb-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .timeline-now-line {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent, var(--blue));
    z-index: 5; cursor: help;
  }
  .timeline-now-line::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--accent, var(--blue));
  }
  .timeline-now-line::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 7px solid var(--accent, var(--blue));
  }
  .timeline-empty { padding: 20px 0; text-align: center; color: var(--grey); font-size: 14px; }
  .timeline-row-track { cursor: pointer; }
  .timeline-row-track:hover { background: var(--fill); border-radius: 8px; }
  .timeline-minute-grid {
    position: absolute; left: 22px; right: 0; top: 0; bottom: 0; pointer-events: none; z-index: 0;
    /* 1re couche : un trait fin a chaque pas ; 2e couche : un trait plus marque a chaque heure */
    background-image: linear-gradient(to right, var(--sep) 1px, transparent 1px),
                      linear-gradient(to right, rgba(128,128,128,.38) 1px, transparent 1px);
    background-repeat: repeat-x, repeat-x; background-position: left top, left top;
  }
  .timeline-zoom-ctrl { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
  .timeline-zoom-ctrl-inner { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 999px; padding: 4px 6px; }
  .timeline-zoom-ctrl button {
    width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--card); color: var(--ink);
    font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: inherit; line-height: 1;
  }
  .timeline-zoom-ctrl span { font-size: 11px; color: var(--grey); min-width: 32px; text-align: center; }

/* Fermetures exceptionnelles visibles dans toutes les vues RDV. */
.cal-day.salon-closed{background:rgba(128,128,128,.13);box-shadow:inset 0 0 0 1px rgba(150,150,150,.27)}
.cal-day.salon-closed .cal-day-num{text-decoration:line-through;opacity:.65}
.cal-day.salon-closed::after{content:'Fermé';display:block;font-size:10px;font-weight:700;color:var(--red,#e65c5c);margin-top:2px}
.salon-closure-banner{padding:10px 13px;border-radius:9px;margin:0 0 12px;background:rgba(160,100,100,.13);color:var(--red,#e65c5c);font-weight:650;font-size:13px}
</style>

<style>

  body.has-poste-footer .toast { bottom: 100px; }

  /* --- Agenda : copie conforme du calendrier du menu Rendez-vous (dashboard.html) --- */
  .card-box { background: var(--card); border-radius: 16px; padding: 22px; box-shadow: var(--shadow, 0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px var(--sep));
              margin-bottom: 14px; transition: background .25s ease; }

  }
  .cal-view-switch button.on { background: var(--blue); color: #fff; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-week-row { margin-bottom: 4px; }
  .cal-expand-panel {
    background: var(--fill); border-radius: 14px; padding: 16px 18px; margin: 6px 0 10px;
    animation: cal-expand .18s ease; min-width: 0; grid-column: 1 / -1;
  }
  @keyframes cal-expand { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .cal-expand-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14.5px; text-transform: capitalize; }

  /* Jour passé : grisé et non cliquable (plus de prise de RDV), comme le calendrier de réservation en ligne. */

  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--sep); }

</style>

<body>

<div class="wrap">
  <div class="login" id="login-screen">
    <div class="mark" id="salon-mark">&nbsp;</div>
    <h1>Mon poste</h1>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="empty"></button><button data-k="0">0</button><button class="del" data-k="del">⌫</button>
    </div>
    <div class="login-error" id="login-error"></div>
  </div>

  <div id="app-screen" style="display:none">
    <div class="topbar">
      <div>
        <div id="salon-name-tag" style="font-size:12px;font-weight:600;color:var(--grey);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px"></div>
        <h1 id="my-name">—</h1>
      </div>
    </div>

    <div id="p-home">
      <div id="active-zone"></div>
      <div class="section-label">À suivre</div>
      <div id="next-zone"></div>
    </div>

    <div id="p-agenda" style="display:none">
      <div id="poste-no-timer-active" style="display:none"></div>
      <div class="cal-barber-picker" id="cal-barber-picker"></div>

      <div class="card-box">
        <div class="cal-nav">
          <button class="btn btn-soft" onclick="calShiftPeriod(-1)">‹</button>
          <div class="cal-month-label" id="cal-month-label"></div>
          <div class="cal-view-switch">
            <button id="cal-view-month" class="on" onclick="setCalView('month')">Mois</button>
            <button id="cal-view-week" onclick="setCalView('week')">Semaine</button>
            <button id="cal-view-day" onclick="setCalView('day')">Jour</button>
          </div>
          <button class="btn btn-soft" onclick="calShiftPeriod(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-weekdays">
          <div class="cal-weekday">Lun</div><div class="cal-weekday">Mar</div><div class="cal-weekday">Mer</div>
          <div class="cal-weekday">Jeu</div><div class="cal-weekday">Ven</div><div class="cal-weekday">Sam</div><div class="cal-weekday">Dim</div>
        </div>
        <div id="cal-days"></div>
        <div id="cal-day-view" style="display:none"></div>
        <div class="cal-legend" id="cal-legend"></div>
      </div>
    </div>
  </div>
</div>

<div class="poste-footer" id="poste-footer" style="display:none">
  <button id="nav-home" onclick="gotoHome()">
    <svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    Timer
  </button>
  <button id="nav-agenda" onclick="gotoAgenda()">
    <svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 9.5h16"/><path d="M8 3.5v3.5M16 3.5v3.5"/></svg>
    Agenda
  </button>
  <button onclick="logout()">
    <svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6.5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2H9"/><path d="M16 15.5 20.5 12 16 8.5"/><path d="M20 12H9"/></svg>
    Déconnexion
  </button>
</div>

<script src="/app.js?v=30"></script>
<script src="/autorefresh.js?v=2"></script>
<script src="/staff-group.js?v=5"></script>
<script>requireSalonInUrl("Pour utiliser votre poste, ouvrez le lien de votre salon.");</script>
<script>
mountThemeButton();

var me = null; // { id, name, pin }
var rdvPrepAlertMin = 0;
var queue = [];
var barbers = [];
var extras = [];
var services = [];
var products = [];
// Derniere lecture du catalogue (ms ; 0 = jamais lu). Avant, le catalogue etait garde A VIE une fois charge : un
// ordre (ou un prix, un stock...) change dans l'administration n'apparaissait qu'apres rechargement de la page.
// refresh() tourne toutes les 4 s ; on ne relit donc le catalogue qu'au plus toutes les 15 s, et on reutilise
// les listes en memoire entre deux relectures. DECLAREE ICI, avec les listes : la connexion automatique appelle
// boot() -> refresh() des l'ouverture de la page, avant que le reste du script ait fini de s'executer.
var catalogLoadedAt = 0;
var pinBuffer = '';

var SALON_SLUG = (function () {
  try { return new URLSearchParams(window.location.search).get('salon') || ''; }
  catch (e) { return ''; }
})();

function loadSalonName() {
  var headers = {};
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/settings/public', { headers: headers })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var name = d.salon_name || '';
      CURRENCY = d.currency || 'EUR'; if (d.timezone) SALON_TIMEZONE = d.timezone;
      rdvPrepAlertMin = Number(d.rdv_prep_alert_min) || 0;
      applyAccentColor(d.accent_color);
      document.title = name + ' — Mon poste';
      var mark = document.getElementById('salon-mark');
      if (mark) mark.textContent = name.toUpperCase();
      var tag = document.getElementById('salon-name-tag');
      if (tag) tag.textContent = name;
    })
    .catch(function () {});
}
loadSalonName();

/* ---------- API avec authentification par PIN ---------- */
function barberApi(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (me) { headers['X-Barber-Id'] = me.id; headers['X-Barber-Pin'] = me.pin; }
  // RDV pris au nom d'un collègue depuis l'Agenda (comme le sélecteur par bulle de la caisse).
  if (me && opts.actingAs && opts.actingAs !== me.id) headers['X-Acting-As-Barber-Id'] = opts.actingAs;
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  return fetch(path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) throw new Error(data.error || 'Erreur ' + r.status);
      return data;
    });
  });
}

/* ---------- Connexion par code PIN ---------- */
function renderPinDots() {
  var dots = document.querySelectorAll('.pin-dot');
  dots.forEach(function (d, i) { d.classList.toggle('filled', i < pinBuffer.length); });
}

document.getElementById('keypad').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn || btn.classList.contains('empty')) return;
  var k = btn.dataset.k;
  document.getElementById('login-error').textContent = '';

  if (k === 'del') {
    pinBuffer = pinBuffer.slice(0, -1);
    renderPinDots();
    return;
  }
  if (pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderPinDots();
  if (pinBuffer.length === 4) attemptLogin();
});

function attemptLogin() {
  var headers = { 'Content-Type': 'application/json' };
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/barbers/login', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({ pin: pinBuffer, source: 'poste' })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (res) {
      if (!res.ok) {
        document.getElementById('login-error').textContent = res.data.error || 'Code incorrect';
        pinBuffer = '';
        renderPinDots();
        return;
      }
      me = { id: res.data.barber.id, name: res.data.barber.name, pin: pinBuffer, acceptsAppointments: Boolean(res.data.barber.accepts_appointments), timerEnabled: res.data.barber.timer_enabled !== 0 };
      try { sessionStorage.setItem('poste-session', JSON.stringify(me)); } catch (e) {}
      showApp();
    })
    .catch(function () {
      document.getElementById('login-error').textContent = 'Connexion impossible';
      pinBuffer = '';
      renderPinDots();
    });
}

function logout() {
  me = null;
  // Les minuteurs de rafraîchissement automatique (refresh, renderActive)
  // tournaient encore après une déconnexion, plantant en boucle car ils
  // référencent me.id sans vérifier qu'un coiffeur est bien connecté.
  if (refreshIntervalId) { clearInterval(refreshIntervalId); refreshIntervalId = null; }
  if (renderActiveIntervalId) { clearInterval(renderActiveIntervalId); renderActiveIntervalId = null; }
  try { sessionStorage.removeItem('poste-session'); } catch (e) {}
  pinBuffer = '';
  renderPinDots();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('poste-footer').style.display = 'none';
  document.body.classList.remove('has-poste-footer');
}

(function autoLogin() {
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('poste-session') || 'null'); } catch (e) {}
  if (saved && saved.id && saved.pin) { me = saved; showApp(); }
})();

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('my-name').textContent = me.name;
  document.getElementById('poste-footer').style.display = 'flex';
  document.body.classList.add('has-poste-footer');

  // Un coiffeur "Sans RDV" (pas en mode RDV en ligne) n'a pas d'agenda
  // à consulter - on retire les onglets Timer/Agenda du footer, il ne
  // reste que Déconnexion, et son seul écran (le suivi de la file en
  // cours) reste affiché sans bascule inutile.
  var showTabs = me.acceptsAppointments;
  document.getElementById('nav-home').style.display = showTabs ? 'flex' : 'none';
  document.getElementById('nav-agenda').style.display = showTabs ? 'flex' : 'none';

  gotoHome();
  boot();
}

function gotoHome() {
  document.getElementById('p-home').style.display = 'block';
  document.getElementById('p-agenda').style.display = 'none';
  document.getElementById('nav-home').classList.add('on');
  document.getElementById('nav-agenda').classList.remove('on');
}

// Actualisation discrète de l'Agenda (15 s sans toucher l'écran), comme la caisse : jamais avec une fenêtre ouverte.
if (window.AutoRefresh) AutoRefresh.start(function () {
  var ag = document.getElementById('p-agenda');
  if (!ag || ag.style.display === 'none' || !calBooted) return;
  calMonthCache = {}; return loadAgendaPeriod();
}, { idleMs: 15000, busy: function () { return !!document.querySelector('.modal-overlay'); } });

function gotoAgenda() {
  document.getElementById('p-home').style.display = 'none';
  document.getElementById('p-agenda').style.display = 'block';
  document.getElementById('nav-home').classList.remove('on');
  document.getElementById('nav-agenda').classList.add('on');
  // Toujours relu en ouvrant l'Agenda : RDV pris ailleurs, fermetures ajoutées par l'admin...
  calBooted = true; calMonthCache = {}; loadAgendaPeriod();
}

/* ---------- Application ---------- */
var refreshIntervalId = null;
var renderActiveIntervalId = null;

function boot() {
  refresh();
  refreshIntervalId = setInterval(refresh, 4000);
  renderActiveIntervalId = setInterval(renderActive, 1000);
}

function refresh() {
  if (!me) return;
  // "Jamais lu" (0 ou indefini) compte comme "a relire" : sans cela, la 1re lecture pouvait etre sautee a l'ouverture.
  var reloadCatalog = !catalogLoadedAt || Date.now() - catalogLoadedAt > 15000;
  return Promise.all([
    barberApi('/api/queue'),
    barberApi('/api/barbers'),
    reloadCatalog ? barberApi('/api/catalog/extras') : Promise.resolve({ items: extras }),
    reloadCatalog ? barberApi('/api/catalog/services') : Promise.resolve({ items: services }),
    reloadCatalog ? barberApi('/api/catalog/products') : Promise.resolve({ items: products })
  ]).then(function (r) {
    queue = r[0].queue;
    barbers = r[1].items;
    extras = r[2].items;
    services = r[3].items;
    products = r[4].items;
    if (reloadCatalog) catalogLoadedAt = Date.now();   // seulement si la lecture a REUSSI : sinon on reessaie au prochain tour
    renderActive();
    renderNext();
  }).catch(function (e) { toast(e.message, true); });
}

/**
 * Sans Timer, l'ecran qui contient normalement le bouton "Terminer"
 * (#p-home) n'est plus affiche pour ce coiffeur - sans repli, plus
 * aucun moyen de faire passer un client de "en cours" a "termine".
 * Ce mini-panneau, affiche en haut de l'Agenda (le seul autre ecran
 * disponible ici), reprend juste cette action.
 */
function updatePosteNoTimerCard(cur) {
  var box = document.getElementById('poste-no-timer-active');
  if (!box) return;
  var show = Boolean(!me.timerEnabled && cur);
  box.style.display = show ? 'block' : 'none';
  if (!show) return;
  box.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--fill);border-radius:12px;padding:12px 14px;margin-bottom:14px">' +
      '<div><div style="font-weight:600;font-size:14px">' + esc(cur.client_name) + ' — prestation en cours</div>' +
      '<div class="hint" style="margin:2px 0 0">' + esc(cur.service.name) + '</div></div>' +
      '<button class="btn btn-green" style="flex-shrink:0" onclick="finishMine(\'' + cur.id + '\')">Terminer</button>' +
    '</div>';
}

function myActive() {
  if (!me) return null;
  return queue.find(function (q) { return q.status === 'in_progress' && q.barber_id === me.id; });
}

function cutTimerDisplay(cut) {
  var elapsedSec = Math.max(Math.floor((Date.now() - new Date(cut.start_at).getTime()) / 1000), 0);
  var remainSec = (cut.total_duration_min || 0) * 60 - elapsedSec;
  if (remainSec >= 0) return { text: mmss(remainSec), over: false, label: 'Temps restant' };
  return { text: '+' + formatMinutes(Math.ceil(Math.abs(remainSec) / 60)), over: true, label: 'En retard' };
}

function chipsHtml(q) {
  return '<div class="chips"><span class="chip main">' + esc(q.service.name) + '</span>' +
    q.extras.map(function (x) { return '<span class="chip">+ ' + esc(x.name) + '</span>'; }).join('') + '</div>';
}

var extrasPickerOpen = false;

function renderActive(force) {
  var cur = myActive();
  updatePosteNoTimerCard(cur);
  var zone = document.getElementById('active-zone');
  if (!cur) {
    zone.innerHTML = '<div class="empty">Aucune coupe en cours</div>';
    return;
  }
  var t = cutTimerDisplay(cur);

  // Si l'utilisateur est en train d'interagir dans cette carte (panneau
  // de suppléments ouvert, note en cours de frappe), on se contente de
  // rafraîchir le minuteur sans reconstruire tout le HTML — sinon les
  // cases cochées et le texte tapé seraient perdus à chaque tick.
  // "force" outrepasse cette protection : utilisé juste après avoir
  // volontairement fermé le panneau, pour que ça se voie tout de suite
  // même si le bouton cliqué garde encore le focus.
  var timerEl = document.getElementById('active-timer-value');
  var subEl = document.getElementById('active-timer-sub');
  var userIsEditing = !force && (extrasPickerOpen ||
    (zone.contains(document.activeElement) && document.activeElement !== document.body));

  if (userIsEditing && timerEl) {
    timerEl.textContent = t.text;
    timerEl.classList.toggle('over', t.over);
    if (subEl) {
      subEl.textContent = t.label + ' · prévu ' + formatMinutes(cur.total_duration_min) + ' · ' + eur(cur.total_price_cents);
      subEl.classList.toggle('over', t.over);
    }
    return;
  }

  var extraIds = cur.extras.map(function (e) { return e.id; });
  var extrasOptions = extras.map(function (e) {
    return '<label class="extra-opt"><input type="checkbox" value="' + e.id + '"' +
      (extraIds.indexOf(e.id) !== -1 ? ' checked' : '') + '> ' + esc(e.name) +
      ' <span class="extra-price">+' + eur(e.price_cents) + '</span></label>';
  }).join('');

  zone.innerHTML =
    '<div class="active-card">' +
      '<div class="name">' + esc(cur.client_name) + '</div>' +
      (cur.is_appointment
        ? '<div class="hint" style="color:var(--blue);margin:-4px 0 6px">📅 Rendez-vous</div>'
        : '') +
      (cur.paid_at ? '<div class="hint" style="color:var(--green);font-weight:600;margin:-2px 0 6px">✓ Déjà payé — un supplément ajouté sera à régler à la fin</div>' : '') +
      chipsHtml(cur) +
      '<div class="big-timer' + (t.over ? ' over' : '') + '" id="active-timer-value">' + t.text + '</div>' +
      '<div class="timer-sub' + (t.over ? ' over' : '') + '" id="active-timer-sub">' + t.label + ' · prévu ' + formatMinutes(cur.total_duration_min) + ' · ' + eur(cur.total_price_cents) + '</div>' +
      (cur.gift_card
        ? '<div class="hint" style="color:var(--green);margin:8px 0">🎁 Cadeau — supplément non modifiable, terminez la coupe telle quelle.</div>'
        : '<button class="btn btn-soft" onclick="toggleExtrasPicker()">Ajouter un supplément</button>' +
          '<div id="extras-picker" style="display:' + (extrasPickerOpen ? 'block' : 'none') + '">' + extrasOptions +
            '<button class="btn btn-primary" onclick="saveExtras(\'' + cur.id + '\')">Valider</button>' +
          '</div>') +
      '<div class="note-block">' +
        '<label for="client-note">Note sur ce client</label>' +
        '<textarea id="client-note" rows="2" placeholder="Ex: préfère dégradé américain, allergie...">' + esc(cur.note || '') + '</textarea>' +
        '<button class="btn btn-soft" onclick="saveNote(\'' + cur.id + '\')">Enregistrer la note</button>' +
      '</div>' +
      '<button class="btn btn-green" onclick="finishMine(\'' + cur.id + '\')">Terminer</button>' +
    '</div>';
}

function toggleExtrasPicker() {
  extrasPickerOpen = !extrasPickerOpen;
  var el = document.getElementById('extras-picker');
  if (el) el.style.display = extrasPickerOpen ? 'block' : 'none';
}

function hasNextWaitingForMe() {
  return queue.some(function (q) {
    return q.status === 'waiting' && (!q.barber_id || q.barber_id === me.id);
  });
}

function saveExtras(id) {
  var ids = Array.prototype.map.call(
    document.querySelectorAll('#extras-picker input[type="checkbox"]:checked'),
    function (c) { return c.value; }
  );

  var cur = myActive();
  var isAdding = cur && ids.length > cur.extras.length;
  if (isAdding && hasNextWaitingForMe()) {
    extrasPickerOpen = false;
    if (document.activeElement) document.activeElement.blur();
    renderActive(true);
    toast('Un client attend déjà son tour — ajouter un supplément le retarderait.', true);
    return;
  }

  barberApi('/api/queue/' + id, { method: 'PUT', body: { extras: ids } })
    .then(function () {
      extrasPickerOpen = false;
      if (document.activeElement) document.activeElement.blur();
      renderActive(true); // ferme le panneau tout de suite, sans attendre le réseau
      toast('Suppléments mis à jour');
      return refresh(); // données à jour ensuite, en arrière-plan
    })
    .catch(function (e) {
      extrasPickerOpen = false;
      if (document.activeElement) document.activeElement.blur();
      renderActive(true);
      toast(e.message, true);
    });
}

function saveNote(id) {
  var note = document.getElementById('client-note').value;
  barberApi('/api/queue/' + id + '/note', { method: 'PUT', body: { note: note } })
    .then(function () { toast('Note enregistrée'); })
    .catch(function (e) { toast(e.message, true); });
}

var nextDetailOpen = {}; // { [queueId]: true }

function renderNext() {
  var zone = document.getElementById('next-zone');
  if (myActive()) {
    zone.innerHTML = '<div class="empty">Terminez la coupe en cours pour passer à la suivante</div>';
    return;
  }

  // Ne pas reconstruire pendant que l'utilisateur interagit (note en
  // cours de frappe) — sinon le rafraîchissement automatique (toutes
  // les 4s) annulerait la saisie en cours.
  var userIsEditing = zone.contains(document.activeElement) && document.activeElement !== document.body;
  if (userIsEditing && zone.children.length) return;

  var mine = queue.filter(function (q) {
    return q.status === 'waiting' && (q.barber_id === me.id || !q.barber_id);
  }).sort(function (a, b) { return new Date(a.checkin_at) - new Date(b.checkin_at); });

  if (mine.length === 0) {
    zone.innerHTML = '<div class="empty">Personne en attente pour vous pour le moment</div>';
    return;
  }

  zone.innerHTML = mine.map(function (q, i) {
    var isAppointmentNotYet = Boolean(q.is_appointment) && new Date(q.checkin_at) > new Date();
    var noTimerBarber = me.timerEnabled === false;
    var locked = i > 0 || (isAppointmentNotYet && !noTimerBarber);
    var detail = q.service.name + (q.extras.length ? ' + ' + q.extras.map(function (x) { return x.name; }).join(', ') : '');
    var open = Boolean(nextDetailOpen[q.id]);
    var minutesUntil = isAppointmentNotYet ? Math.round((new Date(q.checkin_at) - new Date()) / 60000) : null;
    var prepAlert = isAppointmentNotYet && rdvPrepAlertMin > 0 && minutesUntil <= rdvPrepAlertMin;
    var lockNote = isAppointmentNotYet
      ? (prepAlert ? '⏰ Préparez-vous — RDV dans ' + Math.max(minutesUntil, 0) + ' min' : 'RDV à ' + new Date(q.checkin_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))
      : 'En attente de son tour';
    var appointmentBadge = (q.is_appointment && !isAppointmentNotYet)
      ? '<div class="meta" style="color:var(--blue)">📅 RDV ' + new Date(q.checkin_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '</div>'
      : '';
    return '<div class="next-item" data-id="' + q.id + '">' +
      '<div class="next-card' + (locked ? ' locked' : '') + (prepAlert ? ' prep-alert' : '') + '">' +
        '<div class="next-info" onclick="toggleNextDetail(\'' + q.id + '\')">' +
          '<div class="name">' + esc(q.client_name) + '</div>' +
          '<div class="meta">' + esc(detail) + '</div>' +
          appointmentBadge +
          (q.paid_at ? '<div class="meta" style="color:var(--green);font-weight:600">✓ Déjà payé</div>' : '') +
          (q.gift_card ? giftBadgeHtml(q.gift_card) : '') +
          ((locked || isAppointmentNotYet) ? '<div class="lock-note' + (prepAlert ? ' prep-alert-note' : '') + '">' + lockNote + '</div>' : '') +
        '</div>' +
        '<div class="next-btns">' +
          (locked ? '' : (
            me.timerEnabled === false
              ? '<button class="btn btn-primary" onclick="quickFinishMine(\'' + q.id + '\')">Je prends</button>'
              : '<button class="btn btn-primary" onclick="startMine(\'' + q.id + '\')">Commencer</button>'
          )) +
          '<button class="btn btn-outline-red" onclick="cancelMine(\'' + q.id + '\')">Absent</button>' +
        '</div>' +
      '</div>' +
      '<div class="next-detail" id="next-detail-' + q.id + '" style="display:' + (open ? 'block' : 'none') + '">' +
        '<div class="detail-row"><span class="detail-label">Client</span><span class="detail-value">' + esc(q.client_name) + '</span></div>' +
        (q.email ? '<div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">' + esc(q.email) + '</span></div>' : '') +
        (q.phone ? '<div class="detail-row"><span class="detail-label">Téléphone</span><span class="detail-value">' + esc(q.phone) + '</span></div>' : '') +
        (q.gift_card ? giftDetailHtml(q.gift_card) : '') +
        '<label>Note sur ce client</label>' +
        '<textarea id="next-note-' + q.id + '" rows="2" placeholder="Ex: préfère dégradé américain, allergie...">' + esc(q.note || '') + '</textarea>' +
        '<button class="btn btn-soft" onclick="saveNextNote(\'' + q.id + '\')">Enregistrer la note</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

/**
 * Petit badge visible directement sur la carte repliée — ne mentionne
 * "produit offert" que si le cadeau contient réellement un produit à
 * remettre en plus de la coupe.
 */
function giftBadgeHtml(gift) {
  var productNames = gift.items
    .filter(function (it) { return it.item_type === 'product'; })
    .map(function (it) { return it.quantity + ' × ' + it.item_name; })
    .join(', ');
  var label = gift.explicit
    ? (productNames ? '🎁 Cadeau — à remettre : ' + esc(productNames) : '🎁 Cadeau')
    : 'ℹ️ Rappel : cadeau non réclamé en attente' + (productNames ? ' (' + esc(productNames) + ')' : '') + ' — sans rapport avec cette venue';
  return '<div class="meta" style="color:' + (gift.explicit ? 'var(--green)' : 'var(--grey)') + '">' + label + '</div>';
}

/**
 * Détail d'un cadeau lié à ce client — notamment les articles qui ne
 * font PAS partie de la coupe (produits, suppléments non choisis au
 * check-in), pour que le coiffeur sache quoi remettre en plus.
 */
function giftDetailHtml(gift) {
  var itemsList = gift.items.map(function (it) { return it.quantity + ' × ' + esc(it.item_name); }).join(', ');
  var title = gift.explicit
    ? '🎁 Cadeau (' + eur(gift.amount_cents) + ')'
    : 'ℹ️ Cadeau non réclamé (sans rapport avec cette venue) — ' + eur(gift.amount_cents);
  return '<div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:4px">' +
    '<span class="detail-label" style="color:' + (gift.explicit ? 'var(--green)' : 'var(--grey)') + '">' + title + '</span>' +
    '<span class="detail-value" style="font-weight:400">' + itemsList + '</span>' +
    '</div>';
}

function toggleNextDetail(id) {
  nextDetailOpen[id] = !nextDetailOpen[id];
  var el = document.getElementById('next-detail-' + id);
  if (el) el.style.display = nextDetailOpen[id] ? 'block' : 'none';
}

function saveNextNote(id) {

}

function cancelMine(id) {

function quickFinishMine(id) {

/* ---------- Agenda : TOUS les coiffeurs du salon, même planning (timeline) que le tableau de bord ----------
   Chaque coiffeur voit les RDV de ses collègues et peut ajouter un RDV au nom de l'un d'eux (clic sur sa ligne). */
var calAnchor = new Date();
var calViewMode = 'month';
var calMonthCache = {};
var calSelectedDate = null;
var calBooted = false;
var calApptById = {};
var rdvBarberColors = {};   // couleur choisie par l'admin (sinon couleur stable), comme le menu Rendez-vous
var rdvBarberPhotos = {};
var calBarberFilter = null;

function barberColor(bid) { return rdvBarberColors[bid] || stableColorForId(bid); }
function refreshBarberLooks() {
  (barbers || []).forEach(function (b) { rdvBarberColors[b.id] = b.color || stableColorForId(b.id); rdvBarberPhotos[b.id] = b.photo_url || ''; });
}

function applyCalBarberFilter(list) {
  return calBarberFilter ? list.filter(function (a) { return a.barber_id === calBarberFilter; }) : list;
}

function toggleCalBarberFilter(barberId) {
  calBarberFilter = calBarberFilter === barberId ? null : barberId;
  if (calViewMode === 'month') renderCalMonth();
  else if (calViewMode === 'week') renderCalWeek();
  else renderCalDay();
  renderCalendarLegend(neededMonthKeys());
}

function renderCalendarLegend(keys) {
  var seen = {};
  keys.forEach(function (k) {
    (calMonthCache[k] || []).forEach(function (a) {
      if (a.barber_id && a.barber_name && a.status !== 'cancelled') seen[a.barber_id] = a.barber_name;
    });
  });
  var names = Object.keys(seen);
  document.getElementById('cal-legend').innerHTML = names.length === 0
    ? '<span class="hint" style="margin:0">Aucun coiffeur avec un RDV sur cette période</span>'
    : names.map(function (bid) {
        return '<div class="cal-legend-item"><span class="cal-legend-dot" style="background:' + barberColor(bid) + '"></span>' + esc(seen[bid]) + '</div>';
      }).join('');
  renderCalBarberPicker(names, seen);
}

function renderCalBarberPicker(names, seen) {
  var el = document.getElementById('cal-barber-picker');
  if (!el) return;
  el.innerHTML = names.length === 0 ? '' : names.map(function (bid) {
    var isSelected = calBarberFilter === bid;
    var dimmed = calBarberFilter && !isSelected;
    var photoStyle = rdvBarberPhotos[bid] ? 'background:url(&quot;' + esc(rdvBarberPhotos[bid]) + '&quot;) center/cover' : 'background:' + barberColor(bid);
    return '<button class="cal-legend-avatar' + (isSelected ? ' selected' : '') + (dimmed ? ' dimmed' : '') + '" ' +
      'title="' + esc(seen[bid]) + (isSelected ? ' (cliquer pour tout afficher)' : '') + '" ' +
      'onclick="toggleCalBarberFilter(\'' + bid + '\')" style="' + photoStyle + '">' +
      (rdvBarberPhotos[bid] ? '' : esc(seen[bid].charAt(0).toUpperCase())) +
      '</button>';
  }).join('');
}

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfWeek(d) { var day = (d.getDay() + 6) % 7; return addDays(d, -day); }
var monthNames = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

function setCalView(mode) {
  calViewMode = mode;
  ['month', 'week', 'day'].forEach(function (m) { document.getElementById('cal-view-' + m).classList.toggle('on', m === mode); });
  document.getElementById('cal-weekdays').style.display = mode === 'day' ? 'none' : 'grid';
  document.getElementById('cal-days').style.display = mode === 'day' ? 'none' : 'block';
  document.getElementById('cal-day-view').style.display = mode === 'day' ? 'block' : 'none';
  loadAgendaPeriod();
}

function calShiftPeriod(delta) {
  if (calViewMode === 'month') calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + delta, 1);
  else if (calViewMode === 'week') calAnchor = addDays(calAnchor, delta * 7);
  else calAnchor = addDays(calAnchor, delta);
  loadAgendaPeriod();
}

function neededMonthKeys() {
  if (calViewMode !== 'week') return [monthKey(calAnchor)];
  var start = startOfWeek(calAnchor);
  var end = addDays(start, 6);
  var keys = [monthKey(start), monthKey(end)];
  return keys.filter(function (k, i) { return keys.indexOf(k) === i; });
}


var rdvSalonClosures = [];
function rdvIsSalonClosed(dateStr) { return rdvSalonClosures.some(function(c){return dateStr >= c.start_date && dateStr <= c.end_date;}); }
function rdvClosureBanner(dateStr) { return rdvIsSalonClosed(dateStr) ? '<div class="salon-closure-banner">Salon fermé exceptionnellement ce jour</div>' : ''; }
function rdvLoadSalonClosures() {
  return barberApi('/api/salon-calendar/public-closures').then(function(r){rdvSalonClosures=r.items||[];}).catch(function(){rdvSalonClosures=[];});
}

function loadAgendaPeriod() {
  var keys = neededMonthKeys();
  var toFetch = keys.filter(function (k) { return !calMonthCache[k]; });
  Promise.all(toFetch.map(function (k) {
    // caisse_view=1 : les RDV de TOUS les coiffeurs (comme la caisse), pas seulement les siens.
    return barberApi('/api/appointments?month=' + k + '&all=1&caisse_view=1').then(function (r) { calMonthCache[k] = r.items; });
  }).concat([loadRdvSlotStep(), loadSalonScheduleForTimeline(), rdvLoadSalonClosures()])).then(function () {
    refreshBarberLooks();
    if (calViewMode === 'month') renderCalMonth();
    else if (calViewMode === 'week') renderCalWeek();
    else renderCalDay();
    renderCalendarLegend(keys);
  }).catch(function (e) { toast(e.message, true); });
}

function apptsForRange(startDate, endDate) {
  var startStr = ymd(startDate), endStr = ymd(endDate);
  var all = [];
  neededMonthKeys().forEach(function (k) { all = all.concat(calMonthCache[k] || []); });
  return applyCalBarberFilter(all.filter(function (a) {
    var d = a.scheduled_at.slice(0, 10);
    return d >= startStr && d <= endStr && a.status !== 'cancelled';
  }));
}

/** Un point par coiffeur ayant au moins un RDV ce jour-là (couleur de sa bulle), comme dans la caisse. */
function calDayDotsHtml(dayAppts) {
  var seen = {}, dots = [];
  dayAppts.forEach(function (a) {
    var bid = a.barber_id || 'unassigned';
    if (seen[bid]) return;
    seen[bid] = true;
    dots.push('<span class="cal-dot" style="background:' + (bid === 'unassigned' ? 'var(--grey)' : barberColor(bid)) + '"></span>');
  });
  return dots.length ? '<div class="cal-dots">' + dots.join('') + '</div>' : '';
}

function renderCalMonth() {
  document.getElementById('cal-month-label').textContent = monthNames[calAnchor.getMonth()] + ' ' + calAnchor.getFullYear();
  var firstDay = new Date(calAnchor.getFullYear(), calAnchor.getMonth(), 1);
  var daysInMonth = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + 1, 0).getDate();
  var startOffset = (firstDay.getDay() + 6) % 7;
  var monthAppts = apptsForRange(firstDay, new Date(calAnchor.getFullYear(), calAnchor.getMonth(), daysInMonth));
  var byDay = {};
  monthAppts.forEach(function (a) { var d = a.scheduled_at.slice(0, 10); (byDay[d] = byDay[d] || []).push(a); });

  var todayStr = salonToday();
  var dayCells = [];
  for (var i = 0; i < startOffset; i++) dayCells.push(null);
  for (var day = 1; day <= daysInMonth; day++) dayCells.push(day);
  while (dayCells.length % 7 !== 0) dayCells.push(null);

  var html = '';
  for (var w = 0; w < dayCells.length; w += 7) {
    var weekDays = dayCells.slice(w, w + 7);
    html += '<div class="cal-grid cal-week-row">' + weekDays.map(function (d) {
      if (d === null) return '<div class="cal-day empty"></div>';
      var dateStr = calAnchor.getFullYear() + '-' + String(calAnchor.getMonth() + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var classes = 'cal-day' + (dateStr === todayStr ? ' today' : '') + (dateStr === calSelectedDate ? ' selected' : '');
      if (isPastDay(dateStr)) classes += ' past';
      if (rdvIsSalonClosed(dateStr)) classes += ' salon-closed';
      return '<div class="' + classes + '"' + ' onclick="selectCalDay(\'' + dateStr + '\')"' + '>' +
        '<div class="cal-day-num">' + d + '</div>' + calDayDotsHtml(byDay[dateStr] || []) + '</div>';
    }).join('') + '</div>';
    var selectedInThisWeek = calSelectedDate && weekDays.some(function (d) {
      if (d === null) return false;
      return calAnchor.getFullYear() + '-' + String(calAnchor.getMonth() + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0') === calSelectedDate;
    });
    if (selectedInThisWeek) html += renderCalExpandPanel(calSelectedDate);
  }
  document.getElementById('cal-days').innerHTML = html;
}

function renderCalExpandPanel(dateStr) {
  var when = new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' });
  return '<div class="cal-expand-panel">' +
    '<div class="cal-expand-head"><strong style="text-transform:capitalize">' + when + '</strong>' +
    '<button class="btn btn-soft" onclick="event.stopPropagation();selectCalDay(null)">Fermer</button></div>' +
    posteAddBtnHtml(dateStr) +
    renderAgendaTimeline(dateStr) +
    '</div>';
}

function posteAddBtnHtml(dateStr) {
  if (rdvIsSalonClosed(dateStr)) {
    return '<div class="salon-closure-banner" style="text-align:center">Salon fermé — aucun rendez-vous ne peut être ajouté ce jour.</div>';
  }
  if (isPastDay(dateStr)) return '';   // jour passé : on consulte, on n'ajoute plus
  return '<button class="btn btn-primary" style="width:100%;margin-bottom:6px" onclick="event.stopPropagation();openPosteAddAppointment(\'' + dateStr + '\')">+ Ajouter un RDV</button>' +
    '<p class="hint" style="margin:0 0 12px;text-align:center;font-size:12.5px;color:var(--grey)">Pour un collègue : touchez sa ligne dans le planning.</p>';
}

function renderCalWeek() {
  var start = startOfWeek(calAnchor);
  var end = addDays(start, 6);
  document.getElementById('cal-month-label').textContent =
    start.getDate() + ' ' + monthNames[start.getMonth()] + ' – ' + end.getDate() + ' ' + monthNames[end.getMonth()] + ' ' + end.getFullYear();
  var byDay = {};
  apptsForRange(start, end).forEach(function (a) { var d = a.scheduled_at.slice(0, 10); (byDay[d] = byDay[d] || []).push(a); });
  var todayStr = salonToday();
  var cells = '';
  for (var i = 0; i < 7; i++) {
    var d = addDays(start, i), dateStr = ymd(d);
    var classes = 'cal-day' + (dateStr === todayStr ? ' today' : '') + (dateStr === calSelectedDate ? ' selected' : '');
    if (isPastDay(dateStr)) classes += ' past';
      if (rdvIsSalonClosed(dateStr)) classes += ' salon-closed';
    cells += '<div class="' + classes + '"' + ' onclick="selectCalDay(\'' + dateStr + '\')"' + '>' +
      '<div class="cal-day-num">' + d.getDate() + '</div>' + calDayDotsHtml(byDay[dateStr] || []) + '</div>';
  }
  var html = '<div class="cal-grid cal-week-row">' + cells + '</div>';
  if (calSelectedDate) html += renderCalExpandPanel(calSelectedDate);
  document.getElementById('cal-days').innerHTML = html;
}

function renderCalDay() {
  document.getElementById('cal-month-label').textContent =
    calAnchor.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  document.getElementById('cal-day-view').innerHTML = posteAddBtnHtml(ymd(calAnchor)) + renderAgendaTimeline(ymd(calAnchor));
}

function selectCalDay(dateStr) {
  calSelectedDate = (!dateStr || dateStr === calSelectedDate) ? null : dateStr;
  if (calSelectedDate) calAnchor = new Date(calSelectedDate + 'T00:00:00');
  if (calViewMode === 'month') renderCalMonth();
  else if (calViewMode === 'week') renderCalWeek();
}

/* ---------- Planning du jour (timeline par coiffeur), repris de la caisse ---------- */
var timelineZoom = 1;
var rdvSlotStepMin = 15;
var TIMELINE_LABEL_PX = 44;
var timelineMinZoom = 0.6;
var timelineEffectiveZoom = null;
var salonScheduleByWeekday = null;
var agendaNowLineTimer = null;

// Une frise LARGE (pas fin) depasse l'ecran : au lieu de l'ouvrir sur le matin, on la centre sur le trait
// "maintenant" quand on regarde AUJOURD'HUI. Se declenche des qu'une frise apparait dans la page, quel que
// soit l'endroit qui l'affiche (aucun appel a ajouter nulle part).
(function installTimelineAutoScroll() {
  function scrollToNow(sc) {
    var now = sc.querySelector('.timeline-now-line');
    // Un debordement de quelques pixels (le dernier libelle) ne justifie pas de decaler la frise (cela
    // cacherait la colonne de gauche) : on ne centre que si elle est VRAIMENT plus large que l'ecran.
    if (!now || sc.scrollWidth - sc.clientWidth < 80) return;
    sc.scrollLeft = Math.max(0, now.offsetLeft - sc.clientWidth / 2);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        if (n.classList.contains('timeline-scroll')) scrollToNow(n);
        else if (n.querySelectorAll) n.querySelectorAll('.timeline-scroll').forEach(scrollToNow);
      });
    });
  }).observe(document.body || document.documentElement, { childList: true, subtree: true });
})();

function loadRdvSlotStep() {
  var headers = SALON_SLUG ? { 'X-Salon-Slug': SALON_SLUG } : {};
  return fetch('/api/settings/public', { headers: headers })
    .then(function (r) { return r.json(); })
    .then(function (d) { rdvSlotStepMin = Number(d.rdv_slot_step_min) || 15; })
    .catch(function () {});
}

function timeStrToMinutes(t) { var hm = t.slice(0, 5).split(':'); return Number(hm[0]) * 60 + Number(hm[1]); }

function loadSalonScheduleForTimeline() {
  if (salonScheduleByWeekday) return Promise.resolve(salonScheduleByWeekday);
  return barberApi('/api/salon-calendar/schedule').then(function (r) {
    salonScheduleByWeekday = {};
    (r.schedules || []).forEach(function (x) {
      if (!x.active) return;
      salonScheduleByWeekday[x.weekday] = { startMin: timeStrToMinutes(x.start_time), endMin: timeStrToMinutes(x.end_time) };
    });
    return salonScheduleByWeekday;
  }).catch(function () { salonScheduleByWeekday = {}; return salonScheduleByWeekday; });
}

/** Coiffeurs affichés : tous ceux qui prennent des RDV (moi en premier), plus ceux qui ont un RDV ce jour-là. */
function posteTimelineBarbers(appts) {
  var list = (barbers || []).filter(function (b) { return b.accepts_appointments || (me && b.id === me.id); });
  appts.forEach(function (a) {
    if (a.barber_id && !list.some(function (b) { return b.id === a.barber_id; })) {
      list.push({ id: a.barber_id, name: a.barber_name || 'Coiffeur', accepts_appointments: 0 });
    }
  });
  if (me && !list.some(function (b) { return b.id === me.id; })) list.push({ id: me.id, name: me.name, accepts_appointments: 1 });
  return list.sort(function (x, y) {
    if (me && x.id === me.id) return -1;
    if (me && y.id === me.id) return 1;
    return String(x.name).localeCompare(String(y.name));
  });
}

function renderAgendaTimeline(dateStr) {
  // Salon fermé ce jour : pas de planning, le message rouge (posteAddBtnHtml) suffit.
  if (rdvIsSalonClosed(dateStr)) return '';
  var d = new Date(dateStr + 'T00:00:00');
  var appts = apptsForRange(d, d);
  appts.forEach(function (a) { calApptById[a.id] = a; });
  var rowsBarbers = posteTimelineBarbers(appts);

  var items = appts.map(function (a) {
    var hm = a.scheduled_at.slice(11, 16).split(':');
    return { id: a.id, barberId: a.barber_id, clientName: a.client_name, serviceName: a.service_name,
      startMin: Number(hm[0]) * 60 + Number(hm[1]), durMin: Math.max(a.duration_min || 30, 15), timeLabel: a.scheduled_at.slice(11, 16) };
  });

  // Plage horaire = heures d'ouverture du salon ce jour-là, élargie seulement si un RDV en dépasse.
  var weekday = d.getDay();
  var salonDay = salonScheduleByWeekday && salonScheduleByWeekday[weekday];
  var starts = items.map(function (it) { return it.startMin; }), ends = items.map(function (it) { return it.startMin + it.durMin; });
  var baseStart = salonDay ? salonDay.startMin : (starts.length ? Math.floor(Math.min.apply(null, starts) / 60) * 60 : 9 * 60);
  var baseEnd = salonDay ? salonDay.endMin : (ends.length ? Math.ceil(Math.max.apply(null, ends) / 60) * 60 : 19 * 60);
  var rangeStart = Math.floor(Math.min.apply(null, [baseStart].concat(starts)) / 60) * 60;
  var rangeEnd = Math.ceil(Math.max.apply(null, [baseEnd].concat(ends)) / 60) * 60;
  if (rangeEnd - rangeStart < 4 * 60) rangeEnd = rangeStart + 4 * 60;
  var hourCount = (rangeEnd - rangeStart) / 60;

  var stepMin = rdvSlotStepMin > 0 ? rdvSlotStepMin : 15;
  var hoursHtml = '';
  for (var t = rangeStart; t <= rangeEnd; t += stepMin) {
    var tFrac = (t - rangeStart) / (rangeEnd - rangeStart);
    hoursHtml += '<span' + (t % 60 === 0 ? ' class="h"' : '') + ' style="left: calc(22px + (100% - 22px) * ' + tFrac + ')">' +
      String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0') + '</span>';
  }

  var rowsHtml = rowsBarbers.map(function (b) {
    var color = barberColor(b.id);
    var blocksHtml = items.filter(function (it) { return it.barberId === b.id; }).map(function (it) {
      var leftPct = ((it.startMin - rangeStart) / (rangeEnd - rangeStart)) * 100;
      var widthPct = (it.durMin / (rangeEnd - rangeStart)) * 100;
      return '<div class="timeline-block" style="left:' + leftPct + '%;width:' + widthPct + '%;background:' + color + '" ' +
        'title="' + esc(it.timeLabel + ' — ' + it.clientName + ' — ' + (it.serviceName || '') + ' — ' + b.name) + '" ' +
        'onclick="event.stopPropagation();openPosteClientDrawer(\'' + it.id + '\')">' +
        '<span class="tb-time">' + esc(it.timeLabel) + '</span><span class="tb-name">' + esc(it.clientName) + '</span></div>';
    }).join('');
    var walkDay = isWalkinOn((barbers || []).find(function (x) { return x.id === b.id; }), dateStr);
    var trackClick = (rdvIsSalonClosed(dateStr) || isPastDay(dateStr)) ? ''
      : walkDay ? ' onclick="toast(\'' + esc(String(b.name).replace(/'/g, '')) + ' est en « sans RDV » ce jour-là : pas de rendez-vous\', true)"'
      : b.accepts_appointments || (me && b.id === me.id)
      ? ' onclick="openPosteAddAppointment(\'' + dateStr + '\',\'' + b.id + '\')" title="Ajouter un RDV pour ' + esc(b.name) + '"'
      : ' onclick="toast(\'' + esc(String(b.name).replace(/'/g, '')) + ' ne prend pas de RDV en ligne\', true)"';
    return '<div class="timeline-row">' +
      '<div class="timeline-row-label" title="' + esc(b.name) + '"><span class="dot" style="background:' + color + '"></span></div>' +
      '<div class="timeline-row-track"' + trackClick + '>' + blocksHtml + '</div>' +
      '</div>';
  }).join('');

  var nowLineHtml = '';
  var nowStr = nowSalonDatetimeString();
  if (dateStr === nowStr.slice(0, 10)) {
    var nowMin = Number(nowStr.slice(11, 13)) * 60 + Number(nowStr.slice(14, 16));
    if (nowMin >= rangeStart && nowMin <= rangeEnd) {
      nowLineHtml = '<div class="timeline-now-line" title="Maintenant — ' + nowStr.slice(11, 16) + '" ' +
        'style="left: calc(22px + (100% - 22px) * ' + ((nowMin - rangeStart) / (rangeEnd - rangeStart)) + ')"></div>';
    }
  }
  var stepPct = (stepMin / (rangeEnd - rangeStart)) * 100, hourPct = (60 / (rangeEnd - rangeStart)) * 100;
  var minuteGridHtml = '<div class="timeline-minute-grid" style="background-size:' + stepPct + '% 100%, ' + hourPct + '% 100%"></div>';

  var labelsPerHour = 60 / stepMin;
  var fitPerHour = Math.max(90, labelsPerHour * TIMELINE_LABEL_PX);
  var minZoom = Math.max(0.6, (labelsPerHour * TIMELINE_LABEL_PX) / fitPerHour);
  var effZoom = Math.max(0, timelineZoom);
  var compact = effZoom < minZoom;
  timelineMinZoom = 0; timelineEffectiveZoom = effZoom;
  var innerWidth = Math.round(hourCount * fitPerHour * effZoom);
  if (compact) {
    var shown = document.querySelector('.timeline-scroll');
    var avail = (shown && shown.clientWidth) || 900;
    var readable = Math.round(hourCount * fitPerHour * minZoom);
    innerWidth = readable <= avail ? 0 : Math.round(avail + (readable - avail) * (effZoom / minZoom));
  }
  var zoomCtrl = '<div class="timeline-zoom-ctrl"><div class="timeline-zoom-ctrl-inner">' +
    '<button type="button" onclick="event.stopPropagation();adjustAgendaZoom(-1)" title="Dézoomer"' + (effZoom === 0 ? ' disabled' : '') + '>−</button>' +
    '<span>' + Math.round(effZoom * 100) + '%</span>' +
    '<button type="button" onclick="event.stopPropagation();adjustAgendaZoom(1)" title="Zoomer">+</button>' +
    '</div></div>';
  return zoomCtrl + '<div class="timeline-scroll"><div class="timeline-inner' + (compact ? ' compact' : '') + (effZoom === 0 ? ' fit' : '') + '" ' +
    'data-date="' + dateStr + '" data-range-start="' + rangeStart + '" data-range-end="' + rangeEnd + '" style="min-width:' + innerWidth + 'px">' +
    '<div class="timeline-hours">' + hoursHtml + '</div>' + minuteGridHtml + rowsHtml + nowLineHtml +
    '</div></div>';
}

/** Déplace juste la ligne « maintenant », sans reconstruire le reste. */
function updateAgendaNowLines() {
  var nowStr = nowSalonDatetimeString(), todayStr = nowStr.slice(0, 10);
  var nowMin = Number(nowStr.slice(11, 13)) * 60 + Number(nowStr.slice(14, 16));
  document.querySelectorAll('.timeline-inner[data-range-start]').forEach(function (inner) {
    var rs = Number(inner.dataset.rangeStart), re = Number(inner.dataset.rangeEnd);
    var line = inner.querySelector('.timeline-now-line');
    if (!(inner.dataset.date === todayStr && nowMin >= rs && nowMin <= re)) { if (line) line.remove(); return; }
    if (!line) { line = document.createElement('div'); line.className = 'timeline-now-line'; inner.appendChild(line); }
    line.style.left = 'calc(22px + (100% - 22px) * ' + ((nowMin - rs) / (re - rs)) + ')';
    line.title = 'Maintenant — ' + nowStr.slice(11, 16);
  });
}
if (!agendaNowLineTimer) agendaNowLineTimer = setInterval(updateAgendaNowLines, 30000);

function adjustAgendaZoom(delta) {
  var base = timelineEffectiveZoom == null ? timelineZoom : timelineEffectiveZoom;
  timelineZoom = Math.max(0, Math.min(2.5, +(base + delta * 0.2).toFixed(2)));
  if (calViewMode === 'day') renderCalDay();
  else if (calSelectedDate) { if (calViewMode === 'month') renderCalMonth(); else renderCalWeek(); }
}

/**
 * Ajout manuel d'un RDV par le coiffeur lui-même (client au téléphone)
 * - toujours pour lui-même, pas d'étape de choix du coiffeur (contrairement
 * à l'assistant admin). Email optionnel, comme côté admin.
 */
/** « Plusieurs personnes » depuis « Ajouter un RDV » de Mon poste (le coiffeur connecté par défaut). */
var paGroupCtx = null;
function paOpenGroup() {
  if (!paGroupCtx) return;
  var ctx = paGroupCtx;
  var client = StaffGroupBooking.readClient(ctx.overlay, 'pa');
  if (!client) return;
  _closeModal(ctx.overlay);
  StaffGroupBooking.open({
    api: barberApi, client: client,
    onDone: function () { Object.keys(calMonthCache).forEach(function (k) { delete calMonthCache[k]; }); loadAgendaPeriod(); }
  });
}

function openPosteAddAppointment(dateStr, barberId) {
  if (isPastDay(dateStr)) {
    toast('Date passée : impossible de prendre un rendez-vous ce jour-là.', true);
    return;
  }
  if (rdvIsSalonClosed(dateStr)) {
    toast('Salon fermé ce jour : impossible de créer un rendez-vous.', true);
    return;
  }
  var when = new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' });
  // Coiffeur du RDV : moi par défaut, ou le collègue dont on a touché la ligne dans le planning.
  var targetId = barberId || (me && me.id);
  var target = (typeof barbers !== 'undefined' && barbers ? barbers : []).filter(function (b) { return b.id === targetId; })[0] || (me && targetId === me.id ? me : null);
  var forOther = !!(me && targetId !== me.id);
  var state = { serviceId: null, extraIds: [], productIds: [], time: null };
  // Offre du coiffeur du RDV : ses prestations et son tarif personnalisé (barberItems, app.js).
  var svcOffer = typeof barberItems === 'function' ? barberItems(target, 'services', services) : services;
  var extOffer = typeof barberItems === 'function' ? barberItems(target, 'extras', extras) : extras;

  var overlay = _buildModal(
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">' +
    '<div style="min-width:0"><div class="modal-title" style="margin-bottom:0">Ajouter un RDV — ' + (forOther && target ? esc(target.name) + ' — ' : '') + when + '</div>' +
      StaffGroupBooking.clientPillHtml('pa', "paGoStep('client')") +
    '</div>' +
    '<button id="pa-close-x" style="background:var(--fill);border:none;width:30px;height:30px;border-radius:50%;color:var(--grey);font-size:14px;cursor:pointer;flex-shrink:0;margin-left:10px">✕</button>' +
    '</div>' +

    // 1re étape : le client (clients existants proposés dès 3 lettres), puis une ou plusieurs personnes - comme le dashboard et la caisse.
    StaffGroupBooking.clientStepHtml('pa', 'paStartSolo()', 'paOpenGroup()') +

    '<div id="pa-step-service" style="display:none">' +
      '<button class="aa-back" onclick="paGoStep(\'client\')">‹ Retour</button>' +
      '<div class="aa-step-title">Prestation</div>' +
      '<div class="item-grid compact" id="pa-service-grid"></div>' +
    '</div>' +

    '<div id="pa-step-extras" style="display:none">' +
      '<button class="aa-back" onclick="paGoStep(\'service\')">‹ Retour</button>' +
      '<div class="aa-step-title">Suppléments (optionnels)</div>' +
      vitrineSearchHtml('pa-extras', 'Rechercher un supplément', "paFilter('extras')") +
      '<div class="item-grid compact" id="pa-extras-grid"></div>' +
      '<div class="items-empty" id="pa-extras-empty">Aucun résultat</div>' +
      '<div class="step-bar"><div class="step-summary" id="pa-extras-summary"></div>' +
      '<button class="btn btn-primary" style="width:100%" onclick="paGoStep(\'products\')">Suivant</button></div>' +
    '</div>' +

    '<div id="pa-step-products" style="display:none">' +
      '<button class="aa-back" onclick="paGoStep(\'extras\')">‹ Retour</button>' +
      '<div class="aa-step-title">Un produit à acheter sur place ? (optionnel)</div>' +
      vitrineSearchHtml('pa-products', 'Rechercher un produit', "paFilter('products')") +
      '<div class="item-grid compact" id="pa-products-grid"></div>' +
      '<div class="items-empty" id="pa-products-empty">Aucun résultat</div>' +
      '<div class="step-bar"><div class="step-summary" id="pa-products-summary"></div>' +
      '<button class="btn btn-primary" style="width:100%" onclick="paGoStep(\'datetime\')">Suivant</button></div>' +
    '</div>' +

    '<div id="pa-step-datetime" style="display:none">' +
      '<button class="aa-back" onclick="paGoStep(\'products\')">‹ Retour</button>' +
      '<div class="aa-step-title">Créneau</div>' +
      '<div id="pa-half-toggle" class="half-toggle" style="display:none;margin-bottom:8px">' +
        '<button id="pa-half-morning" onclick="paShowHalf(\'morning\')">Matin</button>' +
        '<button id="pa-half-afternoon" onclick="paShowHalf(\'afternoon\')">Après-midi</button>' +
      '</div>' +
      '<div class="aa-slots" id="pa-slots"><span class="hint" style="margin:0">Chargement…</span></div>' +
    '</div>' +

    '<div id="pa-step-contact" style="display:none">' +
      '<button class="aa-back" onclick="paGoStep(\'datetime\')">‹ Retour</button>' +
      '<div class="aa-step-title" id="pa-contact-summary"></div>' +
      '<div class="hint" id="pa-contact-client" style="margin:0 0 14px"></div>' +
      '<div class="modal-error" id="pa-error" style="display:none"></div>' +
      '<div class="modal-actions">' +
      '<button class="btn btn-soft" id="pa-cancel-btn">Annuler</button>' +
      '<button class="btn btn-primary" id="pa-save-btn">Ajouter le RDV</button>' +
      '</div>' +
    '</div>'
  );
  paGroupCtx = { overlay: overlay, dateStr: dateStr };
  var flowRefresh = vitrineFlow(overlay, function () {
    function pick(list, ids) { return list.filter(function (x) { return ids.indexOf(String(x.id)) !== -1; }); }
    return {
      service: svcOffer.find(function (x) { return String(x.id) === String(state.serviceId); }),
      extras: pick(extOffer, state.extraIds.map(String)), products: pick(products, state.productIds.map(String)),
      barber: forOther && target ? target.name : '', when: when, time: state.time
    };
  });

  var STEPS = ['client', 'service', 'extras', 'products', 'datetime', 'contact'];
  attachClientAutocomplete(overlay, 'pa-name', 'pa-email', 'pa-phone', barberApi);
  setTimeout(function () { var n = overlay.querySelector('#pa-name'); if (n) n.focus(); }, 60);

  window.paGoStep = function (step) {
    STEPS.forEach(function (s) { overlay.querySelector('#pa-step-' + s).style.display = s === step ? 'flex' : 'none'; });
    overlay.querySelector('#pa-client-pill').style.display = step === 'client' ? 'none' : 'inline-flex';
    if (step === 'datetime') paLoadSlots();
    if (step === 'contact') {
      var s = svcOffer.find(function (x) { return x.id === state.serviceId; });
      overlay.querySelector('#pa-contact-summary').textContent = when + ' à ' + state.time + ' — ' + (s ? s.name : '');
      var c = StaffGroupBooking.readClient(overlay, 'pa') || {};
      overlay.querySelector('#pa-contact-client').textContent = [c.email, c.phone].filter(Boolean).join(' · ') || 'Sans email ni téléphone';
    }
  };

  window.paStartSolo = function () {
    if (!StaffGroupBooking.readClient(overlay, 'pa')) return;
    paGoStep('service');
  };

  // Prestations, supplements et produits : memes cartes de vitrine que la reservation en ligne (code partage dans app.js).
  function paListCfg(kind) {
    return {
      kind: kind, gridId: 'pa-' + kind + '-grid', searchId: 'pa-' + kind + '-search', qId: 'pa-' + kind + '-q', emptyId: 'pa-' + kind + '-empty', summaryId: 'pa-' + kind + '-summary',
      items: kind === 'extras' ? extOffer : products.filter(function (p) { return p.online_bookable !== 0; }),   // « caisse seulement » : pas proposé dans un RDV
      chosen: kind === 'extras' ? state.extraIds : state.productIds,
      onclick: kind === 'extras' ? 'paToggleExtra(this)' : 'paToggleProduct(this)'
    };
  }
  vitrineRender({ kind: 'services', gridId: 'pa-service-grid', items: svcOffer, chosen: [], onclick: 'paSelectService(this)' });
  vitrineRender(paListCfg('extras'));
  vitrineRender(paListCfg('products'));
  window.paFilter = function (kind) { vitrineFilter(paListCfg(kind)); };

  window.paSelectService = function (el) {
    state.serviceId = el.dataset.id;
    vitrineSelectOne(el);
    paGoStep('extras');
  };

  window.paToggleExtra = function (el) {
    var id = el.dataset.id;
    var i = state.extraIds.indexOf(id);
    if (i === -1) state.extraIds.push(id); else state.extraIds.splice(i, 1);
    vitrineToggle(el);
    vitrineSummary(paListCfg('extras'));
  };

  // Un seul exemplaire par produit depuis ce parcours (comme sur rdv.html) - le coiffeur ajuste la quantite
  // lui-meme a la caisse si besoin de plus.
  window.paToggleProduct = function (el) {
    var id = el.dataset.id;
    var i = state.productIds.indexOf(id);
    if (i === -1) state.productIds.push(id); else state.productIds.splice(i, 1);
    vitrineToggle(el);
    vitrineSummary(paListCfg('products'));
  };

    var slotsByHalf = { morning: [], afternoon: [] };
  var currentHalf = 'afternoon';

  function paRenderHalf() {
    var slotsEl = overlay.querySelector('#pa-slots');
    var list = slotsByHalf[currentHalf];
    slotsEl.innerHTML = list.length
      ? list.map(function (s) {
          return '<button class="aa-slot" data-time="' + s.time + '" onclick="paSelectSlot(this)">' + s.time + '</button>';
        }).join('')
      : '<span class="hint" style="margin:0">Aucun créneau ' + (currentHalf === 'morning' ? 'le matin' : "l'après-midi") + '</span>';
  }

  window.paShowHalf = function (half) {
    currentHalf = half;
    overlay.querySelector('#pa-half-morning').classList.toggle('sel', half === 'morning');
    overlay.querySelector('#pa-half-afternoon').classList.toggle('sel', half === 'afternoon');
    paRenderHalf();
  };

  function paLoadSlots() {
    var slotsEl = overlay.querySelector('#pa-slots');
    var toggleEl = overlay.querySelector('#pa-half-toggle');
    slotsEl.innerHTML = '<span class="hint" style="margin:0">Chargement…</span>';
    toggleEl.style.display = 'none';
    barberApi('/api/appointments/availability?date=' + dateStr + '&service_id=' + state.serviceId + '&barber_id=' + targetId + '&extras=' + state.extraIds.join(','), { actingAs: targetId })
      .then(function (r) {
        if (!r.slots.length) { slotsEl.innerHTML = '<span class="hint" style="margin:0">Aucun créneau disponible ce jour-là</span>'; return; }

        slotsByHalf.morning = r.slots.filter(function (s) { return s.time < '12:00'; });
        slotsByHalf.afternoon = r.slots.filter(function (s) { return s.time >= '12:00'; });

        if (!slotsByHalf.morning.length) {
          toggleEl.style.display = 'none';
          currentHalf = 'afternoon';
          paRenderHalf();
        } else {
          toggleEl.style.display = 'flex';
          paShowHalf('morning');
        }
      })
      .catch(function (e) { slotsEl.innerHTML = ''; toast(e.message, true); });
  }

  window.paSelectSlot = function (el) {
    state.time = el.dataset.time;
    overlay.querySelectorAll('#pa-slots .aa-slot').forEach(function (c) { c.classList.remove('sel'); });
    el.classList.add('sel');
    paGoStep('contact');
  };

  overlay.querySelector('#pa-close-x').onclick = function () { _closeModal(overlay); };
  overlay.querySelector('#pa-cancel-btn').onclick = function () { _closeModal(overlay); };

  overlay.querySelector('#pa-save-btn').onclick = function () {
    var errEl = overlay.querySelector('#pa-error');
    var name = overlay.querySelector('#pa-name').value.trim();
    if (!name) { paGoStep('client'); StaffGroupBooking.readClient(overlay, 'pa'); return; }

    barberApi('/api/appointments/admin-create', {
      method: 'POST',
      actingAs: targetId,   // RDV au nom du coiffeur choisi (moi ou un collègue)
      body: {
        barber_id: targetId,
        client_name: name,
        email: overlay.querySelector('#pa-email').value.trim(),
        phone: overlay.querySelector('#pa-phone').value.trim(),
        service_id: state.serviceId, extras: state.extraIds,
        products: state.productIds.map(function (id) { return { id: id, quantity: 1 }; }),
        date: dateStr, time: state.time,
        base_url: window.location.origin + '/rdv.html'
      }
    }).then(function () {
      _closeModal(overlay);
      toast(forOther && target ? 'RDV ajouté pour ' + target.name : 'RDV ajouté');
      Object.keys(calMonthCache).forEach(function (k) { delete calMonthCache[k]; });
      loadAgendaPeriod();
    }).catch(function (e) { errEl.textContent = e.message; errEl.style.display = 'block'; });
  };
}

/**
 * Tiroir client simplifié (coiffeur) - infos + note interne
 * modifiable via le même endpoint que la section 'À suivre'. La note
 * n'est modifiable que si ce RDV est déjà une vraie ligne de file
 * (promoted_queue_id posé, ex: RDV du jour même) - un RDV futur pas
 * encore promu n'a encore rien à éditer.
 */
function openPosteClientDrawer(id) {
  var a = calApptById[id];
  if (!a) return;

  var when = new Date(a.scheduled_at.replace(' ', 'T')).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' }) +
    ' à ' + a.scheduled_at.slice(11, 16);

  var overlay = _buildModal(
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">' +
    '<div class="modal-title" style="margin-bottom:0">' + esc(a.client_name) + '</div>' +
    '<button id="pcd-close-x" style="background:var(--fill);border:none;width:30px;height:30px;border-radius:50%;color:var(--grey);font-size:14px;cursor:pointer;flex-shrink:0;margin-left:10px">✕</button>' +
    '</div>' +
    '<div class="detail-row"><span class="detail-label">Quand</span><span class="detail-value" style="text-transform:capitalize">' + when + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Prestation</span><span class="detail-value">' + esc(a.service_name) + '</span></div>' +
    (a.barber_name ? '<div class="detail-row"><span class="detail-label">Coiffeur</span><span class="detail-value">' + esc(a.barber_name) + (me && a.barber_id === me.id ? ' (moi)' : '') + '</span></div>' : '') +
    (a.email ? '<div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">' + esc(a.email) + '</span></div>' : '') +
    (a.phone ? '<div class="detail-row"><span class="detail-label">Téléphone</span><span class="detail-value">' + esc(a.phone) + '</span></div>' : '') +
    (a.client_note ? '<div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="detail-label">📝 Note du client (RDV)</span><span class="detail-value" style="font-weight:400">' + esc(a.client_note) + '</span></div>' : '') +
    '<div style="margin-top:14px">' +
      '<label style="display:block;font-size:12.5px;font-weight:600;color:var(--grey);margin-bottom:6px">Note interne</label>' +
      (a.promoted_queue_id && (!a.barber_id || (me && a.barber_id === me.id))
        ? '<textarea id="pcd-note" rows="2" style="width:100%;padding:11px 13px;border:1px solid var(--sep);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical;margin-bottom:8px">' + esc(a.note || '') + '</textarea>' +
          '<button class="btn btn-soft" id="pcd-save-note-btn" style="width:100%">Enregistrer la note</button>'
        : '<p class="hint" style="margin:0">' + (a.barber_id && me && a.barber_id !== me.id ? 'RDV d\'un collègue : sa note interne se modifie depuis son poste.' : 'Pas encore modifiable — ce RDV entrera dans la file le jour même.') + '</p>') +
    '</div>'
  );

  overlay.querySelector('#pcd-close-x').onclick = function () { _closeModal(overlay); };

  var saveBtn = overlay.querySelector('#pcd-save-note-btn');
  if (saveBtn) {
    saveBtn.onclick = function () {
      var note = overlay.querySelector('#pcd-note').value;
      barberApi('/api/queue/' + a.promoted_queue_id + '/note', { method: 'PUT', body: { note: note } })
        .then(function () { a.note = note; toast('Note enregistrée'); })
        .catch(function (e) { toast(e.message, true); });
    };
  }
}
