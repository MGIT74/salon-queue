<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<script>
  // Anti-flash de theme : applique le mode sombre AVANT le premier
  // affichage si necessaire (au lieu d'attendre le chargement d'app.js,
  // ce qui provoquait un flash visible du mode clair a chaque
  // rafraichissement pour les utilisateurs en mode sombre). Doit rester
  // synchrone et place avant toute feuille de style.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mon poste</title>
<script>
  (function () {
    try {
      var saved = JSON.parse(sessionStorage.getItem('poste-session') || 'null');
      if (saved && saved.id && saved.pin) document.documentElement.classList.add('auth-checking');
    } catch (e) {}
  })();
</script>
<script>
  // Adresse SANS ?salon=... : on masque la page le temps de savoir si la plateforme heberge plusieurs salons
  // (voir requireSalonInUrl dans app.js) - pour ne jamais montrer, meme une fraction de seconde, un ecran sans salon.
  try { if (!new URLSearchParams(window.location.search).get('salon')) { document.documentElement.classList.add('no-slug'); var st = document.createElement('style'); st.textContent = 'html.no-slug body > *:not(#no-salon) { visibility: hidden !important; }'; document.head.appendChild(st); } } catch (e) {}
</script>
<style>
  html.auth-checking #login-screen { display: none; }

  /* Agenda : même planning du jour (timeline par coiffeur) que le tableau de bord et la caisse. */
  /* --- Planning du jour (timeline), utilisée dans l'Agenda --- */
  .timeline-scroll { overflow-x: auto; width: 100%; max-width: 100%; }
  .timeline-inner { position: relative; }
  .timeline-hours { position: relative; height: 18px; margin-bottom: 6px; }
  .timeline-hours span { position: absolute; top: 0; font-size: 12px; color: var(--grey); white-space: nowrap; transform: translateX(-1px); }
  .timeline-hours span.h { color: var(--ink); font-weight: 600; }
  /* Dezoome sous la largeur lisible (jusqu'a 0 % = journee entiere a l'ecran) : seules les heures pleines restent. */
  .timeline-hours span.lbl-off { display: none; }   /* libelles intermediaires qui n'ont pas la place (voir timelineFitLabels, app.js) */
  .timeline-inner.compact .timeline-hours span.h { font-size: 11px; }
  /* Vue resserree (jusqu'a 0 %) : l'heure reste affichee au-dessus du nom, exactement comme a 100 %. */
  .timeline-inner.compact .timeline-block { padding: 2px 6px; }
  .timeline-inner.compact .timeline-hours span.h:last-child { transform: translateX(-100%); }
  /* Les traits de chaque pas (5 min...) deviennent trop serres : on ne garde que les traits des heures. */
  .timeline-row { display: flex; align-items: center; min-height: 54px; border-top: 1px solid var(--sep); }
  .timeline-row:first-child { border-top: none; }
  .timeline-row-label { width: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding-right: 0; }
  .timeline-row-label .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .timeline-row-track { position: relative; flex: 1; height: 40px; }
  .timeline-block {
    position: absolute; top: 3px; bottom: 3px; border-radius: 8px; padding: 2px 8px;
    font-size: 12.5px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; line-height: 1.15;
  }
  /* Heure du rendez-vous, au-dessus du nom du client. */
  .timeline-block .tb-time { font-size: 10.5px; font-weight: 700; opacity: .92; letter-spacing: .2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .timeline-block .tb-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .timeline-now-line {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent, var(--blue));
    z-index: 5; cursor: help;
  }
  .timeline-now-line::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--accent, var(--blue));
  }
  .timeline-now-line::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 7px solid var(--accent, var(--blue));
  }
  .timeline-empty { padding: 20px 0; text-align: center; color: var(--grey); font-size: 14px; }
  .timeline-row-track { cursor: pointer; }
  .timeline-minute-grid {
    position: absolute; left: 22px; right: 0; top: 0; bottom: 0; pointer-events: none; z-index: 0;
    /* 1re couche : un trait fin a chaque pas ; 2e couche : un trait plus marque a chaque heure */
    background-image: linear-gradient(to right, var(--sep) 1px, transparent 1px),
                      linear-gradient(to right, rgba(128,128,128,.38) 1px, transparent 1px);
    background-repeat: repeat-x, repeat-x; background-position: left top, left top;
  }
  .timeline-zoom-ctrl { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
  .timeline-zoom-ctrl-inner { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 999px; padding: 4px 6px; }
  .timeline-zoom-ctrl button {
    width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--card); color: var(--ink);
    font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: inherit; line-height: 1;
  }
  .timeline-zoom-ctrl span { font-size: 11px; color: var(--grey); min-width: 32px; text-align: center; }

/* Fermetures exceptionnelles visibles dans toutes les vues RDV. */
.cal-day.salon-closed{background:rgba(128,128,128,.13);box-shadow:inset 0 0 0 1px rgba(150,150,150,.27)}
.cal-day.salon-closed .cal-day-num{text-decoration:line-through;opacity:.65}

.salon-closure-banner{padding:10px 13px;border-radius:9px;margin:0 0 12px;background:rgba(160,100,100,.13);color:var(--red,#e65c5c);font-weight:650;font-size:13px}
</style>

<style>
  html, body { min-height: 100%; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 40px; }

  /* --- Écran de connexion --- */
  .login { text-align: center; padding-top: 12vh; }

  .login h1 { font-size: 28px; font-weight: 600; letter-spacing: -.03em; margin: 0 0 36px; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; }

  .pin-dot.filled { background: var(--blue); border-color: var(--blue); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto; }
  .keypad button {
    aspect-ratio: 1; border: none; border-radius: 50%; background: var(--fill);
    color: var(--ink); font-size: 24px; font-weight: 500; font-family: inherit; cursor: pointer;
  }

  /* --- Écran principal --- */

  .logout-btn { background: none; border: none; color: var(--grey); font-family: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; }

  .active-card {

    box-shadow: var(--shadow); margin-bottom: 22px;
  }

  .big-timer { font-size: 48px; font-weight: 600; letter-spacing: -.05em; font-variant-numeric: tabular-nums; color: var(--green); line-height: 1; margin-bottom: 4px; }

  .timer-sub { font-size: 13px; color: var(--grey); margin-bottom: 20px; }
  .timer-sub.over { color: var(--red); font-weight: 500; }
  .active-card .btn { width: 100%; margin-bottom: 8px; padding: 14px; font-size: 15px; }

  #extras-picker { text-align: left; background: var(--fill); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .extra-opt { display: flex; align-items: center; gap: 10px; padding: 8px 2px; font-size: 14.5px; cursor: pointer; }
  .extra-opt input { width: 18px; height: 18px; }
  .extra-price { margin-left: auto; color: var(--grey); font-size: 13px; }
  #extras-picker .btn { margin-top: 6px; }

  .note-block { text-align: left; margin-bottom: 14px; }

  .note-block textarea {
    width: 100%; padding: 12px 14px; border: none; border-radius: 12px; background: var(--fill);
    color: var(--ink); font-family: inherit; font-size: 14.5px; resize: vertical; margin-bottom: 8px;
  }

  .section-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--grey); margin: 0 0 12px 2px; }
  .next-item { margin-bottom: 10px; }
  .next-card {
    background: var(--card); border-radius: 16px; padding: 18px;
    box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .next-card.locked { opacity: .7; }
  .next-card.prep-alert {
    opacity: 1; box-shadow: 0 0 0 2px var(--orange, #f97316);

  @keyframes prep-pulse {

  .next-info { cursor: pointer; flex: 1; min-width: 140px; }

  .next-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .next-card .btn { flex-shrink: 0; padding: 11px 16px; font-size: 13.5px; }
  .btn-outline-red {
    background: none; border: 1.5px solid var(--red); color: var(--red);
    border-radius: 999px; font-family: inherit; font-weight: 600; cursor: pointer;
  }

  .next-detail {
    background: var(--fill); border-radius: 16px; padding: 16px 18px; margin-top: 8px;
    text-align: left;
  }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--sep); }
  .detail-row:last-of-type { border-bottom: none; margin-bottom: 10px; }
  .detail-label { font-size: 13px; color: var(--grey); }
  .detail-value { font-size: 13.5px; font-weight: 500; text-align: right; word-break: break-word; }
  .next-detail label { display: block; font-size: 12.5px; font-weight: 600; color: var(--grey); margin-bottom: 6px; }
  .next-detail textarea {
    width: 100%; padding: 11px 13px; border: none; border-radius: 10px; background: var(--card);
    color: var(--ink); font-family: inherit; font-size: 14px; resize: vertical; margin-bottom: 8px;
  }
  .lock-note { font-size: 12px; color: var(--orange); margin-top: 4px; }
  .lock-note.prep-alert-note { font-weight: 700; }

  .empty { background: var(--card); border-radius: 16px; padding: 30px 20px; text-align: center; color: var(--grey); font-size: 14px; box-shadow: var(--shadow); }

  /* --- Footer de navigation (Accueil / Agenda / Déconnexion) --- */
  .poste-footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--card); box-shadow: 0 -6px 20px rgba(0,0,0,.1);

  .poste-footer button .ic { display: block; }
  .poste-footer button.on { color: var(--blue); font-weight: 600; }
  body.has-poste-footer #app-screen { padding-bottom: 84px; }
  body.has-poste-footer .toast { bottom: 100px; }


  /* --- Agenda : copie conforme du calendrier du menu Rendez-vous (dashboard.html) --- */
  .card-box { background: var(--card); border-radius: 16px; padding: 22px; box-shadow: var(--shadow, 0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px var(--sep));
              margin-bottom: 14px; transition: background .25s ease; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .cal-month-label { font-size: 17px; font-weight: 600; letter-spacing: -.02em; text-transform: capitalize; }
  .cal-view-switch { display: flex; background: var(--fill); border-radius: 10px; padding: 3px; gap: 2px; }
  .cal-view-switch button {
    border: none; background: none; color: var(--grey); font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
  }
  .cal-view-switch button.on { background: var(--blue); color: #fff; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-week-row { margin-bottom: 4px; }
  .cal-expand-panel.no-anim { animation: none; } /* meme jour redessine (actualisation) : pas d'animation, sinon il clignote */
  .cal-expand-panel {
    background: var(--fill); border-radius: 14px; padding: 16px 18px; margin: 6px 0 10px;
    animation: cal-expand .18s ease; min-width: 0; grid-column: 1 / -1;
  }
  @keyframes cal-expand { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .cal-expand-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14.5px; text-transform: capitalize; }
  .cal-expand-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px; cursor: pointer;
    transition: background .12s ease;
  }
  .cal-expand-row:hover { background: rgba(255,255,255,.06); }
  .cal-weekday { text-align: center; font-size: 12px; color: var(--grey); font-weight: 600; padding: 6px 0 10px; }
  .cal-day {
    min-height: 62px; border-radius: 10px; background: var(--fill); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    position: relative; padding: 6px 2px;
  }
  /* Survol : simple changement de fond (l'ancien filtre de luminosite faisait scintiller le calendrier). */
  .cal-day:not(.empty):not(.selected):hover { background: var(--fill-2); }
  /* Jour passé : grisé et non cliquable (plus de prise de RDV), comme le calendrier de réservation en ligne. */
  /* Jour passe : grise mais toujours cliquable pour consulter ses rendez-vous (la prise de RDV y reste bloquee). */
  .cal-day.past { opacity: .5; }
  .cal-day.past .cal-day-num { color: var(--grey); }
  .cal-day.empty { background: none; cursor: default; }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--blue); }
  .cal-day.selected { background: var(--blue); }
  .cal-day.selected .cal-day-num { color: #fff; }
  .cal-day-num { font-size: 13px; font-weight: 600; }
  .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--sep); }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--grey); }
  .cal-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .cal-barber-picker { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 20px; }
  .cal-legend-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer; padding: 0; transition: border-color .15s ease, opacity .15s ease; box-sizing: border-box;
  }
  .cal-legend-avatar.selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
  .cal-legend-avatar.dimmed { opacity: .35; }
  .cal-day-view-list { display: flex; flex-direction: column; gap: 8px; }
  .cal-day-view-appt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--fill); }
  .cal-day-view-time { font-size: 14px; font-weight: 700; min-width: 52px; }
  .cal-day-view-name { font-size: 14px; font-weight: 600; }
  .cal-day-view-meta { font-size: 12.5px; color: var(--grey); }

  /* Assistant "Ajouter un RDV" (coiffeur, toujours pour lui-même) */
  .aa-step-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .aa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; margin-bottom: 6px; }
  .aa-card {
    border: none; background: var(--fill); color: var(--ink); border-radius: 14px;
    padding: 14px 10px; cursor: pointer; font-family: inherit; text-align: center;
    font-size: 13.5px; font-weight: 600; transition: background .15s ease;
  }
  .aa-card .aa-meta { display: block; font-size: 11.5px; font-weight: 400; color: var(--grey); margin-top: 3px; }
  .aa-card.sel { background: var(--blue); color: #fff; }
  .aa-card.sel .aa-meta { color: rgba(255,255,255,.8); }
  .aa-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 6px; }
  .aa-chip {
    border: none; background: var(--fill); color: var(--ink); border-radius: 999px;
    padding: 9px 13px; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 500;
  }
  .aa-chip .aa-meta { color: var(--grey); margin-left: 4px; }
  .aa-chip.sel { background: var(--blue); color: #fff; }
  .aa-chip.sel .aa-meta { color: rgba(255,255,255,.75); }
  .aa-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr)); gap: 7px; margin-bottom: 6px; }

  .aa-slot.sel { background: var(--blue); color: #fff; }
  .aa-group-link { display: inline-flex; align-items: center; gap: 7px; align-self: flex-end; background: var(--fill); border: none; border-radius: 999px; padding: 7px 13px; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer; margin-bottom: 10px; }
  .aa-group-link:hover { background: var(--fill-2); }
  .aa-back { background: none; border: none; padding: 0; font-family: inherit; font-size: 13.5px; color: var(--accent); font-weight: 500; cursor: pointer; margin-bottom: 14px; }

  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--sep); }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-label { font-size: 12.5px; color: var(--grey); flex-shrink: 0; }
  .detail-value { font-size: 13.5px; font-weight: 500; text-align: right; word-break: break-word; }

  /* ===== Tablette (700 px et plus) : plus large, calendrier plus aere. Telephone (moins de 700 px) inchange. ===== */
  @media (min-width: 700px) {
    .wrap { max-width: 1180px; padding: 24px 28px 120px; }
    #p-home { max-width: 820px; margin: 0 auto; }
    .card-box { padding: 24px; }
    .cal-nav { flex-wrap: nowrap; justify-content: flex-start; }
    .cal-nav > .btn:first-child { order: 1; }
    .cal-nav .cal-month-label { order: 2; font-size: 19px; min-width: 0; }
    .cal-nav > .btn:last-child { order: 3; }
    .cal-nav .cal-view-switch { order: 4; margin-left: auto; }
    .cal-view-switch button { padding: 9px 18px; font-size: 14px; }
    .cal-grid { gap: 6px; }
    .cal-week-row { margin-bottom: 6px; }
    .cal-day { min-height: 82px; border-radius: 12px; }
    .cal-day-num { font-size: 16px; }
    .cal-dot { width: 7px; height: 7px; }
    .cal-weekday { font-size: 13px; }
    .cal-expand-panel { padding: 20px 22px; }
    .cal-legend-item { font-size: 14px; }
  }
  @media (min-width: 1000px) {
    .agenda-split { display: grid; grid-template-columns: minmax(380px, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .agenda-split > .card-box { margin-bottom: 0; }
    /* Vue Jour : pas de colonne de droite, le planning prend toute la largeur. */
    .agenda-split:has(> #cal-side[style*="none"]) { grid-template-columns: minmax(0, 1fr); }
    .agenda-side { position: sticky; top: 16px; min-width: 0; }
    .agenda-side .cal-expand-panel { background: none; padding: 0; margin: 0; }
    .agenda-side-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 320px; color: var(--grey); font-size: 15px; text-align: center; }
    .agenda-cal .cal-day { min-height: 62px; }
    .agenda-cal .cal-nav { flex-wrap: wrap; }
    .agenda-cal .cal-nav .cal-view-switch { margin-left: 0; width: 100%; order: 4; }
    .agenda-cal .cal-nav .cal-view-switch button { flex: 1; }
    .agenda-cal .cal-nav .cal-month-label { flex: 1; text-align: center; }
  }

  /* --- Tiroir client d'un RDV (même principe que le tiroir client du dashboard) --- */
  .appt-drawer-backdrop {
    display: flex; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .appt-drawer-backdrop.on { opacity: 1; pointer-events: auto; }
  .appt-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw);
    background: var(--card); box-shadow: -10px 0 40px rgba(0,0,0,0.3);
    transform: translateX(100%); transition: transform .38s cubic-bezier(.32,.72,0,1);
    z-index: 301; overflow-y: auto; padding: 24px;
  }
  .appt-drawer-backdrop.on .appt-drawer { transform: translateX(0); }
  .appt-drawer-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .appt-drawer-head h2 { font-size: 21px; margin: 0; letter-spacing: -.02em; }
  .appt-drawer .x { background: var(--fill); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--grey); font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .appt-drawer-section { margin-bottom: 22px; }
  .ad-visit-row { background: var(--fill); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .ad-visit-row .ad-visit-date { font-size: 13.5px; font-weight: 600; }
  .ad-visit-row .ad-visit-meta { font-size: 12.5px; color: var(--grey); margin-top: 2px; }
  .ad-visit-count { font-size: 13.5px; color: var(--grey); margin-bottom: 12px; }
  .appt-drawer-section h3 { font-size: 13px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
  .appt-drawer textarea, .appt-drawer .fld input { width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--sep); border-radius: 10px; background: var(--card); color: var(--ink); font-family: inherit; font-size: 14.5px; }
  .appt-drawer textarea { resize: vertical; }
  .ad-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--accent); margin-bottom: 12px; }
  .ad-badge.cancelled { background: rgba(196,0,27,.12); color: var(--red); }
  .ad-badge.done { background: rgba(30,126,52,.14); color: var(--green); }
  .ad-link-edit { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--accent); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0; margin: 0 0 14px; }

  /* ---------- Vue « Jour » (proposition C) : recherche client, coup d'œil équipe, agenda en colonnes ---------- */
  #cal-day-view button { font-family: inherit; }
  .pd-search-wrap { position: relative; margin-bottom: 14px; z-index: 30; }
  .pd-search { display: flex; align-items: center; gap: 10px; background: var(--fill); border-radius: 14px; padding: 0 14px; min-height: 48px; }
  .pd-search:focus-within { box-shadow: inset 0 0 0 2px var(--blue); }
  .pd-search svg { color: var(--grey); flex-shrink: 0; }
  .pd-search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font-family: inherit; font-size: 16px; padding: 12px 0; }
  .pd-results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-width: 640px; background: var(--card); border: 1px solid var(--sep); border-radius: 14px; padding: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.35); max-height: 60vh; overflow-y: auto; }
  .pd-res-group { font-size: 11px; font-weight: 700; color: var(--grey); letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px 4px; }
  .pd-res { width: 100%; display: flex; align-items: center; gap: 10px; border: none; background: transparent; color: var(--ink); border-radius: 10px; padding: 9px 10px; text-align: left; cursor: pointer; }
  .pd-res:hover, .pd-res:focus-visible { background: var(--fill); outline: none; }
  .pd-res-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .pd-res-main { display: flex; flex-direction: column; min-width: 0; }
  .pd-res-name { font-size: 15px; font-weight: 700; }
  .pd-res-meta { font-size: 12.5px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-res-go { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--blue); white-space: nowrap; }
  .pd-res-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--sep); margin-top: 6px; padding: 10px 10px 6px; font-size: 13px; color: var(--grey); }
  .pd-res-foot button { border: none; background: none; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0; }
  .pd-res-empty { padding: 14px 10px; font-size: 14px; color: var(--grey); }

  .pd-glance { background: var(--fill); border-radius: 16px; padding: 14px 16px 10px; margin-bottom: 14px; }
  .pd-glance-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .pd-glance-head strong { font-size: 15px; }
  .pd-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--grey); }
  .pd-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .pd-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .pd-g-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 130px; gap: 12px; align-items: center; width: 100%; border: none; background: transparent; color: var(--ink); padding: 3px 4px; border-radius: 9px; cursor: pointer; text-align: left; }
  .pd-g-row:hover { background: var(--fill-2); }
  .pd-g-row.me .pd-g-name { font-weight: 800; }
  .pd-g-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-width: 0; }
  .pd-g-name span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-av { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; background-size: cover; background-position: center; }
  .pd-g-bar { position: relative; height: 30px; background: var(--card); border-radius: 7px; overflow: hidden; }
  .pd-g-seg { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; box-sizing: border-box; }
  .pd-g-seg.st-done, .pd-g-seg.st-past { opacity: .35; }
  .pd-g-seg.st-absent { background: transparent !important; border: 1px dashed var(--grey); }
  .pd-g-seg.is-next { box-shadow: 0 0 0 2px var(--ink); }
  .pd-g-off { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--grey); }
  .pd-g-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); }
  .pd-g-sum { display: flex; flex-direction: column; min-width: 0; }
  .pd-g-sum b { font-size: 13px; }
  .pd-g-sum small { font-size: 11.5px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-g-day .pd-g-row { grid-template-columns: 30px minmax(0, 1fr) 34px; }
  .pd-g-day .pd-g-name { justify-content: center; }
  .pd-g-day .pd-g-name .pd-av { width: 28px; height: 28px; }
  .pd-g-day .pd-g-row.me .pd-g-name .pd-av { box-shadow: 0 0 0 2px var(--fill), 0 0 0 4px var(--blue); }
  .pd-g-day .pd-g-sum { align-items: center; }
  .pd-g-ic { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--blue-soft, rgba(0,113,227,.14)); color: var(--blue); }
  .pd-g-ic.walk { background: rgba(240,138,36,.16); color: #f08a24; }
  .pd-g-ic.off { opacity: .4; }
  .pd-g-ticks { position: relative; height: 16px; margin: 4px 0 0; }
  .pd-g-ticks span { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--grey); font-variant-numeric: tabular-nums; }

  .pd-body { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
  .pd-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
  .pd-card { background: var(--fill); border-radius: 16px; padding: 14px 16px; }
  .pd-card h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--grey); }
  .pd-next { box-shadow: inset 0 0 0 2px var(--blue); cursor: pointer; border: none; text-align: left; color: var(--ink); width: 100%; }
  .pd-next .pd-next-when { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--blue); }
  .pd-next .pd-next-when span { white-space: nowrap; }
  .pd-next .pd-next-when em { font-style: normal; font-size: 12px; background: var(--blue-soft); color: var(--blue); padding: 3px 8px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; }
  .pd-next .pd-next-name { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .pd-next .pd-next-meta { font-size: 13px; color: var(--grey); margin-top: 2px; }
  .pd-free-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid var(--sep); }
  .pd-free-row b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .pd-free-row small { display: block; font-size: 12px; color: var(--grey); }
  .pd-free-row button { border: none; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 700; padding: 8px 11px; border-radius: 9px; cursor: pointer; }
  .pd-seg2 { display: flex; background: var(--fill-2); border-radius: 10px; padding: 3px; }
  .pd-seg2 button { flex: 1; border: none; background: transparent; color: var(--grey); font-size: 13px; font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer; }
  .pd-seg2 button.on { background: var(--card); color: var(--ink); }
  .pd-add { width: 100%; }
  .pd-cal-tools-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .pd-add-top { padding: 9px 16px; white-space: nowrap; }
  .pd-cal-tools > span:first-child { white-space: nowrap; }
  .pd-cal-tools .pd-seg2 button { white-space: nowrap; }
  @media (max-width: 699px) { .pd-add-top { padding: 8px 12px; font-size: 14px; } .pd-cal-tools-r { gap: 6px; } }

  .pd-cal { background: var(--fill); border-radius: 18px; padding: 10px 12px 12px; min-width: 0; }
  .pd-cal-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .pd-cal-tools .pd-zoom { display: flex; gap: 6px; }
  .pd-zoom-sl { display: inline-flex; align-items: center; gap: 8px; color: var(--grey); background: var(--card); border-radius: 99px; padding: 0 12px; height: 36px; }
  .pd-zoom-sl input[type=range] { width: 110px; accent-color: var(--blue); cursor: pointer; margin: 0; }
  @media (max-width: 699px) { .pd-zoom-sl { padding: 0 10px; gap: 6px; } .pd-zoom-sl input[type=range] { width: 80px; } }
  .pd-cal-tools .pd-zoom button { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--card); color: var(--ink); font-size: 18px; cursor: pointer; }
  .pd-cal-head { display: flex; gap: 8px; padding: 0 0 8px 52px; border-bottom: 1px solid var(--sep); }
  .pd-col-head { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13.5px; font-weight: 700; }
  .pd-col-head span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-cal-scroll { max-height: calc(100vh - 170px); overflow-y: auto; overflow-x: hidden; margin-top: 6px; padding-top: 9px; }
  /* Vue Jour : défilement à droite / à gauche quand il y a beaucoup de coiffeurs */
  .pd-cal-scroll.pd-xs { overflow: auto; padding-top: 0; margin-top: 0; overscroll-behavior-x: contain; }
  .pd-xs-head { position: sticky; top: 0; z-index: 6; background: var(--fill); padding-top: 4px; padding-bottom: 8px; margin-bottom: 10px; }
  .pd-gutter { position: sticky; left: 0; width: 48px; height: 100%; z-index: 5; background: var(--fill); }
  .pd-gutter .pd-hour { left: 0; width: 40px; }
  /* Un trait entre chaque colonne de coiffeur (agenda et en-têtes) */
  .pd-cols .pd-col + .pd-col::before { content: ''; position: absolute; left: -5px; top: -10px; bottom: 0; border-left: 1px solid var(--sep); pointer-events: none; }
  .pd-xs-head .pd-col-head { position: relative; }
  .pd-xs-head .pd-col-head + .pd-col-head::before { content: ''; position: absolute; left: -5px; top: -4px; bottom: -8px; border-left: 1px solid var(--sep); }
  .pd-grid { position: relative; }
  .pd-line { position: absolute; left: 46px; right: 0; border-top: 1px solid var(--sep); }
  .pd-line.half { border-top-style: dashed; opacity: .55; }
  .pd-line.step { border-top-style: dotted; opacity: .35; }
  .pd-hour.minor { font-size: 10px; opacity: .7; font-weight: 400; }
  .pd-hour { position: absolute; left: 0; width: 40px; text-align: right; font-size: 11.5px; color: var(--grey); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
  .pd-cols { position: absolute; left: 52px; right: 0; top: 0; bottom: 0; display: flex; gap: 8px; }
  .pd-col { position: relative; min-width: 0; cursor: pointer; border-radius: 8px; }
  .pd-col.past, .pd-col.closed { cursor: default; }
  .pd-col-off { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 12px; color: var(--grey); padding: 0 6px; }
  .pd-block { position: absolute; left: 0; right: 0; box-sizing: border-box; border: none; border-radius: 9px; padding: 0 10px; display: flex; align-items: center; gap: 7px; overflow: hidden; text-align: left; cursor: pointer; background: var(--c); color: var(--fg, #fff); transition: opacity .15s ease, box-shadow .15s ease; }
  .pd-block .t { font-size: 11.5px; font-weight: 600; opacity: .88; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .pd-block .n { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pd-block .s { font-size: 12px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pd-block .l { margin-left: auto; font-size: 10.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .pd-block.st-done, .pd-block.st-past { opacity: .5; }   /* passé / terminé : garde la couleur du coiffeur, en plus pâle */
  .pd-block.st-done.pd-hit, .pd-block.st-past.pd-hit { opacity: 1; }
  .pd-block.tall { flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; padding-top: 4px; padding-bottom: 4px; }
  .pd-block.tall .n { max-width: 100%; }
  .pd-block.tall .l { position: absolute; right: 8px; top: 6px; }
  .pd-block.tall .t + .n { margin-top: 0; }
  .pd-block.narrow { padding: 0 5px !important; gap: 3px !important; }
  .pd-block.narrow .t { display: none; }
  .pd-block.narrow.tall .t { display: inline; }
  .pd-block.st-absent { background: transparent; color: var(--grey); border: 1px dashed var(--grey); }
  .pd-block.st-absent .n { text-decoration: line-through; }
  .pd-block.st-inprogress .l, .pd-block.is-next .l { background: #fff; color: #111; padding: 2px 7px; border-radius: 99px; }
  .pd-block.is-next { box-shadow: 0 0 0 2px var(--fill), 0 0 0 4px var(--blue); z-index: 2; }
  .pd-block.pd-hit { box-shadow: 0 0 0 2px var(--fill), 0 0 0 4px #ffd60a; z-index: 3; }
  .pd-block.pd-dim { opacity: .4; }
  .pd-col:not(.me) .pd-block { padding: 0 7px; gap: 5px; }
  .pd-col:not(.me) .pd-block .n { font-size: 12px; }
  .pd-free { position: absolute; left: 0; right: 0; box-sizing: border-box; border: 1px dashed var(--sep); background: transparent; color: var(--grey); border-radius: 9px; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; overflow: hidden; }
  .pd-free b { margin-left: auto; color: var(--blue); font-size: 12px; }
  .pd-free:hover { border-color: var(--blue); }
  .pd-free.tall { align-items: flex-start; padding-top: 8px; }
  .pd-break { position: absolute; left: 0; right: 0; box-sizing: border-box; border-radius: 8px; background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(127,127,127,.16) 6px 12px); color: var(--grey); font-size: 11.5px; display: flex; align-items: center; padding: 0 10px; pointer-events: none; }
  .pd-now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--red); z-index: 4; pointer-events: none; }
  .pd-now span { position: absolute; left: 0; top: -10px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
  .pd-empty-day { padding: 28px 10px; text-align: center; color: var(--grey); font-size: 14px; }

  /* Semaine : 7 colonnes */
  .pd-wd { font-size: 13.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
  .pd-wd.today { background: var(--blue); color: #fff; }
  .pd-wk-heads { gap: 6px; }
  .pd-wk-head { flex: 1; flex-direction: column; gap: 0; align-items: center; justify-content: center; border: none; background: transparent; color: var(--ink); border-radius: 10px; padding: 4px 0; cursor: pointer; }
  .pd-wk-head span { font-size: 11.5px; font-weight: 600; color: var(--grey); }
  .pd-wk-head b { font-size: 17px; }
  .pd-wk-head.today { background: var(--blue); color: #fff; }
  .pd-wk-head.today span { color: rgba(255,255,255,.85); }
  .pd-wk-head.past { opacity: .55; }
  .pd-wk-head:hover { background: var(--fill-2); }
  .pd-wk-head.today:hover { background: var(--blue); }
  .pd-wk-cols { gap: 6px; }
  .pd-col.today { background: rgba(127,127,127,.07); }
  .pd-wk-block { padding: 0 6px !important; gap: 4px !important; }
  .pd-wk-block .t { font-size: 10.5px; }
  .pd-wk-block .n { font-size: 11.5px !important; }

  /* Mois : grille de cartes */
  .pd-mstats { display: flex; align-items: stretch; gap: 22px; flex-wrap: wrap; }
  .pd-mstats > div:not(.pd-seg2) { display: flex; flex-direction: column; }
  .pd-mstats b { font-size: 20px; font-weight: 800; }
  .pd-mstats small { font-size: 12px; color: var(--grey); }
  .pd-mhead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
  .pd-mhead span { text-align: center; font-size: 12px; font-weight: 600; color: var(--grey); }
  .pd-mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .pd-mday { min-height: 92px; border: none; background: var(--card); color: var(--ink); border-radius: 12px; padding: 8px 9px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer; min-width: 0; transition: box-shadow .12s ease, opacity .12s ease; }
  .pd-mday:hover { box-shadow: inset 0 0 0 2px var(--fill-2); }
  .pd-mday.empty { background: none !important; box-shadow: none !important; cursor: default; }
  .pd-mday.today { box-shadow: inset 0 0 0 2px var(--blue); }
  .pd-mday.today .pd-mnum { background: var(--blue); color: #fff; }
  .pd-mday.past { opacity: .55; }
  .pd-mday.closed { background: repeating-linear-gradient(135deg, var(--card) 0 8px, var(--fill-2) 8px 16px); }
  .pd-mday.pd-hit { box-shadow: inset 0 0 0 3px #ffd60a; opacity: 1; }
  .pd-mday.pd-dim { opacity: .35; }
  .pd-mnum { font-size: 14px; font-weight: 700; min-width: 26px; height: 26px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box; }
  /* Pastilles en bas de la case (le numéro du jour reste seul en haut) */
  .pd-mchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
  .pd-mchip { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pd-mclosed { font-size: 11.5px; font-weight: 600; color: var(--grey); }

  /* Tablette (portrait) et petits ordinateurs : pas de colonne de cote, le prochain client passe au-dessus */
  @media (max-width: 999px) {
    .pd-body { grid-template-columns: minmax(0, 1fr); }
    .pd-side { position: static; flex-direction: row; flex-wrap: wrap; align-items: stretch; }
    .pd-side > .pd-next { flex: 1 1 260px; }
    .pd-side > .pd-free-card { display: none; }
    .pd-side > .pd-view-card { flex: 1 1 200px; }
    .pd-side > .pd-add { flex: 1 1 200px; width: auto; }
  }
  /* Telephone : frise compacte, une seule colonne (la sienne, ou celle du coiffeur touche dans la frise) */
  @media (max-width: 699px) {
    .pd-g-row { grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
    .pd-g-sum { display: none; }
    .pd-g-day .pd-g-row { grid-template-columns: 24px minmax(0, 1fr) 28px; }
    .pd-g-day .pd-g-sum { display: flex; }
    .pd-g-day .pd-g-name .pd-av { width: 22px; height: 22px; }

    .pd-g-name .pd-av { width: 20px; height: 20px; font-size: 10px; }

    .pd-mday { min-height: 58px; padding: 5px; gap: 2px; border-radius: 9px; }
    .pd-mnum { font-size: 12.5px; min-width: 22px; height: 22px; }

    .pd-cal-scroll { max-height: calc(100vh - 140px); }
  }
</style>
</head>

<script>
mountThemeButton();

var me = null; // { id, name, pin }
var rdvPrepAlertMin = 0;
var timerCfg = null;   // Reglages > Timer (commencer un RDV en avance), lus dans les reglages publics
var queue = [];
var barbers = [];
var extras = [];
var services = [];
var products = [];
// Derniere lecture du catalogue (ms ; 0 = jamais lu). Avant, le catalogue etait garde A VIE une fois charge : un
// ordre (ou un prix, un stock...) change dans l'administration n'apparaissait qu'apres rechargement de la page.
// refresh() tourne toutes les 4 s ; on ne relit donc le catalogue qu'au plus toutes les 15 s, et on reutilise
// les listes en memoire entre deux relectures. DECLAREE ICI, avec les listes : la connexion automatique appelle
// boot() -> refresh() des l'ouverture de la page, avant que le reste du script ait fini de s'executer.
var catalogLoadedAt = 0;
var pinBuffer = '';

var SALON_SLUG = (function () {
  try { return new URLSearchParams(window.location.search).get('salon') || ''; }
  catch (e) { return ''; }
})();

function loadSalonName() {
  var headers = {};
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/settings/public', { headers: headers })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var name = d.salon_name || '';
      CURRENCY = d.currency || 'EUR'; if (d.timezone) SALON_TIMEZONE = d.timezone;
      rdvPrepAlertMin = Number(d.rdv_prep_alert_min) || 0;
      timerCfg = { timer_early_enabled: d.timer_early_enabled, timer_early_min: d.timer_early_min, timer_early_barbers: d.timer_early_barbers || {} };
      applyAccentColor(d.accent_color);
      document.title = name + ' — Mon poste';
      var mark = document.getElementById('salon-mark');
      if (mark) mark.textContent = name.toUpperCase();
      var tag = document.getElementById('salon-name-tag');
      if (tag) tag.textContent = name;
    })
    .catch(function () {});
}
loadSalonName();

/* ---------- API avec authentification par PIN ---------- */
function barberApi(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (me) { headers['X-Barber-Id'] = me.id; headers['X-Barber-Pin'] = me.pin; }
  // RDV pris au nom d'un collègue depuis l'Agenda (comme le sélecteur par bulle de la caisse).
  if (me && opts.actingAs && opts.actingAs !== me.id) headers['X-Acting-As-Barber-Id'] = opts.actingAs;
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  return fetch(path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) throw new Error(data.error || 'Erreur ' + r.status);
      return data;
    });
  });
}

/* ---------- Connexion par code PIN ---------- */
function renderPinDots() {
  var dots = document.querySelectorAll('.pin-dot');
  dots.forEach(function (d, i) { d.classList.toggle('filled', i < pinBuffer.length); });
}

document.getElementById('keypad').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn || btn.classList.contains('empty')) return;
  var k = btn.dataset.k;
  document.getElementById('login-error').textContent = '';

  if (k === 'del') {
    pinBuffer = pinBuffer.slice(0, -1);
    renderPinDots();
    return;
  }
  if (pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderPinDots();
  if (pinBuffer.length === 4) attemptLogin();
});

function attemptLogin() {
  var headers = { 'Content-Type': 'application/json' };
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/barbers/login', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({ pin: pinBuffer, source: 'poste' })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (res) {
      if (!res.ok) {
        document.getElementById('login-error').textContent = res.data.error || 'Code incorrect';
        pinBuffer = '';
        renderPinDots();
        return;
      }
      me = { id: res.data.barber.id, name: res.data.barber.name, pin: pinBuffer, acceptsAppointments: Boolean(res.data.barber.accepts_appointments), timerEnabled: res.data.barber.timer_enabled !== 0 };
      try { sessionStorage.setItem('poste-session', JSON.stringify(me)); } catch (e) {}
      showApp();
    })
    .catch(function () {
      document.getElementById('login-error').textContent = 'Connexion impossible';
      pinBuffer = '';
      renderPinDots();
    });
}

function logout() {
  me = null;
  // Les minuteurs de rafraîchissement automatique (refresh, renderActive)
  // tournaient encore après une déconnexion, plantant en boucle car ils
  // référencent me.id sans vérifier qu'un coiffeur est bien connecté.
  if (refreshIntervalId) { clearInterval(refreshIntervalId); refreshIntervalId = null; }
  if (renderActiveIntervalId) { clearInterval(renderActiveIntervalId); renderActiveIntervalId = null; }
  try { sessionStorage.removeItem('poste-session'); } catch (e) {}
  pinBuffer = '';
  renderPinDots();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('poste-footer').style.display = 'none';
  document.body.classList.remove('has-poste-footer');
}

(function autoLogin() {
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('poste-session') || 'null'); } catch (e) {}
  if (saved && saved.id && saved.pin) { me = saved; showApp(); }
})();

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('my-name').textContent = me.name;
  document.getElementById('poste-footer').style.display = 'flex';
  document.body.classList.add('has-poste-footer');

  // Un coiffeur "Sans RDV" (pas en mode RDV en ligne) n'a pas d'agenda
  // à consulter - on retire les onglets Timer/Agenda du footer, il ne
  // reste que Déconnexion, et son seul écran (le suivi de la file en
  // cours) reste affiché sans bascule inutile.
  var showTabs = me.acceptsAppointments;
  document.getElementById('nav-home').style.display = showTabs ? 'flex' : 'none';
  document.getElementById('nav-agenda').style.display = showTabs ? 'flex' : 'none';

  gotoHome();
  boot();
}

function gotoHome() {
  document.getElementById('p-home').style.display = 'block';
  document.getElementById('p-agenda').style.display = 'none';
  document.getElementById('nav-home').classList.add('on');
  document.getElementById('nav-agenda').classList.remove('on');
}

// Actualisation discrète de l'Agenda (15 s sans toucher l'écran), comme la caisse : jamais avec une fenêtre ouverte.
if (window.AutoRefresh) AutoRefresh.start(function () {
  var ag = document.getElementById('p-agenda');
  if (!ag || ag.style.display === 'none' || !calBooted) return;
  calMonthCache = {}; return loadAgendaPeriod();
}, { idleMs: 15000, busy: function () { return !!document.querySelector('.modal-overlay, .appt-drawer-backdrop.on'); } });

function gotoAgenda() {
  document.getElementById('p-home').style.display = 'none';
  document.getElementById('p-agenda').style.display = 'block';
  document.getElementById('nav-home').classList.remove('on');
  document.getElementById('nav-agenda').classList.add('on');
  // Toujours relu en ouvrant l'Agenda : RDV pris ailleurs, fermetures ajoutées par l'admin...
  calBooted = true; calMonthCache = {}; loadAgendaPeriod();
}

/* ---------- Application ---------- */
var refreshIntervalId = null;
var renderActiveIntervalId = null;

function boot() {
  refresh();
  refreshIntervalId = setInterval(refresh, 4000);
  renderActiveIntervalId = setInterval(renderActive, 1000);
}

function refresh() {
  if (!me) return;
  // "Jamais lu" (0 ou indefini) compte comme "a relire" : sans cela, la 1re lecture pouvait etre sautee a l'ouverture.
  var reloadCatalog = !catalogLoadedAt || Date.now() - catalogLoadedAt > 15000;
  return Promise.all([
    barberApi('/api/queue'),
    barberApi('/api/barbers'),
    reloadCatalog ? barberApi('/api/catalog/extras') : Promise.resolve({ items: extras }),
    reloadCatalog ? barberApi('/api/catalog/services') : Promise.resolve({ items: services }),
    reloadCatalog ? barberApi('/api/catalog/products') : Promise.resolve({ items: products })
  ]).then(function (r) {
    queue = r[0].queue;
    barbers = r[1].items;
    extras = r[2].items;
    services = r[3].items;
    products = r[4].items;
    if (reloadCatalog) catalogLoadedAt = Date.now();   // seulement si la lecture a REUSSI : sinon on reessaie au prochain tour
    renderActive();
    renderNext();
    var meB = (barbers || []).filter(function (b) { return me && b.id === me.id; })[0];
    if (meB) document.getElementById('my-name').innerHTML = esc(me.name) + barberModeTagHtml(meB);
  }).catch(function (e) { toast(e.message, true); });
}

/**
 * Sans Timer, l'ecran qui contient normalement le bouton "Terminer"
 * (#p-home) n'est plus affiche pour ce coiffeur - sans repli, plus
 * aucun moyen de faire passer un client de "en cours" a "termine".
 * Ce mini-panneau, affiche en haut de l'Agenda (le seul autre ecran
 * disponible ici), reprend juste cette action.
 */
function updatePosteNoTimerCard(cur) {
  var box = document.getElementById('poste-no-timer-active');
  if (!box) return;
  var show = Boolean(!me.timerEnabled && cur);
  box.style.display = show ? 'block' : 'none';
  if (!show) return;
  box.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--fill);border-radius:12px;padding:12px 14px;margin-bottom:14px">' +
      '<div><div style="font-weight:600;font-size:14px">' + esc(cur.client_name) + ' — prestation en cours</div>' +
      '<div class="hint" style="margin:2px 0 0">' + esc(svcLabel(cur.service.name, cur.extras)) + '</div></div>' +
      '<button class="btn btn-green" style="flex-shrink:0" onclick="finishMine(\'' + cur.id + '\')">Terminer</button>' +
    '</div>';
}

function myActive() {
  if (!me) return null;
  return queue.find(function (q) { return q.status === 'in_progress' && q.barber_id === me.id; });
}

function cutTimerDisplay(cut) {
  var elapsedSec = Math.max(Math.floor((Date.now() - new Date(cut.start_at).getTime()) / 1000), 0);
  var remainSec = (cut.total_duration_min || 0) * 60 - elapsedSec;
  if (remainSec >= 0) return { text: mmss(remainSec), over: false, label: 'Temps restant' };
  return { text: '+' + formatMinutes(Math.ceil(Math.abs(remainSec) / 60)), over: true, label: 'En retard' };
}

function chipsHtml(q) {
  // « Supplement seul » : pas de puce de prestation, seulement les supplements.
  return '<div class="chips">' + (q.service.name === EXTRAS_ONLY_NAME && q.extras.length ? '' : '<span class="chip main">' + esc(q.service.name) + '</span>') +
    q.extras.map(function (x) { return '<span class="chip">+ ' + esc(x.name) + '</span>'; }).join('') + '</div>';
}

var extrasPickerOpen = false;

function renderActive(force) {
  var cur = myActive();
  updatePosteNoTimerCard(cur);
  var zone = document.getElementById('active-zone');
  if (!cur) {
    zone.innerHTML = '<div class="empty">Aucune coupe en cours</div>';
    return;
  }
  var t = cutTimerDisplay(cur);

  // Si l'utilisateur est en train d'interagir dans cette carte (panneau
  // de suppléments ouvert, note en cours de frappe), on se contente de
  // rafraîchir le minuteur sans reconstruire tout le HTML — sinon les
  // cases cochées et le texte tapé seraient perdus à chaque tick.
  // "force" outrepasse cette protection : utilisé juste après avoir
  // volontairement fermé le panneau, pour que ça se voie tout de suite
  // même si le bouton cliqué garde encore le focus.
  var timerEl = document.getElementById('active-timer-value');
  var subEl = document.getElementById('active-timer-sub');
  var userIsEditing = !force && (extrasPickerOpen ||
    (zone.contains(document.activeElement) && document.activeElement !== document.body));

  if (userIsEditing && timerEl) {
    timerEl.textContent = t.text;
    timerEl.classList.toggle('over', t.over);
    if (subEl) {
      subEl.textContent = t.label + ' · prévu ' + formatMinutes(cur.total_duration_min) + ' · ' + eur(cur.total_price_cents);
      subEl.classList.toggle('over', t.over);
    }
    return;
  }

  var extraIds = cur.extras.map(function (e) { return e.id; });
  var extrasOptions = extras.map(function (e) {
    return '<label class="extra-opt"><input type="checkbox" value="' + e.id + '"' +
      (extraIds.indexOf(e.id) !== -1 ? ' checked' : '') + '> ' + esc(e.name) +
      ' <span class="extra-price">+' + eur(e.price_cents) + '</span></label>';
  }).join('');

  zone.innerHTML =
    '<div class="active-card">' +
      '<div class="name">' + queueSourceIconHtml(cur) + esc(cur.client_name) + '</div>' +
      (cur.is_appointment
        ? '<div class="hint" style="color:var(--blue);margin:-4px 0 6px">Rendez-vous</div>'
        : '') +
      (cur.paid_at ? '<div class="hint" style="color:var(--green);font-weight:600;margin:-2px 0 6px">✓ Déjà payé — un supplément ajouté sera à régler à la fin</div>' : '') +
      chipsHtml(cur) +
      '<div class="big-timer' + (t.over ? ' over' : '') + '" id="active-timer-value">' + t.text + '</div>' +
      '<div class="timer-sub' + (t.over ? ' over' : '') + '" id="active-timer-sub">' + t.label + ' · prévu ' + formatMinutes(cur.total_duration_min) + ' · ' + eur(cur.total_price_cents) + '</div>' +
      (cur.gift_card
        ? '<div class="hint" style="color:var(--green);margin:8px 0">🎁 Cadeau — supplément non modifiable, terminez la coupe telle quelle.</div>'
        : '<button class="btn btn-soft" onclick="toggleExtrasPicker()">Ajouter un supplément</button>' +
          '<div id="extras-picker" style="display:' + (extrasPickerOpen ? 'block' : 'none') + '">' + extrasOptions +
            '<button class="btn btn-primary" onclick="saveExtras(\'' + cur.id + '\')">Valider</button>' +
          '</div>') +
      '<div class="note-block">' +
        '<label for="client-note">Note sur ce client</label>' +
        '<textarea id="client-note" rows="2" placeholder="Ex: préfère dégradé américain, allergie...">' + esc(cur.note || '') + '</textarea>' +
        '<button class="btn btn-soft" onclick="saveNote(\'' + cur.id + '\')">Enregistrer la note</button>' +
      '</div>' +
      '<button class="btn btn-green" onclick="finishMine(\'' + cur.id + '\')">Terminer</button>' +
    '</div>';
}

function toggleExtrasPicker() {
  extrasPickerOpen = !extrasPickerOpen;
  var el = document.getElementById('extras-picker');
  if (el) el.style.display = extrasPickerOpen ? 'block' : 'none';
}

function hasNextWaitingForMe() {
  return queue.some(function (q) {
    return q.status === 'waiting' && canTakeQueueEntry(q, me.id, barbers);
  });
}

function saveExtras(id) {
  var ids = Array.prototype.map.call(
    document.querySelectorAll('#extras-picker input[type="checkbox"]:checked'),
    function (c) { return c.value; }
  );

  var cur = myActive();
  var isAdding = cur && ids.length > cur.extras.length;
  if (isAdding && hasNextWaitingForMe()) {
    extrasPickerOpen = false;
    if (document.activeElement) document.activeElement.blur();
    renderActive(true);
    toast('Un client attend déjà son tour — ajouter un supplément le retarderait.', true);
    return;
  }

  barberApi('/api/queue/' + id, { method: 'PUT', body: { extras: ids } })
    .then(function () {
      extrasPickerOpen = false;
      if (document.activeElement) document.activeElement.blur();
      renderActive(true); // ferme le panneau tout de suite, sans attendre le réseau
      toast('Suppléments mis à jour');
      return refresh(); // données à jour ensuite, en arrière-plan
    })
    .catch(function (e) {
      extrasPickerOpen = false;
      if (document.activeElement) document.activeElement.blur();
      renderActive(true);
      toast(e.message, true);
    });
}

function saveNote(id) {
  var note = document.getElementById('client-note').value;
  barberApi('/api/queue/' + id + '/note', { method: 'PUT', body: { note: note } })
    .then(function () { toast('Note enregistrée'); })
    .catch(function (e) { toast(e.message, true); });
}

var nextDetailOpen = {}; // { [queueId]: true }

function renderNext() {
  var zone = document.getElementById('next-zone');
  if (myActive()) {
    zone.innerHTML = '<div class="empty">Terminez la coupe en cours pour passer à la suivante</div>';
    return;
  }

  // Ne pas reconstruire pendant que l'utilisateur interagit (note en
  // cours de frappe) — sinon le rafraîchissement automatique (toutes
  // les 4s) annulerait la saisie en cours.
  var userIsEditing = zone.contains(document.activeElement) && document.activeElement !== document.body;
  if (userIsEditing && zone.children.length) return;

  var mine = queue.filter(function (q) {
    return q.status === 'waiting' && canTakeQueueEntry(q, me.id, barbers);
  }).sort(function (a, b) { return new Date(a.checkin_at) - new Date(b.checkin_at); });

  if (mine.length === 0) {
    zone.innerHTML = '<div class="empty">Personne en attente pour vous pour le moment</div>';
    return;
  }

  zone.innerHTML = mine.map(function (q, i) {
    var isAppointmentNotYet = Boolean(q.is_appointment) && new Date(q.checkin_at) > new Date();
    // Reglages > Timer : « Commencer » se debloque X min avant l'heure du RDV (reglage du salon ou du coiffeur).
    var startAt = q.is_appointment ? timerStartAllowedAt(q, timerCfg, me && me.id) : 0;
    var tooEarly = isAppointmentNotYet && Date.now() < startAt;
    var noTimerBarber = me.timerEnabled === false;
    var locked = i > 0 || (tooEarly && !noTimerBarber);
    var detail = svcLabel(q.service.name, q.extras);
    var open = Boolean(nextDetailOpen[q.id]);
    var minutesUntil = isAppointmentNotYet ? Math.round((new Date(q.checkin_at) - new Date()) / 60000) : null;
    var prepAlert = isAppointmentNotYet && rdvPrepAlertMin > 0 && minutesUntil <= rdvPrepAlertMin;
    var lockNote = isAppointmentNotYet
      ? (prepAlert ? '⏰ Préparez-vous — RDV dans ' + Math.max(minutesUntil, 0) + ' min' : 'RDV à ' + new Date(q.checkin_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })) +
        (tooEarly && startAt < new Date(q.checkin_at).getTime() ? ' · Commencer dès ' + new Date(startAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : (!tooEarly && !locked ? ' · vous pouvez commencer' : ''))
      : 'En attente de son tour';
    var appointmentBadge = (q.is_appointment && !isAppointmentNotYet)
      ? '<div class="meta" style="color:var(--blue)">RDV ' + new Date(q.checkin_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '</div>'
      : '';
    return '<div class="next-item" data-id="' + q.id + '">' +
      '<div class="next-card' + (locked ? ' locked' : '') + (prepAlert ? ' prep-alert' : '') + '">' +
        '<div class="next-info" onclick="toggleNextDetail(\'' + q.id + '\')">' +
          '<div class="name">' + queueSourceIconHtml(q) + esc(q.client_name) + '</div>' +
          '<div class="meta">' + esc(detail) + '</div>' +
          appointmentBadge +
          (q.paid_at ? '<div class="meta" style="color:var(--green);font-weight:600">✓ Déjà payé</div>' : '') +
          (q.gift_card ? giftBadgeHtml(q.gift_card) : '') +
          ((locked || isAppointmentNotYet) ? '<div class="lock-note' + (prepAlert ? ' prep-alert-note' : '') + '">' + lockNote + '</div>' : '') +
        '</div>' +
        '<div class="next-btns">' +
          (locked ? '' : (
            me.timerEnabled === false
              ? '<button class="btn btn-primary" onclick="quickFinishMine(\'' + q.id + '\')">Je prends</button>'
              : '<button class="btn btn-primary" onclick="startMine(\'' + q.id + '\')">Commencer</button>'
          )) +
          '<button class="btn btn-outline-red" onclick="cancelMine(\'' + q.id + '\')">Absent</button>' +
        '</div>' +
      '</div>' +
      '<div class="next-detail" id="next-detail-' + q.id + '" style="display:' + (open ? 'block' : 'none') + '">' +
        '<div class="detail-row"><span class="detail-label">Client</span><span class="detail-value">' + esc(q.client_name) + '</span></div>' +
        (q.email ? '<div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">' + esc(q.email) + '</span></div>' : '') +
        (q.phone ? '<div class="detail-row"><span class="detail-label">Téléphone</span><span class="detail-value">' + esc(q.phone) + '</span></div>' : '') +
        (q.gift_card ? giftDetailHtml(q.gift_card) : '') +
        '<label>Note sur ce client</label>' +
        '<textarea id="next-note-' + q.id + '" rows="2" placeholder="Ex: préfère dégradé américain, allergie...">' + esc(q.note || '') + '</textarea>' +
        '<button class="btn btn-soft" onclick="saveNextNote(\'' + q.id + '\')">Enregistrer la note</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

/**
 * Petit badge visible directement sur la carte repliée — ne mentionne
 * "produit offert" que si le cadeau contient réellement un produit à
 * remettre en plus de la coupe.
 */
function giftBadgeHtml(gift) {
  var productNames = gift.items
    .filter(function (it) { return it.item_type === 'product'; })
    .map(function (it) { return it.quantity + ' × ' + it.item_name; })
    .join(', ');
  var label = gift.explicit
    ? (productNames ? '🎁 Cadeau — à remettre : ' + esc(productNames) : '🎁 Cadeau')
    : 'ℹ️ Rappel : cadeau non réclamé en attente' + (productNames ? ' (' + esc(productNames) + ')' : '') + ' — sans rapport avec cette venue';
  return '<div class="meta" style="color:' + (gift.explicit ? 'var(--green)' : 'var(--grey)') + '">' + label + '</div>';
}

/**
 * Détail d'un cadeau lié à ce client — notamment les articles qui ne
 * font PAS partie de la coupe (produits, suppléments non choisis au
 * check-in), pour que le coiffeur sache quoi remettre en plus.
 */
function giftDetailHtml(gift) {
  var itemsList = gift.items.map(function (it) { return it.quantity + ' × ' + esc(it.item_name); }).join(', ');
  var title = gift.explicit
    ? '🎁 Cadeau (' + eur(gift.amount_cents) + ')'
    : 'ℹ️ Cadeau non réclamé (sans rapport avec cette venue) — ' + eur(gift.amount_cents);
  return '<div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:4px">' +
    '<span class="detail-label" style="color:' + (gift.explicit ? 'var(--green)' : 'var(--grey)') + '">' + title + '</span>' +
    '<span class="detail-value" style="font-weight:400">' + itemsList + '</span>' +
    '</div>';
}

function toggleNextDetail(id) {
  nextDetailOpen[id] = !nextDetailOpen[id];
  var el = document.getElementById('next-detail-' + id);
  if (el) el.style.display = nextDetailOpen[id] ? 'block' : 'none';
}

function saveNextNote(id) {
  var note = document.getElementById('next-note-' + id).value;
  barberApi('/api/queue/' + id + '/note', { method: 'PUT', body: { note: note } })
    .then(function () { toast('Note enregistrée'); })
    .catch(function (e) { toast(e.message, true); });
}

function cancelMine(id) {
  var q = queue.find(function (x) { return x.id === id; });
  var name = q ? q.client_name : 'ce client';
  // Déjà payé d'avance (seul, ou avec le ticket de son groupe) : l'argent reste encaissé, à rendre à la main.
  var paidAmt = q && q.paid_at && q.total_price_cents ? ' (' + eur(q.total_price_cents) + ')' : '';
  var paidWarn = q && q.paid_at ? ' Attention : il a déjà payé d\'avance' + paidAmt + ' : rendez-lui cet argent (espèces ou terminal), le remboursement n\'est pas automatique.' : '';
  showConfirm('Marquer ' + name + ' comme absent ? Il sera retiré de la file.' + paidWarn, { title: 'Client absent', danger: true, confirmLabel: 'Marquer absent' })
    .then(function (ok) {
      if (!ok) return;
      barberApi('/api/queue/' + id + '/cancel', { method: 'POST', body: {} })
        .then(refresh)
        .then(function () { toast(q && q.paid_at ? name + ' marqué absent — pensez à lui rendre ' + (paidAmt ? paidAmt.slice(2, -1) : 'son paiement') : 'Client marqué absent', !!(q && q.paid_at)); })
        .catch(function (e) { toast(e.message, true); });
    });
}

function quickFinishMine(id) {
  var q = queue.find(function (x) { return x.id === id; });
  barberApi('/api/queue/' + id + '/quick-finish', { method: 'POST', body: { barber_id: me.id } })
    .then(function () {
      toast((q ? q.client_name + ' — ' : '') + 'ajouté à l\'encaissement');
      return refresh();
    })
    .catch(function (e) { toast(e.message, true); });
}

function startMine(id) {
  extrasPickerOpen = false;
  barberApi('/api/queue/' + id + '/start', { method: 'POST', body: { barber_id: me.id } })
    .then(refresh)
    .catch(function (e) { toast(e.message, true); });
}

function finishMine(id) {
  extrasPickerOpen = false;
  var cur = queue.find(function (q) { return q.id === id; });
  barberApi('/api/queue/' + id + '/finish', { method: 'POST', body: {} })
    .then(function () {
      if (cur && cur.gift_card) {
        toast('Coupe terminée — ' + cur.client_name + ' a un cadeau à récupérer, direction la caisse');
      } else {
        toast('Coupe terminée — envoyez le client à la caisse');
      }
      return refresh();
    })
    .catch(function (e) { toast(e.message, true); });
}
/* ---------- Agenda : TOUS les coiffeurs du salon, même planning (timeline) que le tableau de bord ----------
   Chaque coiffeur voit les RDV de ses collègues et peut ajouter un RDV au nom de l'un d'eux (clic sur sa ligne). */
var calAnchor = new Date();
var calViewMode = 'month';
var calMonthCache = {};
var calSelectedDate = null;
var calBooted = false;
var calApptById = {};
var rdvBarberColors = {};   // couleur choisie par l'admin (sinon couleur stable), comme le menu Rendez-vous
var rdvBarberPhotos = {};
var calBarberFilter = null;

function barberColor(bid) { return rdvBarberColors[bid] || stableColorForId(bid); }
function refreshBarberLooks() {
  (barbers || []).forEach(function (b) { rdvBarberColors[b.id] = b.color || stableColorForId(b.id); rdvBarberPhotos[b.id] = b.photo_url || ''; });
}

function applyCalBarberFilter(list) {
  return calBarberFilter ? list.filter(function (a) { return a.barber_id === calBarberFilter; }) : list;
}

function toggleCalBarberFilter(barberId) {
  calBarberFilter = calBarberFilter === barberId ? null : barberId;
  if (calViewMode === 'month') renderCalMonth();
  else if (calViewMode === 'week') renderCalWeek();
  else renderCalDay();
  renderCalendarLegend(neededMonthKeys());
}

function renderCalendarLegend(keys) {
  var seen = {};
  keys.forEach(function (k) {
    (calMonthCache[k] || []).forEach(function (a) {
      if (a.barber_id && a.barber_name && a.status !== 'cancelled') seen[a.barber_id] = a.barber_name;
    });
  });
  var names = Object.keys(seen);
  document.getElementById('cal-legend').innerHTML = names.length === 0
    ? '<span class="hint" style="margin:0">Aucun coiffeur avec un RDV sur cette période</span>'
    : names.map(function (bid) {
        return '<div class="cal-legend-item"><span class="cal-legend-dot" style="background:' + barberColor(bid) + '"></span>' + esc(seen[bid]) + '</div>';
      }).join('');
  renderCalBarberPicker(names, seen);
}

function renderCalBarberPicker(names, seen) {
  var el = document.getElementById('cal-barber-picker');
  if (!el) return;
  el.innerHTML = names.length === 0 ? '' : names.map(function (bid) {
    var isSelected = calBarberFilter === bid;
    var dimmed = calBarberFilter && !isSelected;
    var photoStyle = rdvBarberPhotos[bid] ? 'background:url(&quot;' + esc(rdvBarberPhotos[bid]) + '&quot;) center/cover' : 'background:' + barberColor(bid);
    return '<button class="cal-legend-avatar' + (isSelected ? ' selected' : '') + (dimmed ? ' dimmed' : '') + '" ' +
      'title="' + esc(seen[bid]) + (isSelected ? ' (cliquer pour tout afficher)' : '') + '" ' +
      'onclick="toggleCalBarberFilter(\'' + bid + '\')" style="' + photoStyle + '">' +
      (rdvBarberPhotos[bid] ? '' : esc(seen[bid].charAt(0).toUpperCase())) +
      '</button>';
  }).join('');
}

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfWeek(d) { var day = (d.getDay() + 6) % 7; return addDays(d, -day); }
var monthNames = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

function setCalView(mode) {
  calViewMode = mode;
  ['month', 'week', 'day'].forEach(function (m) { document.getElementById('cal-view-' + m).classList.toggle('on', m === mode); });
  document.getElementById('cal-weekdays').style.display = 'none';   // Mois/Semaine dessinent leur propre en-tête (style vue Jour)
  document.getElementById('cal-days').style.display = mode === 'day' ? 'none' : 'block';
  document.getElementById('cal-day-view').style.display = mode === 'day' ? 'block' : 'none';
  if (mode === 'day') renderCalSide();
  loadAgendaPeriod();
}

function calShiftPeriod(delta) {
  if (calViewMode === 'month') calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + delta, 1);
  else if (calViewMode === 'week') calAnchor = addDays(calAnchor, delta * 7);
  else calAnchor = addDays(calAnchor, delta);
  loadAgendaPeriod();
}

function neededMonthKeys() {
  if (calViewMode !== 'week') return [monthKey(calAnchor)];
  var start = startOfWeek(calAnchor);
  var end = addDays(start, 6);
  var keys = [monthKey(start), monthKey(end)];
  return keys.filter(function (k, i) { return keys.indexOf(k) === i; });
}


var rdvSalonClosures = [];
function rdvIsSalonClosed(dateStr) { return rdvSalonClosures.some(function(c){return dateStr >= c.start_date && dateStr <= c.end_date;}); }
function rdvClosureBanner(dateStr) { return rdvIsSalonClosed(dateStr) ? '<div class="salon-closure-banner">Salon fermé exceptionnellement ce jour</div>' : ''; }
function rdvLoadSalonClosures() {
  return barberApi('/api/salon-calendar/public-closures').then(function(r){rdvSalonClosures=r.items||[];}).catch(function(){rdvSalonClosures=[];});
}

function loadAgendaPeriod() {
  var keys = neededMonthKeys();
  var toFetch = keys.filter(function (k) { return !calMonthCache[k]; });
  Promise.all(toFetch.map(function (k) {
    // caisse_view=1 : les RDV de TOUS les coiffeurs (comme la caisse), pas seulement les siens.
    return barberApi('/api/appointments?month=' + k + '&all=1&caisse_view=1').then(function (r) { calMonthCache[k] = r.items; });
  }).concat([loadRdvSlotStep(), loadSalonScheduleForTimeline(), rdvLoadSalonClosures()])).then(function () {
    refreshBarberLooks();
    if (calViewMode === 'month') renderCalMonth();
    else if (calViewMode === 'week') renderCalWeek();
    else renderCalDay();
    renderCalendarLegend(keys);
  }).catch(function (e) { toast(e.message, true); });
}

function apptsForRange(startDate, endDate) {
  var startStr = ymd(startDate), endStr = ymd(endDate);
  var all = [];
  neededMonthKeys().forEach(function (k) { all = all.concat(calMonthCache[k] || []); });
  return applyCalBarberFilter(all.filter(function (a) {
    var d = a.scheduled_at.slice(0, 10);
    return d >= startStr && d <= endStr && a.status !== 'cancelled';
  }));
}

/** Un point par coiffeur ayant au moins un RDV ce jour-là (couleur de sa bulle), comme dans la caisse. */
function calDayDotsHtml(dayAppts) {
  var seen = {}, dots = [];
  dayAppts.forEach(function (a) {
    var bid = a.barber_id || 'unassigned';
    if (seen[bid]) return;
    seen[bid] = true;
    dots.push('<span class="cal-dot" style="background:' + (bid === 'unassigned' ? 'var(--grey)' : barberColor(bid)) + '"></span>');
  });
  return dots.length ? '<div class="cal-dots">' + dots.join('') + '</div>' : '';
}

function renderCalMonth() {
  // Vue Mois au style de la vue Jour : recherche client + grille de cartes (nombre de RDV, couleurs des coiffeurs).
  // Toucher un jour ouvre sa vue Jour (planning complet : colonnes, créneaux libres, fiche...).
  document.getElementById('cal-month-label').textContent = monthNames[calAnchor.getMonth()] + ' ' + calAnchor.getFullYear();
  document.getElementById('cal-day-view').innerHTML = '';
  document.getElementById('cal-weekdays').style.display = 'none';   // la grille dessine son propre en-tête
  document.getElementById('cal-days').innerHTML = pdMonthHtml();
  renderCalSide();
  if (pdQuery) pdRunSearch(true);
}

// Grand ecran (tablette en paysage, 1000 px et plus) : le planning du jour s'affiche a droite du calendrier au lieu
// de s'inserer sous la semaine. Telephone et tablette en portrait : inchange (planning sous la semaine).
function posteSplit() { return !!(window.matchMedia && window.matchMedia('(min-width: 1000px)').matches); }
function renderCalSide() {
  // Les vues Mois / Semaine / Jour prennent maintenant toute la largeur (style vue Jour) : plus de panneau de côté.
  // Toucher un jour (Mois) ouvre sa vue Jour, qui contient tout le planning.
  var side = document.getElementById('cal-side'); if (!side) return;
  side.style.display = 'none'; side.innerHTML = '';
}
(function () {
  var was = null, t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t); t = setTimeout(function () {
      var now = posteSplit(); if (now === was) return; was = now;
      if (typeof calViewMode === 'undefined') return;
      if (calViewMode === 'month') renderCalMonth(); else if (calViewMode === 'week') renderCalWeek();
    }, 150);
  });
})();

function renderCalExpandPanel(dateStr) {
  var when = new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' });
  var expandAgain = window.__calExpandDate === dateStr; window.__calExpandDate = dateStr;
  return '<div class="cal-expand-panel' + (expandAgain ? ' no-anim' : '') + '">' +
    '<div class="cal-expand-head"><strong style="text-transform:capitalize">' + when + '</strong>' +
    '<button class="btn btn-soft" onclick="event.stopPropagation();selectCalDay(null)">Fermer</button></div>' +
    posteAddBtnHtml(dateStr) +
    renderAgendaTimeline(dateStr) +
    '</div>';
}

function posteAddBtnHtml(dateStr) {
  if (rdvIsSalonClosed(dateStr)) {
    return '<div class="salon-closure-banner" style="text-align:center">Salon fermé — aucun rendez-vous ne peut être ajouté ce jour.</div>';
  }
  if (isPastDay(dateStr)) return '';   // jour passé : on consulte, on n'ajoute plus
  return '<button class="btn btn-primary" style="width:100%;margin-bottom:6px" onclick="event.stopPropagation();openPosteAddAppointment(\'' + dateStr + '\')">+ Ajouter un RDV</button>' +
    '<p class="hint" style="margin:0 0 12px;text-align:center;font-size:12.5px;color:var(--grey)">Pour un collègue : touchez sa ligne dans le planning.</p>';
}

function renderCalWeek() {
  // Vue Semaine au style de la vue Jour : recherche, coup d'œil des 7 jours, agenda en 7 colonnes.
  var start = startOfWeek(calAnchor);
  var end = addDays(start, 6);
  document.getElementById('cal-month-label').textContent =
    start.getDate() + ' ' + monthNames[start.getMonth()] + ' – ' + end.getDate() + ' ' + monthNames[end.getMonth()] + ' ' + end.getFullYear();
  var wk = ymd(start);
  var prev = document.querySelector('#cal-days .pd-cal-scroll');
  var keepTop = prev && pdScrolledFor === 'w' + wk ? prev.scrollTop : null;
  var hadFocus = document.activeElement && document.activeElement.id === 'pd-search';
  document.getElementById('cal-day-view').innerHTML = '';
  document.getElementById('cal-weekdays').style.display = 'none';
  document.getElementById('cal-days').innerHTML = pdWeekHtml(start);
  var sc = document.querySelector('#cal-days .pd-cal-scroll');
  if (sc) {
    if (keepTop !== null) sc.scrollTop = keepTop;
    else { var g = sc.querySelector('.pd-grid'); sc.scrollTop = Math.max(0, (Number(g && g.getAttribute('data-focus-top')) || 0) - 60 * pdPx); pdScrolledFor = 'w' + wk; }
  }
  if (hadFocus) { var inp = document.getElementById('pd-search'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
  renderCalSide();
  if (pdQuery) pdRunSearch(true);
}

function renderCalDay() {
  document.getElementById('cal-month-label').textContent =
    calAnchor.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  // Vue « Jour » (proposition C) : recherche client + coup d'œil de l'équipe + agenda en colonnes.
  // Les vues Mois et Semaine (et leur planning du jour choisi) gardent renderAgendaTimeline.
  var dateStr = ymd(calAnchor);
  var view = document.getElementById('cal-day-view');
  var hadFocus = document.activeElement && document.activeElement.id === 'pd-search';
  var prevScroll = view.querySelector('.pd-cal-scroll');
  var keepTop = prevScroll && pdScrolledFor === dateStr ? prevScroll.scrollTop : null;
  document.getElementById('cal-days').innerHTML = '';   // un seul champ de recherche dans la page
  view.innerHTML = posteDayHtml(dateStr);
  var sc = view.querySelector('.pd-cal-scroll');
  if (sc) {
    if (keepTop !== null) sc.scrollTop = keepTop;
    else {
      // 1re ouverture de ce jour : aujourd'hui -> une heure avant maintenant ; autre jour -> le 1er RDV.
      var g = sc.querySelector('.pd-grid');
      var target = Number(g && g.getAttribute('data-focus-top')) || 0;
      sc.scrollTop = Math.max(0, target - 60 * pdPx);
      pdScrolledFor = dateStr;
    }
  }
  if (hadFocus) { var inp = document.getElementById('pd-search'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
  if (pdQuery) pdRunSearch(true);
}

/** Plage horaire commune (heures du salon sur ces jours + RDV + mes horaires). */
function pdRangeFor(dates, items) {
  var lo = [], hi = [];
  dates.forEach(function (d) {
    var sd = salonScheduleByWeekday && salonScheduleByWeekday[new Date(d + 'T00:00:00').getDay()];
    if (sd) { lo.push(sd.startMin); hi.push(sd.endMin); }
  });
  items.forEach(function (it) { lo.push(it.start); hi.push(it.end); });
  if (!lo.length) { lo.push(9 * 60); hi.push(19 * 60); }
  var r0 = Math.floor(Math.min.apply(null, lo) / 60) * 60, r1 = Math.ceil(Math.max.apply(null, hi) / 60) * 60;
  if (r1 - r0 < 4 * 60) r1 = r0 + 4 * 60;
  return [r0, r1];
}
