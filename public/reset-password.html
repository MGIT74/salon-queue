<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe</title>
<link rel="stylesheet" href="/app.css">
<style>
  .wrap { max-width: 400px; margin: 0 auto; padding: clamp(20px,3vw,44px); }
  .head { text-align: center; margin: 14vh 0 30px; }
  .head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.03em; margin: 0; }
  .head p { color: var(--grey); font-size: 14.5px; margin: 8px 0 0; }
  .card-box { background: var(--card); border-radius: 18px; padding: 26px; box-shadow: var(--shadow); }
  .success-msg { text-align: center; color: var(--grey); font-size: 14.5px; line-height: 1.6; }
  .back-link { text-align: center; margin-top: 18px; font-size: 14px; }
  .back-link a { color: var(--blue); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Nouveau mot de passe</h1>
  </div>

  <div class="card-box" id="form-card">
    <div class="fld"><label for="f-pw">Nouveau mot de passe</label>
      <input id="f-pw" type="password" placeholder="6 caractères minimum" autocomplete="new-password"></div>
    <div class="fld"><label for="f-pw2">Confirmer</label>
      <input id="f-pw2" type="password" autocomplete="new-password"></div>
    <button class="btn btn-primary" id="submit-btn" style="width:100%;padding:15px;font-size:16px" onclick="doSubmit()">Valider</button>
  </div>

  <div class="card-box" id="success-card" style="display:none">
    <p class="success-msg">Mot de passe mis à jour. Vous pouvez maintenant vous connecter.</p>
    <a class="btn btn-primary" href="/dashboard.html" style="display:block;text-align:center;margin-top:16px;padding:15px;font-size:16px;text-decoration:none">Aller à la connexion</a>
  </div>

  <div class="back-link"><a href="/dashboard.html">Retour à la connexion</a></div>
</div>

<script src="/app.js"></script>
<script>
mountThemeButton();

var token = new URLSearchParams(window.location.search).get('token') || '';
if (!token) {
  document.getElementById('form-card').innerHTML =
    '<p class="success-msg">Lien invalide. Refaites une demande depuis <a href="/forgot-password.html">mot de passe oublié</a>.</p>';
}

function doSubmit() {
  var pw = document.getElementById('f-pw').value;
  var pw2 = document.getElementById('f-pw2').value;
  if (!pw) { toast('Mot de passe requis', true); return; }
  if (pw !== pw2) { toast('Les mots de passe ne correspondent pas', true); return; }
  if (pw.length < 6) { toast('6 caractères minimum', true); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Validation…';

  fetch('/api/signup/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, password: pw })
  }).then(function (r) {
    return r.json().then(function (d) {
      if (!r.ok) throw new Error(d.error || 'Erreur');
      return d;
    });
  }).then(function () {
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  }).catch(function (e) {
    toast(e.message, true);
    btn.disabled = false; btn.textContent = 'Valider';
  });
}
</script>
</body>
</html>
