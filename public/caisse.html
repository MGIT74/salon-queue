<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caisse</title>
<script>
  (function () {
    try {
      var saved = JSON.parse(sessionStorage.getItem('caisse-session') || 'null');
      if (saved && saved.id && saved.pin) document.documentElement.classList.add('auth-checking');
    } catch (e) {}
  })();
</script>
<style>
  html.auth-checking #login-screen { display: none; }
</style>
<link rel="stylesheet" href="/app.css?v=4">
<style>
  html, body { min-height: 100%; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 18px 40px; }

  /* --- Écran de connexion (identique à Mon poste) --- */
  .login { text-align: center; padding-top: 12vh; }
  .login .mark { font-size: 15px; font-weight: 600; color: var(--grey); margin-bottom: 6px; }
  .login h1 { font-size: 28px; font-weight: 600; letter-spacing: -.03em; margin: 0 0 36px; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--sep); transition: background .1s ease, border-color .1s ease; }
  .pin-dot.filled { background: var(--blue); border-color: var(--blue); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto; }
  .keypad button {
    aspect-ratio: 1; border: none; border-radius: 50%; background: var(--fill);
    color: var(--ink); font-size: 24px; font-weight: 500; font-family: inherit; cursor: pointer;
  }
  .keypad button:active { background: var(--fill-2); }
  .keypad .empty { visibility: hidden; }
  .keypad .del { font-size: 18px; color: var(--grey); }
  .login-error { color: var(--red); font-size: 14px; margin-top: 18px; min-height: 20px; }

  /* --- Écran principal --- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .topbar h1 { font-size: 22px; font-weight: 600; letter-spacing: -.03em; margin: 0; }
  .logout-btn { background: none; border: none; color: var(--grey); font-family: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; }

  .caisse-layout {
    display: grid; gap: 18px; align-items: start;
    grid-template-columns: 1fr 340px;
    grid-template-areas: "grid ticket" "pending ticket" ". drawer";
  }
  .caisse-grid-col { grid-area: grid; }
  .ticket-panel { grid-area: ticket; }
  .pending-section { grid-area: pending; }
  .drawer-section { grid-area: drawer; }
  @media (max-width: 860px) {
    .caisse-layout {
      grid-template-columns: 1fr;
      grid-template-areas: "grid" "ticket" "pending" "drawer";
    }
  }

  .cat-tabs { display: flex; gap: 6px; background: var(--fill); border-radius: 999px; padding: 4px; margin-bottom: 16px; overflow-x: auto; }
  .cat-tabs button {
    flex: 1 0 auto; border: none; background: none; color: var(--ink); font-family: inherit;
    font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .cat-tabs button.on { background: var(--card); font-weight: 600; box-shadow: var(--shadow); }

  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .item-btn {
    background: var(--card); border: none; border-radius: 14px; padding: 16px 14px; box-shadow: var(--shadow);
    cursor: pointer; text-align: left; font-family: inherit; color: var(--ink); transition: transform .1s ease;
  }
  .item-btn:active { transform: scale(.96); }
  .item-btn .name { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .item-btn .price { font-size: 13px; color: var(--grey); }
  .item-btn .icon { font-size: 24px; margin-bottom: 6px; display: block; }
  .item-btn.has-photo { padding: 0; overflow: hidden; position: relative; min-height: 96px; }
  .item-btn.has-photo .photo-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .item-btn.has-photo .overlay {
    position: relative; z-index: 1; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px; box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.1) 65%, transparent);
  }
  .item-btn.has-photo .name, .item-btn.has-photo .price { color: #fff; }
  .item-btn.has-photo .price { color: rgba(255,255,255,.85); }

  .ticket-panel {
    background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
    position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  }
  .ticket-panel h3 { font-size: 15px; margin: 0 0 12px; }
  .ticket-lines { flex: 1; overflow-y: auto; margin-bottom: 14px; min-height: 60px; }
  .ticket-line { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--sep); }
  .ticket-line:last-child { border-bottom: none; }
  .ticket-line .name { flex: 1; min-width: 0; font-size: 13.5px; }
  .ticket-line .qty-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ticket-line .qty-ctrl button {
    width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--fill);
    color: var(--ink); font-size: 13px; cursor: pointer; line-height: 1;
  }
  .ticket-line .qty-val { font-size: 13px; min-width: 14px; text-align: center; }
  .ticket-line .line-price { font-size: 13.5px; font-weight: 600; flex-shrink: 0; min-width: 52px; text-align: right; }
  .ticket-total { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 2px solid var(--sep); margin-bottom: 14px; }
  .ticket-total .label { font-size: 14px; color: var(--grey); }
  .ticket-total .amount { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pay-grid button {
    border: none; border-radius: 18px; font-family: inherit; font-size: 17px;
    font-weight: 700; cursor: pointer; background: var(--fill); color: var(--ink);
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    min-height: 84px;
  }
  .pay-grid button:disabled { opacity: .4; cursor: default; }
  .pay-grid button:active { transform: scale(.96); }
  .clear-ticket-btn { background: none; border: none; color: var(--red); font-family: inherit; font-size: 13px; cursor: pointer; margin-top: 10px; width: 100%; text-align: center; }

  .drawer-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: var(--card); border: none; border-radius: 18px;
    padding: 18px; box-shadow: var(--shadow); color: var(--ink); font-family: inherit;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .drawer-btn:active { transform: scale(.97); }
  .drawer-btn svg { flex-shrink: 0; opacity: .8; }

  .empty { background: var(--card); border-radius: 16px; padding: 30px 20px; text-align: center; color: var(--grey); font-size: 14px; box-shadow: var(--shadow); }

  .pending-list { margin-bottom: 18px; }
  .pending-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
    box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s ease;
  }
  .pending-card.locked { opacity: .55; cursor: default; }
  .pending-card .name { font-size: 14.5px; font-weight: 600; }
  .pending-card .meta { font-size: 12.5px; color: var(--grey); margin-top: 2px; }
  .pending-card .amount { font-size: 15px; font-weight: 600; flex-shrink: 0; }
  .pending-card .lock-note { font-size: 11.5px; color: var(--orange); margin-top: 2px; }
  .pending-card.deferred { opacity: .7; }
  .pending-card.deferred .lock-note { color: var(--grey); }
  .pending-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .pending-actions .btn { padding: 8px 12px; font-size: 12.5px; white-space: nowrap; }

  /* --- Reçu imprimable --- */
  .receipt-overlay {
    display: none; position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.5);
    align-items: center; justify-content: center; padding: 20px;
  }
  .receipt-overlay.on { display: flex; }
  .receipt-box { background: #fff; color: #111; border-radius: 14px; padding: 26px; max-width: 340px; width: 100%; font-family: 'Courier New', monospace; }
  .receipt-box h2 { font-size: 16px; text-align: center; margin: 0 0 4px; }
  .receipt-box .sub { text-align: center; font-size: 12px; color: #666; margin-bottom: 16px; }
  .receipt-box .rline { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .receipt-box .rtotal { border-top: 1px dashed #999; margin-top: 8px; padding-top: 8px; font-weight: 700; font-size: 14px; }
  .receipt-actions { display: flex; gap: 8px; margin-top: 18px; }
  .receipt-actions .btn { flex: 1; }

  /* --- Paiement TPE en cours --- */
  .tpe-overlay {
    display: none; position: fixed; inset: 0; z-index: 410; background: rgba(0,0,0,.55);
    align-items: center; justify-content: center; padding: 20px;
  }
  .tpe-overlay.on { display: flex; }
  .tpe-box { background: var(--card); border-radius: 16px; padding: 32px 28px; max-width: 320px; width: 100%; text-align: center; }
  .tpe-spinner {
    width: 48px; height: 48px; margin: 0 auto 18px; border-radius: 50%;
    border: 4px solid var(--fill); border-top-color: var(--blue); animation: tpe-spin 0.8s linear infinite;
  }
  @keyframes tpe-spin { to { transform: rotate(360deg); } }
  .tpe-box .amount { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .tpe-box .msg { font-size: 14px; color: var(--grey); }
  .tpe-box .icon-result { font-size: 40px; margin-bottom: 10px; }
  .tpe-box.fail .amount { color: var(--red); }

  @media print {
    @page { size: 80mm auto; margin: 0; }
    body * { visibility: hidden; }
    .receipt-box, .receipt-box * { visibility: visible; }
    .receipt-box {
      position: fixed; top: 0; left: 0; width: 80mm; max-width: none;
      box-shadow: none; border-radius: 0; padding: 4mm; font-size: 12px;
    }
    .receipt-actions { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="login" id="login-screen">
    <div class="login-card" id="login-card-normal">
      <div class="mark" id="salon-mark">LE SALON</div>
      <h1>Caisse</h1>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="empty"></button><button data-k="0">0</button><button class="del" data-k="del">⌫</button>
      </div>
      <div class="login-error" id="login-error"></div>
    </div>
    <div class="login-card" id="login-card-locked" style="display:none">
      <div style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--grey)">
          <rect x="5" y="11" width="14" height="10" rx="2.5"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h1 style="margin-bottom:10px">Caisse fermée</h1>
      <p style="color:var(--grey);font-size:15px;line-height:1.5" id="locked-reopen-text">Réouverture demain matin.</p>
      <button class="btn btn-ghost" style="margin-top:18px;font-size:13px" onclick="forceOpenCaisse()">Forcer l'ouverture maintenant (admin)</button>

        <h1 id="my-name">—</h1>
      </div>

    <div class="caisse-layout">
      <div class="caisse-grid-col">
        <div class="cat-tabs" id="cat-tabs">
          <button class="on" data-cat="services">Prestations</button>
          <button data-cat="extras">Suppléments</button>
          <button data-cat="products">Produits</button>

      <div class="pending-section">
        <div class="section-label" id="pending-label" style="display:none;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin:22px 0 10px 2px">En attente d'encaissement</div>

      <div class="ticket-panel">

        <div id="loyalty-section" style="display:none;margin-bottom:14px">

          <div style="display:flex;gap:8px">
            <button class="btn btn-soft" id="loyalty-btn-service" onclick="toggleLoyaltyDiscount('service')" style="flex:1;font-size:12.5px">-50% prestation</button>
            <button class="btn btn-soft" id="loyalty-btn-product" onclick="toggleLoyaltyDiscount('product')" style="flex:1;font-size:12.5px">-20% produit</button>

    <div class="amount" id="tpe-amount"></div>
    <div class="msg" id="tpe-msg">Présentez la carte sur le terminal…</div>
    <div class="receipt-actions" id="tpe-actions" style="display:none">
      <button class="btn btn-soft" onclick="cancelTpePayment()">Annuler</button>
      <button class="btn btn-primary" onclick="retryTpePayment()">Réessayer</button>
    </div>
  </div>

<script src="/app.js?v=5"></script>
<script>
mountThemeButton();

var me = null;
var catalog = { services: [], extras: [], products: [] };
var ticket = []; // { item_type, item_id, item_name, unit_price_cents, quantity }
var ticketQueueId = null; // coupe d'origine si le ticket vient d'un encaissement en attente
var loyaltyRewardsAvailable = 0; // récompenses dispo pour le client du ticket en cours
var loyaltyDiscount = null; // { index, originalPrice, type } si une réduction fidélité est appliquée
var marketingSettings = { loyalty_service_discount_pct: 50, loyalty_product_discount_pct: 20 };
var pendingPayments = [];
var currentCat = 'services';

var SALON_SLUG = (function () {
  try { return new URLSearchParams(window.location.search).get('salon') || ''; }
  catch (e) { return ''; }
})();

function loadSalonName() {
  var headers = {};
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/settings/public', { headers: headers })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var name = d.salon_name || 'Le Salon';
      CURRENCY = d.currency || 'EUR';
      applyAccentColor(d.accent_color);
      document.title = name + ' — Caisse';
      var mark = document.getElementById('salon-mark');
      if (mark) mark.textContent = name.toUpperCase();
      var tag = document.getElementById('salon-name-tag');
      if (tag) tag.textContent = name;
    })
    .catch(function () {});
}
loadSalonName();

function barberApi(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (me) { headers['X-Barber-Id'] = me.id; headers['X-Barber-Pin'] = me.pin; }
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  return fetch(path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) throw new Error(data.error || 'Erreur ' + r.status);
      return data;
    });
  });
}

/* ---------- Connexion par code PIN (identique à Mon poste) ---------- */
var pinBuffer = '';

function renderPinDots() {
  var dots = document.querySelectorAll('.pin-dot');
  dots.forEach(function (d, i) { d.classList.toggle('filled', i < pinBuffer.length); });
}

document.getElementById('keypad').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn || btn.classList.contains('empty')) return;
  var k = btn.dataset.k;
  document.getElementById('login-error').textContent = '';

  if (k === 'del') {
    pinBuffer = pinBuffer.slice(0, -1);
    renderPinDots();
    return;
  }
  if (pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderPinDots();
  if (pinBuffer.length === 4) attemptLogin();
});

function attemptLogin() {
  var headers = { 'Content-Type': 'application/json' };
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/barbers/login', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({ pin: pinBuffer })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (res) {
      if (!res.ok) {
        document.getElementById('login-error').textContent = res.data.error || 'Code incorrect';
        pinBuffer = '';
        renderPinDots();
        return;
      }
      me = { id: res.data.barber.id, name: res.data.barber.name, pin: pinBuffer };
      try { sessionStorage.setItem('caisse-session', JSON.stringify(me)); } catch (e) {}
      showApp();
    })
    .catch(function () {
      document.getElementById('login-error').textContent = 'Connexion impossible';
      pinBuffer = '';
      renderPinDots();
    });
}

function logout() {
  me = null;
  try { sessionStorage.removeItem('caisse-session'); } catch (e) {}
  pinBuffer = '';
  clearTimeout(inactivityTimer);
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  renderPinDots();
}

// Deconnexion automatique apres 15s d'inactivite - utilise exactement
// le meme mecanisme que le bouton "Deconnexion" (pas de mode "flou en
// arriere-plan" : ca garantit qu'un autre coiffeur peut toujours se
// reconnecter normalement juste apres, sans aucun etat residuel).
var inactivityTimer = null;
var INACTIVITY_LIMIT_MS = 15000;

function resetInactivityTimer() {
  if (!me) return;
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(logout, INACTIVITY_LIMIT_MS);
}

['click', 'touchstart', 'keydown'].forEach(function (evt) {
  document.addEventListener(evt, function () { resetInactivityTimer(); }, { passive: true });
});

var pendingPaymentsInterval = null;

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('my-name').textContent = me.name;
  loadCatalog();
  loadPendingPayments();
  loadMarketingSettings();
  loadInactivitySetting();
  clearInterval(pendingPaymentsInterval);
  pendingPaymentsInterval = setInterval(loadPendingPayments, 5000);
  resetInactivityTimer();
}

function loadInactivitySetting() {
  var headers = {};
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/settings/public', { headers: headers })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var seconds = Number(d.caisse_inactivity_seconds) || 15;
      INACTIVITY_LIMIT_MS = seconds * 1000;
      resetInactivityTimer();
    })
    .catch(function () {});
}

function loadMarketingSettings() {
  barberApi('/api/owner/marketing-settings').then(function (r) {
    marketingSettings = r.settings;
  }).catch(function () {});
}

function forceOpenCaisse() {
  var pw = window.prompt('Mot de passe admin :');
  if (!pw) return;
  var headers = { 'Content-Type': 'application/json', 'X-Admin-Password': pw };
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;
  fetch('/api/settings/caisse/force-open', { method: 'POST', headers: headers })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Erreur'); return d; }); })
    .then(function () { window.location.reload(); })
    .catch(function (e) { window.alert(e.message); });
}

(function autoLogin() {
  var headers = {};
  if (SALON_SLUG) headers['X-Salon-Slug'] = SALON_SLUG;

  fetch('/api/settings/public', { headers: headers })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.caisse_locked_until) {
        document.documentElement.classList.remove('auth-checking');
        var when = new Date(d.caisse_locked_until).toLocaleString('fr-FR', {
          weekday: 'long', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
        document.getElementById('locked-reopen-text').textContent = 'Réouverture prévue le ' + when + '.';
        document.getElementById('login-card-normal').style.display = 'none';
        document.getElementById('login-card-locked').style.display = 'block';
        return;
      }

      var saved = null;
      try { saved = JSON.parse(sessionStorage.getItem('caisse-session') || 'null'); } catch (e) {}
      if (saved && saved.id && saved.pin) {
        me = saved;
        showApp();
      }
    })
    .catch(function () { document.documentElement.classList.remove('auth-checking'); });
})();

/* ---------- Catalogue ---------- */
function loadCatalog() {
  Promise.all([
    barberApi('/api/catalog/services'),
    barberApi('/api/catalog/extras'),
    barberApi('/api/catalog/products')
  ]).then(function (r) {
    catalog.services = r[0].items;
    catalog.extras = r[1].items;
    catalog.products = r[2].items;
    renderItemGrid();
  }).catch(function (e) { toast(e.message, true); });
}

document.getElementById('cat-tabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  currentCat = btn.dataset.cat;
  document.querySelectorAll('#cat-tabs button').forEach(function (b) { b.classList.toggle('on', b === btn); });
  renderItemGrid();
});

/**
 * Coupes terminées par ce coiffeur, pas encore encaissées. Seule la
 * plus ancienne (premier arrivé, premier encaissé) est cliquable — les
 * autres restent visibles mais verrouillées, même principe que "À
 * suivre" dans Mon poste.
 */
function loadPendingPayments() {
  barberApi('/api/queue/pending-payment').then(function (r) {
    pendingPayments = r.items;
    renderPendingList();
  }).catch(function () {});
}

function renderPendingList() {
  var label = document.getElementById('pending-label');
  var list = document.getElementById('pending-list');
  if (!pendingPayments.length) {
    label.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  label.style.display = 'block';

  // Le premier client NON mis de côté est le seul "actif" (encaissable
  // tout de suite) — les suivants restent verrouillés jusqu'à ce qu'il
  // soit réglé OU mis de côté à son tour.
  var firstActiveIndex = pendingPayments.findIndex(function (q) { return !q.deferred; });

  list.innerHTML = pendingPayments.map(function (q, i) {
    var detail = q.service.name + (q.extras.length ? ' + ' + q.extras.map(function (x) { return x.name; }).join(', ') : '');

    if (q.deferred) {
      return '<div class="pending-card deferred">' +
        '<div><div class="name">' + esc(q.client_name) + '</div>' +
        '<div class="meta">' + esc(detail) + '</div>' +
        '<div class="lock-note">Mis de côté</div></div>' +
        '<div class="pending-actions">' +
          '<span class="amount">' + eur(q.total_price_cents) + '</span>' +
          '<button class="btn btn-soft" onclick="event.stopPropagation();toggleDeferPayment(\'' + q.id + '\')">Reprendre</button>' +
        '</div></div>';
    }

    var isActive = i === firstActiveIndex;
    var giftNote = '';
    if (q.gift_card) {
      var giftItemsList = (q.gift_card.items || []).map(function (it) {
        return (it.quantity > 1 ? it.quantity + ' × ' : '') + it.item_name;
      }).join(', ');
      giftNote = '<div class="lock-note" style="color:var(--green)">🎁 Cadeau disponible</div>' +
        (giftItemsList ? '<div class="meta" style="color:var(--green)">' + esc(giftItemsList) + '</div>' : '');
    }
    var loyaltyNote = q.loyalty_rewards_available
      ? '<div class="lock-note" style="color:var(--blue)">⭐ Fidélité disponible</div>'
      : '';
    var displayAmount = q.gift_card ? q.gift_card.amount_cents : q.total_price_cents;
    return '<div class="pending-card' + (isActive ? '' : ' locked') + '"' +
      (isActive && !q.gift_card ? ' onclick="usePendingForTicket(\'' + q.id + '\')"' : '') + '>' +
      '<div><div class="name">' + esc(q.client_name) + '</div>' +
      '<div class="meta">' + esc(detail) + '</div>' +
      (isActive ? giftNote + loyaltyNote : '<div class="lock-note">En attente de son tour</div>') + '</div>' +
      '<div class="pending-actions">' +
        '<span class="amount">' + eur(displayAmount) + '</span>' +
        (isActive && q.gift_card
          ? '<button class="btn btn-primary" onclick="event.stopPropagation();useGiftCard(\'' + q.gift_card.id + '\',\'' + q.id + '\')">Utiliser le cadeau</button>'
          : '') +
        (isActive && !q.loyalty_member
          ? '<button class="btn btn-ghost" onclick="event.stopPropagation();proposeLoyaltyActivation(\'' + q.id + '\')">Proposer la fidélité</button>'
          : '') +
        (isActive ? '<button class="btn btn-ghost" onclick="event.stopPropagation();toggleDeferPayment(\'' + q.id + '\')">Mettre de côté</button>' : '') +
      '</div></div>';
  }).join('');
}

/**
 * L'activation n'est jamais automatique : le coiffeur doit avoir
 * l'accord explicite du client avant de l'activer. Un email est requis
 * pour la confirmation — pré-rempli s'il est déjà connu depuis le
 * check-in, sinon demandé à l'instant.
 */
function proposeLoyaltyActivation(queueId) {
  var q = pendingPayments.find(function (x) { return x.id === queueId; });
  if (!q) return;

  var proceed = function (email) {
    if (!email) return;
    barberApi('/api/owner/loyalty-accounts/activate', {
      method: 'POST',
      body: { client_name: q.client_name, client_email: email, client_phone: q.phone || '' }
    }).then(function () {
      toast('Carte de fidélité activée pour ' + q.client_name);
      loadPendingPayments();
    }).catch(function (e) { toast(e.message, true); });
  };

  if (q.email) {
    showConfirm('Activer la carte de fidélité pour ' + q.client_name + ' (' + q.email + ') ?', { title: 'Fidélité' })
      .then(function (ok) { if (ok) proceed(q.email); });
  } else {
    showPrompt('Quel est l\'email de ' + q.client_name + ' pour activer sa carte de fidélité ?', { title: 'Fidélité', placeholder: 'email@exemple.com' })
      .then(function (email) { if (email) proceed(email.trim()); });
  }
}

function useGiftCard(giftId, queueId) {
  var q = pendingPayments.find(function (x) { return x.id === queueId; });
  var gift = q && q.gift_card;
  var items = (gift && gift.items) || [];

  var itemsList = items.map(function (it) {
    return it.quantity + ' × ' + it.item_name;
  }).join(', ');
  var message = items.length
    ? 'Ce cadeau (' + eur(gift.amount_cents) + ') comprend : ' + itemsList + '. ' +
      'Pensez à remettre au client tout ce qui n\'est pas la coupe déjà effectuée (produits, suppléments...).'
    : 'Confirmer l\'utilisation de ce cadeau ?';

  showConfirm(message, { title: 'Utiliser le cadeau' }).then(function (ok) {
    if (!ok) return;
    barberApi('/api/sales/gift-cards/' + giftId + '/redeem', { method: 'POST', body: { queue_id: queueId } })
      .then(function () {
        toast('Cadeau utilisé — client réglé');
        loadPendingPayments();
      })
      .catch(function (e) { toast(e.message, true); });
  });
}

function toggleDeferPayment(queueId) {
  barberApi('/api/queue/' + queueId + '/defer-payment', { method: 'POST', body: {} })
    .then(function (r) {
      toast(r.deferred ? 'Client mis de côté' : 'Client repris');
      loadPendingPayments();
    })
    .catch(function (e) { toast(e.message, true); });
}

function usePendingForTicket(queueId) {
  var q = pendingPayments.find(function (x) { return x.id === queueId; });
  if (!q) return;

  ticket = [{ item_type: 'service', item_id: q.service.id, item_name: q.service.name, unit_price_cents: q.service.price_cents, quantity: 1 }];
  q.extras.forEach(function (e) {
    ticket.push({ item_type: 'extra', item_id: e.id, item_name: e.name, unit_price_cents: e.price_cents, quantity: 1 });
  });
  ticketQueueId = queueId;
  loyaltyRewardsAvailable = q.loyalty_rewards_available || 0;
  loyaltyDiscount = null;
  renderTicket();
  toast('Ticket de ' + q.client_name + ' chargé — choisissez le paiement');
}

// Icône par défaut selon des mots-clés dans le nom (même mapping que
// le kiosk), utilisée quand aucune photo personnalisée n'est définie.
function iconForItem(name) {
  var n = (name || '').toLowerCase();
  if (n.indexOf('enfant') !== -1) return '🧒';
  if (n.indexOf('barbe') !== -1) return '🧔';
  if (n.indexOf('shampoo') !== -1 || n.indexOf('shampooing') !== -1) return '🧴';
  if (n.indexOf('couleur') !== -1 || n.indexOf('colorat') !== -1) return '🎨';
  if (n.indexOf('serviette') !== -1 || n.indexOf('chaude') !== -1) return '🔥';
  if (n.indexOf('contour') !== -1 || n.indexOf('traçage') !== -1 || n.indexOf('tracage') !== -1) return '📏';
  if (n.indexOf('dégradé') !== -1 || n.indexOf('degrade') !== -1 || n.indexOf('américain') !== -1) return '💈';
  if (n.indexOf('huile') !== -1 || n.indexOf('soin') !== -1) return '💧';
  if (n.indexOf('cire') !== -1 || n.indexOf('gel') !== -1) return '🧴';
  if (n.indexOf('zéro') !== -1 || n.indexOf('zero') !== -1) return '🪒';
  if (n.indexOf('coupe') !== -1) return '✂️';
  return currentCat === 'products' ? '🛍️' : '✂️';
}

function renderItemGrid() {
  var items = catalog[currentCat] || [];
  var typeSingular = currentCat === 'services' ? 'service' : (currentCat === 'extras' ? 'extra' : 'product');
  document.getElementById('item-grid').innerHTML = items.length === 0
    ? '<div class="empty">Rien à afficher ici</div>'
    : items.map(function (it) {
        var onclickAttr = 'addToTicket(\'' + typeSingular + '\',\'' + it.id + '\',\'' + esc(it.name).replace(/'/g, "\\'") + '\',' + it.price_cents + ')';
        if (it.image_url) {
          return '<button class="item-btn has-photo" onclick="' + onclickAttr + '">' +
            '<span class="photo-bg" style="background-image:url(&quot;' + esc(it.image_url) + '&quot;)"></span>' +
            '<span class="overlay">' +
              '<span class="name">' + esc(it.name) + '</span>' +
              '<span class="price">' + eur(it.price_cents) + '</span>' +
            '</span></button>';
        }
        return '<button class="item-btn" onclick="' + onclickAttr + '">' +
          '<span class="icon">' + iconForItem(it.name) + '</span>' +
          '<div class="name">' + esc(it.name) + '</div>' +
          '<div class="price">' + eur(it.price_cents) + '</div>' +
          '</button>';
      }).join('');
}

/* ---------- Ticket ---------- */
function addToTicket(itemType, itemId, itemName, unitPriceCents) {
  var existing = ticket.find(function (l) { return l.item_type === itemType && l.item_id === itemId; });
  if (existing) { existing.quantity++; } else {
    ticket.push({ item_type: itemType, item_id: itemId, item_name: itemName, unit_price_cents: unitPriceCents, quantity: 1 });
  }
  renderTicket();
}

function changeQty(index, delta) {
  ticket[index].quantity += delta;
  if (ticket[index].quantity <= 0) ticket.splice(index, 1);
  if (!ticket.length) ticketQueueId = null;
  renderTicket();
}

function clearTicket() {
  if (!ticket.length) return;
  showConfirm('Vider le ticket en cours ?', { title: 'Vider le ticket', danger: true }).then(function (ok) {
    if (!ok) return;
    ticket = [];
    ticketQueueId = null;
    renderTicket();
  });
}

function ticketTotal() {
  return ticket.reduce(function (a, l) { return a + l.unit_price_cents * l.quantity; }, 0);
}

function renderTicket() {
  document.getElementById('ticket-lines').innerHTML = ticket.length === 0
    ? '<div class="empty">Aucun article sélectionné</div>'
    : ticket.map(function (l, i) {
        return '<div class="ticket-line">' +
          '<div class="name">' + esc(l.item_name) + '</div>' +
          '<div class="qty-ctrl">' +
            '<button onclick="changeQty(' + i + ',-1)">−</button>' +
            '<span class="qty-val">' + l.quantity + '</span>' +
            '<button onclick="changeQty(' + i + ',1)">+</button>' +
          '</div>' +
          '<div class="line-price">' + eur(l.unit_price_cents * l.quantity) + '</div>' +
          '</div>';
      }).join('');

  var total = ticketTotal();
  document.getElementById('ticket-total').textContent = eur(total);
  ['especes', 'cb'].forEach(function (m) {
    document.getElementById('pay-' + m).disabled = ticket.length === 0;
  });
  updateGiftVisibility();
  updateLoyaltyVisibility();
}

/* ---------- Paiement ---------- */
// La fidélité ne peut s'appliquer que sur un ticket venant de "En
// attente d'encaissement" (client identifié) — jamais sur un ticket
// construit à la main sans identité de client connue.
function updateLoyaltyVisibility() {
  var section = document.getElementById('loyalty-section');
  var show = ticket.length > 0 && ticketQueueId && loyaltyRewardsAvailable > 0;
  section.style.display = show ? 'block' : 'none';
  if (show) {
    var hasService = ticket.some(function (l) { return l.item_type === 'service'; });
    var hasProduct = ticket.some(function (l) { return l.item_type === 'product'; });
    document.getElementById('loyalty-btn-service').disabled = !hasService && !(loyaltyDiscount && loyaltyDiscount.type === 'service');
    document.getElementById('loyalty-btn-product').disabled = !hasProduct && !(loyaltyDiscount && loyaltyDiscount.type === 'product');
    document.getElementById('loyalty-btn-service').classList.toggle('btn-primary', loyaltyDiscount && loyaltyDiscount.type === 'service');
    document.getElementById('loyalty-btn-product').classList.toggle('btn-primary', loyaltyDiscount && loyaltyDiscount.type === 'product');
    document.getElementById('loyalty-btn-service').textContent = '-' + marketingSettings.loyalty_service_discount_pct + '% prestation';
    document.getElementById('loyalty-btn-product').textContent = '-' + marketingSettings.loyalty_product_discount_pct + '% produit';
  }
}

function toggleLoyaltyDiscount(type) {
  // Retire d'abord une réduction déjà appliquée (même type = on annule,
  // autre type = on change d'avis).
  if (loyaltyDiscount) {
    ticket[loyaltyDiscount.index].unit_price_cents = loyaltyDiscount.originalPrice;
    ticket[loyaltyDiscount.index].item_name = loyaltyDiscount.originalName;
    var wasType = loyaltyDiscount.type;
    loyaltyDiscount = null;
    if (wasType === type) { renderTicket(); return; }
  }

  var idx = ticket.findIndex(function (l) { return l.item_type === type; });
  if (idx === -1) { toast('Aucune ligne ' + (type === 'service' ? 'prestation' : 'produit') + ' dans ce ticket', true); renderTicket(); return; }

  var pct = type === 'service' ? marketingSettings.loyalty_service_discount_pct : marketingSettings.loyalty_product_discount_pct;
  var factor = 1 - (pct / 100);
  var originalPrice = ticket[idx].unit_price_cents;
  var originalName = ticket[idx].item_name;
  loyaltyDiscount = { index: idx, originalPrice: originalPrice, originalName: originalName, type: type };
  ticket[idx].unit_price_cents = Math.round(originalPrice * factor);
  ticket[idx].item_name = originalName + ' (fidélité -' + pct + '%)';
  renderTicket();
}

function toggleGiftFields() {
  var checked = document.getElementById('gift-checkbox').checked;
  document.getElementById('gift-fields').style.display = checked ? 'block' : 'none';
}

// La case "cadeau" n'a de sens que pour un ticket construit à la main
// (jamais pour un encaissement qui vient de "En attente d'encaissement" —
// ce client est déjà en train de se faire servir, ce n'est pas un
// cadeau à l'avance pour quelqu'un d'autre).
function updateGiftVisibility() {
  var section = document.getElementById('gift-section');
  var show = ticket.length > 0 && !ticketQueueId;
  section.style.display = show ? 'block' : 'none';
  if (!show) {
    document.getElementById('gift-checkbox').checked = false;
    document.getElementById('gift-fields').style.display = 'none';
  }
}

function pay(method) {
  if (!ticket.length) return;

  var gift = null;
  if (document.getElementById('gift-checkbox').checked) {
    var gName = document.getElementById('gift-name').value.trim();
    var gPhone = document.getElementById('gift-phone').value.trim();
    var gEmail = document.getElementById('gift-email').value.trim();
    if (!gName || !gPhone || !gEmail) {
      toast('Nom, téléphone et email du bénéficiaire sont requis pour un cadeau', true);
      return;
    }
    gift = { recipient_name: gName, recipient_phone: gPhone, recipient_email: gEmail };
  }

  var total = ticketTotal();
  var soldTicket = ticket.slice();
  var linkedQueueId = ticketQueueId;
  var usedLoyalty = Boolean(loyaltyDiscount);
  var saleCtx = { method: method, total: total, soldTicket: soldTicket, linkedQueueId: linkedQueueId, gift: gift, usedLoyalty: usedLoyalty };

  if (method === 'cb') {
    startTpePayment(saleCtx);
    return;
  }

  finalizeSale(saleCtx);
}

// Contexte de la vente en cours d'encaissement carte, gardé de côté pour
// permettre un "Réessayer" sans reconstruire le ticket (le panier a déjà
// été vidé visuellement à ce stade — non, en fait il ne l'est plus tant
// que le paiement TPE n'a pas réussi, voir finalizeSale).
var tpePendingSaleCtx = null;

function startTpePayment(saleCtx) {
  tpePendingSaleCtx = saleCtx;
  var box = document.getElementById('tpe-box');
  box.classList.remove('fail');
  document.getElementById('tpe-spinner').style.display = 'block';
  document.getElementById('tpe-amount').textContent = eur(saleCtx.total);
  document.getElementById('tpe-msg').textContent = 'Présentez la carte sur le terminal…';
  document.getElementById('tpe-actions').style.display = 'none';
  document.getElementById('tpe-overlay').classList.add('on');

  barberApi('/api/tpe/charge', { method: 'POST', body: { amount_cents: saleCtx.total } })
    .then(function (r) {
      if (r.success) {
        document.getElementById('tpe-overlay').classList.remove('on');
        finalizeSale(saleCtx);
      } else {
        showTpeFailure('Paiement refusé par le terminal.');
      }
    })
    .catch(function (e) { showTpeFailure(e.message); });
}

function showTpeFailure(message) {
  var box = document.getElementById('tpe-box');
  box.classList.add('fail');
  document.getElementById('tpe-spinner').style.display = 'none';
  document.getElementById('tpe-amount').textContent = 'Échec du paiement';
  document.getElementById('tpe-msg').textContent = message;
  document.getElementById('tpe-actions').style.display = 'flex';
}

function cancelTpePayment() {
  tpePendingSaleCtx = null;
  document.getElementById('tpe-overlay').classList.remove('on');
}

function retryTpePayment() {
  if (!tpePendingSaleCtx) return;
  startTpePayment(tpePendingSaleCtx);
}

function finalizeSale(saleCtx) {
  barberApi('/api/sales', {
    method: 'POST',
    body: {
      payment_method: saleCtx.method, items: saleCtx.soldTicket, queue_id: saleCtx.linkedQueueId,
      gift: saleCtx.gift, loyalty_redeem: saleCtx.usedLoyalty
    }
  }).then(function () {
    tpePendingSaleCtx = null;
    showReceipt(saleCtx.soldTicket, saleCtx.total, saleCtx.method);
    // Paiement en espèces : impression automatique du ticket, ce qui
    // déclenche aussi l'ouverture du tiroir-caisse si l'imprimante est
    // configurée pour ça (réglage côté pilote Windows). Pas fait pour la
    // carte : pas besoin d'ouvrir le tiroir, on laisse le choix
    // d'imprimer ou non via le bouton du reçu.
    if (saleCtx.method === 'especes') {
      setTimeout(function () { window.print(); }, 150);
    }
    ticket = [];
    ticketQueueId = null;
    loyaltyRewardsAvailable = 0;
    loyaltyDiscount = null;
    document.getElementById('gift-checkbox').checked = false;
    document.getElementById('gift-name').value = '';
    document.getElementById('gift-phone').value = '';
    document.getElementById('gift-email').value = '';
    renderTicket();
    loadPendingPayments();
  }).catch(function (e) { toast(e.message, true); });
}

var PAYMENT_LABELS = { especes: 'Espèces', cb: 'Carte bancaire' };

function showReceipt(lines, total, method) {
  var when = new Date().toLocaleString('fr-FR');
  var html = '<h2>' + esc(document.title.replace(' — Caisse', '')) + '</h2>' +
    '<div class="sub">' + when + ' · ' + esc(me.name) + '</div>' +
    lines.map(function (l) {
      return '<div class="rline"><span>' + l.quantity + ' × ' + esc(l.item_name) + '</span><span>' + eur(l.unit_price_cents * l.quantity) + '</span></div>';
    }).join('') +
    '<div class="rline rtotal"><span>Total (' + esc(PAYMENT_LABELS[method] || method) + ')</span><span>' + eur(total) + '</span></div>' +
    '<div class="receipt-actions">' +
      '<button class="btn btn-soft" onclick="closeReceipt()">Fermer</button>' +
      '<button class="btn btn-primary" onclick="window.print()">Imprimer</button>' +
    '</div>';
  document.getElementById('receipt-box').innerHTML = html;
  document.getElementById('receipt-overlay').classList.add('on');
}

function closeReceipt() {
  document.getElementById('receipt-overlay').classList.remove('on');
}

// Ouvre le tiroir-caisse sans passer par une vente (pour rendre la
// monnaie, déposer/retirer de l'argent, etc). Techniquement, on ne peut
// pas envoyer l'ordre d'ouverture directement à l'imprimante depuis une
// page web - on déclenche donc une impression minimale, qui ouvre le
// tiroir si l'imprimante est configurée pour ça (réglage du pilote), au
// prix d'un tout petit bout de papier qui avance.
function openCashDrawer() {
  toast('Ouverture du tiroir…');
  document.getElementById('receipt-box').innerHTML = '<div style="height:1mm"></div>';
  document.getElementById('receipt-overlay').classList.add('on');
  setTimeout(function () {
    window.print();
    setTimeout(closeReceipt, 300);
  }, 50);
}
</script>
