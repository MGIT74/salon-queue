<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié</title>
<link rel="stylesheet" href="/app.css">
<style>
  .wrap { max-width: 400px; margin: 0 auto; padding: clamp(20px,3vw,44px); }
  .head { text-align: center; margin: 14vh 0 30px; }
  .head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.03em; margin: 0; }
  .head p { color: var(--grey); font-size: 14.5px; margin: 8px 0 0; }
  .card-box { background: var(--card); border-radius: 18px; padding: 26px; box-shadow: var(--shadow); }
  .success-msg { text-align: center; color: var(--grey); font-size: 14.5px; line-height: 1.6; }
  .back-link { text-align: center; margin-top: 18px; font-size: 14px; }
  .back-link a { color: var(--blue); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Mot de passe oublié</h1>
    <p>Recevez un lien pour en choisir un nouveau.</p>
  </div>

  <div class="card-box" id="form-card">
    <div class="fld"><label for="f-email">Email de votre compte</label>
      <input id="f-email" type="email" placeholder="vous@exemple.com" autocomplete="email"></div>
    <button class="btn btn-primary" id="submit-btn" style="width:100%;padding:15px;font-size:16px" onclick="doSubmit()">Envoyer le lien</button>
  </div>

  <div class="card-box" id="success-card" style="display:none">
    <p class="success-msg" id="success-text"></p>
  </div>

  <div class="back-link"><a href="/dashboard.html">Retour à la connexion</a></div>
</div>

<script src="/app.js"></script>
<script>
mountThemeButton();

function doSubmit() {
  var email = document.getElementById('f-email').value.trim();
  if (!email) { toast('Adresse email requise', true); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Envoi…';

  fetch('/api/signup/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, base_url: window.location.origin })
  }).then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';
      document.getElementById('success-text').textContent = d.message || 'Si un compte existe avec cet email, un lien vient de lui être envoyé.';
    })
    .catch(function () {
      toast('Une erreur est survenue, réessayez.', true);
      btn.disabled = false; btn.textContent = 'Envoyer le lien';
    });
}
</script>
</body>
</html>
