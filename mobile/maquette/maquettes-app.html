<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBO mobile — Maquettes de toutes les pages</title>
<style>
/* =====================================================================
   MAQUETTES DE TOUTES LES PAGES — app mobile TBO
   Même système que design-dashboard.html / docs/DESIGN.md.
   Couleurs = tokens EXACTS de public/app.css. Données = exemples fictifs.
   ===================================================================== */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif}
.light{--bg:#eef0f2;--card:#fff;--ink:#1d1d1f;--grey:#66666b;--sep:#bcbdc6;--fill:#e4e5eb;--fill2:#d6d7df;--blue:#0062c4;--blueSoft:#e3eefb;--green:#1e7e34;--red:#c4001b;--orange:#b35a00;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--hair:rgba(0,0,0,.07);--greenSoft:#e4f3e8;--redSoft:#fbe5e8;--orangeSoft:#fbefe3;--segOn:#fff;
  --glass:rgba(255,255,255,.55);--glassB:rgba(255,255,255,.7);--glassS:0 8px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.8);--tabOn:rgba(0,98,196,.10)}
.dark{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--grey:#98989d;--sep:#38383a;--fill:#2c2c2e;--fill2:#3a3a3c;--blue:#0a84ff;--blueSoft:#0a2540;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;
  --shadow:none;--hair:rgba(255,255,255,.07);--greenSoft:#0f2e19;--redSoft:#3a1210;--orangeSoft:#3a2508;--segOn:#636366;
  --glass:rgba(44,44,46,.55);--glassB:rgba(255,255,255,.12);--glassS:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);--tabOn:rgba(255,255,255,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#d9dbe0;color:#1d1d1f;-webkit-font-smoothing:antialiased}
body.dk{background:#121214;color:#f5f5f7}

/* ---------- Page de présentation ---------- */
.head{position:sticky;top:0;z-index:50;background:rgba(217,219,224,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.08);padding:14px 24px}
body.dk .head{background:rgba(18,18,20,.85);border-color:rgba(255,255,255,.08)}
.head-in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.head h1{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-right:auto}
.nav{display:flex;gap:4px;background:rgba(0,0,0,.06);border-radius:10px;padding:3px;flex-wrap:wrap}
body.dk .nav{background:rgba(255,255,255,.08)}
.nav a{font-size:14px;font-weight:600;padding:7px 14px;border-radius:8px;color:inherit;text-decoration:none;opacity:.7;cursor:pointer}
.nav a.on{background:#fff;opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.dk .nav a.on{background:#636366}
.theme-btn{font:600 14px var(--font);border:none;border-radius:10px;padding:9px 14px;background:#1d1d1f;color:#fff;cursor:pointer}
body.dk .theme-btn{background:#f5f5f7;color:#1d1d1f}
main{max-width:1500px;margin:0 auto;padding:26px 24px 80px}
.group-intro{font-size:15px;opacity:.75;margin:0 0 22px;max-width:900px;line-height:1.5}
.screens{display:flex;flex-wrap:wrap;gap:34px 30px}
.shot{width:390px}
.cap{font-size:14px;font-weight:700;margin:0 0 4px}
.cap-sub{font-size:12.5px;opacity:.7;margin:0 0 10px;line-height:1.4;min-height:35px}
.page{display:none}.page.on{display:block}

/* ---------- Téléphone ---------- */
.phone{width:390px;height:844px;border-radius:54px;background:#0d0d0d;padding:12px;box-shadow:0 26px 50px rgba(0,0,0,.22)}
.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--ink);position:relative;display:flex;flex-direction:column;font-size:16px}
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 6px;font-size:15px;font-weight:600}
.status .r{display:flex;gap:6px;align-items:center}
.bat{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:4px;position:relative;opacity:.9}
.bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1.5px}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.nobar{padding-bottom:30px}
.home-ind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:9}

/* En-têtes */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px 10px}
.salon-btn{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:7px 10px 7px 8px;box-shadow:var(--shadow);font-size:15px;font-weight:600;white-space:nowrap}
.salon-ic{width:26px;height:26px;border-radius:8px;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center}
.nav-bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px;min-height:40px}
.nav-bar .back{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px}
.nav-bar .t{font-size:17px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%)}
.nav-bar .act{color:var(--blue);font-size:17px;font-weight:600}
.round-btn{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--blue)}
.title{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.15;margin-top:4px}
.title em{font-style:normal;color:var(--blue)}
.subtitle{color:var(--grey);font-size:15px;margin-top:2px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}

/* Blocs */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.sec h2{font-size:20px;font-weight:700;letter-spacing:-.4px}
.sec a{font-size:15px;color:var(--blue);font-weight:500}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:22px}
.card.flush{padding:4px 0}
.card-h{font-size:13px;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.card.flush .card-h{padding:10px 16px 2px;margin:0}
.foot{font-size:13px;color:var(--grey);margin:-14px 16px 22px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
.tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.tile .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--grey);margin-top:3px}
.tile.sm{padding:11px 12px}.tile.sm .v{font-size:20px}.tile.sm .l{font-size:12px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}

/* Lignes */
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;min-height:44px}
.row+.row:before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;height:1px;background:var(--hair)}
.row .grow{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n.r{font-weight:400}
.row .m{font-size:13px;color:var(--grey);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:16px;color:var(--grey);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .a{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--sep);font-size:20px;line-height:1;margin-left:2px}
.row .ric{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.time{width:50px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:11px;color:var(--grey);font-weight:500}

/* Éléments */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;flex:none}
.av.lg{width:64px;height:64px;font-size:22px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--ink);white-space:nowrap;display:inline-block}
.chip.blue{background:var(--blueSoft);color:var(--blue)}.chip.green{background:var(--greenSoft);color:var(--green)}
.chip.orange{background:var(--orangeSoft);color:var(--orange)}.chip.red{background:var(--redSoft);color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.chips .chip{font-size:14px;padding:7px 13px;background:var(--card);box-shadow:var(--shadow)}
.chips .chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin-bottom:16px}
.seg span{flex:1;text-align:center;font-size:14px;font-weight:600;padding:7px 0;border-radius:8px;opacity:.75;white-space:nowrap}
.seg span.on{background:var(--segOn);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-bottom:12px}
.btn.sec2{background:var(--blueSoft);color:var(--blue)}
.btn.grey{background:var(--fill);color:var(--ink)}
.btn.red{background:var(--redSoft);color:var(--red)}
.btn.green{background:var(--green)}
.btn.sm{height:38px;font-size:14.5px;border-radius:11px;padding:0 12px;margin:0;white-space:nowrap}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:9px 12px;color:var(--grey);font-size:16px;margin-bottom:14px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--grey);margin:0 4px 6px}
.input{background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px}
.input.ph{color:var(--grey)}
.row .lab{font-size:16px;flex:1;min-width:0}
.row .val{color:var(--grey);font-size:16px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.tog{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog.on{background:#34c759}.tog.on:after{left:22px}
.check{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--sep);flex:none;display:grid;place-items:center}
.check.on{background:var(--blue);border-color:var(--blue)}
.check.on:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.track{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue)}
.note{font-size:13px;color:var(--grey);line-height:1.45}
.pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{background:var(--fill);border-radius:12px;padding:10px 12px}.pill b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.pill span{font-size:12.5px;color:var(--grey)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.warn svg{flex:none;margin-top:1px}
.warn{background:var(--orangeSoft);color:var(--orange);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.info{background:var(--blueSoft);color:var(--blue);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-bottom:16px;line-height:1.4}

/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.week div{text-align:center;padding:6px 0;border-radius:12px;font-size:12px;color:var(--grey);font-weight:600}
.week div b{display:block;font-size:17px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.week div.on{background:var(--blue);color:rgba(255,255,255,.8)}.week div.on b{color:#fff}
.week div i{display:block;width:5px;height:5px;border-radius:50%;background:var(--blue);margin:3px auto 0}
.week div.on i{background:#fff}
.slot{border-radius:12px;padding:9px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--c,var(--blue)) 15%,var(--card));display:flex;align-items:center;gap:10px}
.dark .slot{background:color-mix(in srgb,var(--c,var(--blue)) 28%,var(--card))}
.slot .tx{flex:1;min-width:0}
.slot .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot .m{font-size:12.5px;color:var(--grey);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.past{background:transparent;box-shadow:none;border:1px solid var(--hair)}.slot.past .n{color:var(--grey);font-weight:500}
.slot .av{width:26px;height:26px;font-size:10.5px}
.tl{display:flex;gap:10px}.tl .h{width:40px;font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums;padding-top:9px;flex:none}
.tl .c{flex:1}
.free{border:1.5px dashed var(--sep);border-radius:10px;padding:8px 10px;margin-bottom:8px;color:var(--grey);font-size:13px}
.now-line{display:flex;align-items:center;gap:6px;margin:2px 0 8px 50px;color:var(--red);font-size:11px;font-weight:700}
.now-line:after{content:"";flex:1;height:2px;background:var(--red);border-radius:1px}

/* Caisse */
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.prod{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.prod .n{font-size:15px;font-weight:600;line-height:1.25}.prod .p{font-size:15px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.prod .m{font-size:12px;color:var(--grey)}
.prod.on{outline:2px solid var(--blue)}
.ticket{position:absolute;left:12px;right:12px;bottom:96px;background:var(--card);border-radius:20px;box-shadow:0 -4px 24px rgba(0,0,0,.12);padding:14px 16px;z-index:4}
.dark .ticket{box-shadow:0 -4px 24px rgba(0,0,0,.6);border:1px solid var(--sep)}
.ticket .tl2{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ticket .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--hair);margin-top:6px;padding-top:8px}
.ticket .tot b{font-size:26px;font-variant-numeric:tabular-nums}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.amounts span{background:var(--card);box-shadow:var(--shadow);border-radius:12px;text-align:center;padding:14px 0;font-size:17px;font-weight:700}
.amounts span.on{background:var(--blue);color:#fff}
.hscroll{display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;grid-auto-columns:150px;gap:10px;overflow-x:auto;margin:0 -16px 18px;padding:2px 16px 6px;scrollbar-width:none}
.camera{height:210px;border-radius:18px;background:linear-gradient(135deg,#2a2d33,#14161a);position:relative;margin-bottom:16px;overflow:hidden}
.camera .frame{position:absolute;inset:50px 60px;border:3px solid rgba(255,255,255,.9);border-radius:14px}
.camera .laser{position:absolute;left:68px;right:68px;top:104px;height:2px;background:#ff453a;box-shadow:0 0 10px #ff453a}
.camera .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.85}

/* Fidélité / cadeau */
.loy{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0062c4,#5e5ce6);margin-bottom:12px;position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.loy .i{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:700;font-size:15px;font-style:italic;font-family:Georgia,serif}
.stamps{display:flex;gap:6px;flex-wrap:wrap}
.stamps i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.stamps i.f{background:#fff}
.gift{border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#ff9f0a,#ff375f);margin-bottom:12px}

/* Barre d'onglets flottante (verre) */
.tabbar{position:absolute;left:14px;right:14px;bottom:22px;height:64px;display:flex;align-items:center;padding:0 6px;border-radius:32px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:.5px solid var(--glassB);box-shadow:var(--glassS);z-index:6}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--ink);opacity:.72;border-radius:26px;white-space:nowrap}
.tab.on{color:var(--blue);opacity:1;background:var(--tabOn)}
.tab.dg{color:var(--red);opacity:1}
.tab svg{width:23px;height:23px}
/* Feuille modale */
.sheet-dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;top:60px;background:var(--bg);border-radius:14px 14px 0 0;z-index:8;display:flex;flex-direction:column;overflow:hidden}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:7px auto 0}
</style>
</head>
<body>
<div class="head"><div class="head-in">
  <h1>TBO mobile — maquettes de toutes les pages</h1>
  <div class="nav" id="nav"></div>
  <a href="maquettes-tablette.html" style="font-size:14px;font-weight:600;color:#0062c4;text-decoration:none">Tablette ›</a>
  <a href="design-dashboard.html" style="font-size:14px;font-weight:600;color:#0062c4;text-decoration:none">Dashboard ›</a>
  <button class="theme-btn" id="themeBtn">Mode sombre</button>
</div></div>
<main id="main"></main>

<script>
/* =================== Kit (mêmes composants que src/components/ui.tsx) =================== */
var IC = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',
  more:'<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  plus:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',

function ic(n, s, c){ return '<svg width="'+(s||18)+'" height="'+(s||18)+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>'; }
var COL = {KA:'#5e5ce6', ML:'#ff9f0a', YS:'#30b0c7', SB:'#34c759', TR:'#ff375f'};
function av(i, lg){ return '<span class="av'+(lg?' lg':'')+'" style="background:'+(COL[i]||'#0a84ff')+'">'+i+'</span>'; }
function tone(t){ return {blue:['var(--blueSoft)','var(--blue)'],green:['var(--greenSoft)','var(--green)'],orange:['var(--orangeSoft)','var(--orange)'],red:['var(--redSoft)','var(--red)'],grey:['var(--fill)','var(--grey)']}[t||'blue']; }
function badgeIc(n,t){ var c=tone(t); return '<span class="ic" style="background:'+c[0]+';color:'+c[1]+'">'+ic(n,17)+'</span>'; }
function rowIc(n,color){ return '<span class="ric" style="background:'+color+'">'+ic(n,17,'#fff')+'</span>'; }
function tile(n,t,v,l,sm){ return '<div class="tile'+(sm?' sm':'')+'">'+(sm?'':badgeIc(n,t))+'<div class="v"'+(sm&&t?' style="color:'+tone(t)[1]+'"':'')+'>'+v+'</div><div class="l">'+l+'</div></div>'; }
function sec(t,a){ return '<div class="sec"><h2>'+t+'</h2>'+(a?'<a>'+a+'</a>':'')+'</div>'; }
function card(inner,o){ o=o||{}; return '<div class="card'+(o.flush?' flush':'')+'"'+(o.inset?' style="--inset:'+o.inset+'px"':'')+'>'+(o.h?'<div class="card-h">'+o.h+'</div>':'')+inner+'</div>'+(o.foot?'<div class="foot">'+o.foot+'</div>':''); }
function row(o){ return '<div class="row">'+(o.l||'')+'<div class="grow"><div class="n'+(o.reg?' r':'')+'"'+(o.nc?' style="color:'+o.nc+'"':'')+'>'+o.t+'</div>'+(o.m?'<div class="m">'+o.m+'</div>':'')+(o.x||'')+'</div>'+(o.r||'')+(o.chev?'<span class="chev">›</span>':'')+'</div>'; }
function seg(opts,on){ return '<div class="seg">'+opts.map(function(o,i){return '<span'+(i===on?' class="on"':'')+'>'+o+'</span>';}).join('')+'</div>'; }
function chips(opts,on){ return '<div class="chips">'+opts.map(function(o,i){return '<span class="chip'+(i===on?' on':'')+'">'+o+'</span>';}).join('')+'</div>'; }
function title(t,sub,right){ return '<div class="title-row"><div><div class="title">'+t+'</div>'+(sub?'<div class="subtitle">'+sub+'</div>':'')+'</div>'+(right||'')+'</div>'; }
function rbtn(n){ return '<span class="round-btn">'+ic(n,18)+'</span>'; }
function fld(l,v,ph){ return '<div class="fld"><label>'+l+'</label><div class="input'+(ph?' ph':'')+'">'+v+'</div></div>'; }
function frow(l,v,o){ o=o||{}; return '<div class="row">'+(o.ic||'')+'<span class="lab">'+l+'</span>'+(o.tog!==undefined?'<span class="tog'+(o.tog?' on':'')+'"></span>':'<span class="val">'+v+'</span>')+(o.chev?'<span class="chev">›</span>':'')+'</div>'; }
function chip(t,c){ return '<span class="chip '+(c||'')+'">'+t+'</span>'; }
function btn(t,c,i){ return '<div class="btn '+(c||'')+'">'+(i?ic(i,19):'')+t+'</div>'; }
function eur(n){ return n.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €'; }

var TABS = {
  admin:[['grid','Dashboard'],['list',"File d'attente"],['cal','Rendez-vous'],['card','Caisse'],['more','Plus']],
  poste:[['cal','Agenda'],['timer','Timer'],['wallet','Crédit'],['out','Déconnexion','dg']],
  agenda:[['cal','Agenda'],['timer','Timer'],['out','Déconnexion','dg']],
  caisse:[['card','Caisse'],['cal','Agenda'],['timer','Timer'],['out','Déconnexion','dg']],
  client:[['home','Accueil'],['plus','Réserver'],['user','Compte'],['out','Déconnexion','dg']]
};
function tabbar(kind,on){ if(!kind) return ''; return '<div class="tabbar">'+TABS[kind].map(function(t,i){return '<div class="tab'+(i===on?' on':'')+(t[2]?' '+t[2]:'')+'">'+ic(t[0],23)+t[1]+'</div>';}).join('')+'</div>'; }
var ADMIN_TOP = '<div class="topbar"><div class="salon-btn"><span class="salon-ic">'+ic('shop',15)+'</span>TBO Oyonnax <span style="color:var(--grey)">⌄</span></div>'+av('AT').replace('background:#0a84ff','background:var(--blue)')+'</div>';
function navbar(back,t,act){ return '<div class="nav-bar" style="position:relative"><span class="back">'+(back?'‹ '+back:'')+'</span><span class="t">'+(t||'')+'</span><span class="act">'+(act||'')+'</span></div>'; }

function phone(o){
  return '<div class="shot"><div class="cap">'+o.cap+'</div><div class="cap-sub">'+(o.sub||'')+'</div><div class="phone"><div class="screen">'+
    '<div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><span class="bat"></span></span></div>'+
    (o.top||'')+'<div class="scroll'+(o.bar?'':' nobar')+'">'+o.body+'</div>'+(o.over||'')+tabbar(o.bar,o.on)+'<div class="home-ind"></div></div></div></div>';
}
